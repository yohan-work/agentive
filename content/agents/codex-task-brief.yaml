evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Turning a scoped product or engineering request into a coding-agent handoff
    - "Teams with the required inputs ready: Goal, Repo context, Files involved"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The repository behavior, acceptance criteria, and non-goals are still undecided
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Contradicts itself on edge-case rules: the strong brief's URL contract says repeated keys 'resolve to \"no filter\"' while its test plan says 'first valid value wins'."
    - Adds requirements the user did not ask for and presents them as the contract (preserve utm_* params, debounce query writes, accept installable=true, back/forward acceptance criterion, empty top-nav submit clears query), which widens the task Codex is told to deliver.
    - "Ignores the 'quick' framing: the dark-mode brief asks for token migration, a three-way toggle, a no-flash head script, hard-coded color cleanup, WCAG AA checks, and screenshots."
    - "Runs long: the strong brief is about 9 sections with two tables, and some content restates the input verbatim, so it is heavier than a ticket usually needs."
    - In the boundary run it commits to a web and CSS-specific plan before asking whether the app is even web (the platform question comes last).
  evaluationCriteria:
    - Names files, constraints, acceptance checks, and explicit non-goals before implementation begins
    - Produces Task brief in a format that can be pasted into a ticket, PR, document, or handoff
