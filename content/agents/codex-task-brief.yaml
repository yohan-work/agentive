# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-006
slug: codex-task-brief
name: Codex Task Brief
summary: Creates precise implementation instructions for coding agents.
description: Use this agent before handing work to Codex or another coding assistant.
roles:
  - developer
  - pm
  - founder
categories:
  - development
  - automation
tags:
  - codex
  - task brief
  - implementation
difficulty: intermediate
automationLevel: 4
tools:
  - Codex
  - GitHub
  - ChatGPT
useCases:
  - Coding handoff
  - Bug fix briefing
  - Feature implementation plan
inputs:
  - Goal
  - Repo context
  - Files involved
  - Constraints
  - Acceptance criteria
outputs:
  - Task brief
  - Implementation steps
  - Test plan
  - Risks
prompt: You are a senior engineering task planner for Codex. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical coding-agent-ready task brief with clear sections, assumptions, risks, and next actions.
exampleInput: Implement localStorage bookmarks in a Next.js app.
exampleOutput: A scoped implementation brief with files, state model, edge cases, and tests.
limitations:
  - Needs accurate repo context.
bestPractices:
  - Include exact success criteria and non-goals.
realUseCases:
  - title: Codex Task Brief 실무 활용
    context: Coding handoff
    problem: Creates precise implementation instructions for coding agents. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 Codex Task Brief에게 Task brief 형태로 정리해 달라고 요청합니다.
    exampleInput: Implement localStorage bookmarks in a Next.js app. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: A scoped implementation brief with files, state model, edge cases, and tests.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Goal
    - Repo context
    - Files involved
    - Constraints
    - Acceptance criteria
  setupContextNotes:
    - Prepare the goal, known files, acceptance criteria, non-goals, and validation commands before running it.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Task brief
    - Implementation steps
    - Test plan
    - Risks
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Create a Codex brief for adding saved filters to a Next.js agent directory using localStorage only.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Task brief for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Plan a vague redesign request where the user only says the agents page should feel better.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Goal: add an installable-only filter to the agents page.
    Repo context: Next.js App Router, agent search lives in src/components/agents/agent-search-panel.tsx and filtering lives in src/lib/search.ts.
    Constraints: keep static data, no URL persistence in this pass.
    Acceptance criteria: checkbox filters installable agents, clear filters resets it, build and data checks pass.
  badInputExample: Make the agents page better for Codex.
  weakInputFixes:
    - weakInput: Help me with Codex Task Brief.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Create a Codex brief for adding saved filters to a Next.js agent directory using localStorage only. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Coding handoff. Optimize for Task brief, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Task brief
    - A clearly labeled Task brief section
    - A clearly labeled Implementation steps section
    - A clearly labeled Test plan section
    - A clearly labeled Risks section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Task brief
    - Includes Implementation steps
    - Includes Test plan
    - Includes Risks
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The brief asks Codex to infer repository structure instead of naming the relevant files
    - Acceptance criteria are phrased as taste preferences instead of observable behavior
    - Non-goals such as database work or URL state are omitted
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 5
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Turning a scoped product or engineering request into a coding-agent handoff
    - "Teams with the required inputs ready: Goal, Repo context, Files involved"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The repository behavior, acceptance criteria, and non-goals are still undecided
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Can become overly broad if the user asks it to define product strategy and implementation scope in one pass
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Names files, constraints, acceptance checks, and explicit non-goals before implementation begins
    - Produces Task brief in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Codex Task Brief strong-context run
      input: Create a Codex brief for adding saved filters to a Next.js agent directory using localStorage only.
      expectedOutputSummary: A usable Task brief with project-specific assumptions, risks, and next steps.
      sampleOutput: "Task brief: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Codex Task Brief boundary run
      input: Plan a vague redesign request where the user only says the agents page should feel better.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Turning a scoped product or engineering request into a coding-agent handoff
  - question: When should I choose something else?
    guidance: The repository behavior, acceptance criteria, and non-goals are still undecided
    alternativeAgentSlug: feature-requirements-analyst
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: qa-checklist-agent
relatedAgents:
  - feature-requirements-analyst
  - qa-checklist-agent
verifiedStatus: expert
updatedAt: 2026-07-01
