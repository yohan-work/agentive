  failureModes:
    - The brief asks Codex to infer repository structure instead of naming the relevant files
    - Acceptance criteria are phrased as taste preferences instead of observable behavior
    - Non-goals such as database work or URL state are omitted
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Turning a scoped product or engineering request into a coding-agent handoff
    - "Teams with the required inputs ready: Goal, Repo context, Files involved"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The repository behavior, acceptance criteria, and non-goals are still undecided
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Puts unrequested additions in Requirements instead of 'Suggested (not required)', breaking its own rule: WCAG AA 4.5:1 contrast in the dark-mode brief; amount verification, idempotency, and .env.example changes in the payment brief."
    - Fills gaps in detailed briefs with speculative, unrequested rules. The strong brief specifies multi-select encoding, repeated-param handling, and requirement 11 (sync on later URL changes), and the two samples disagree on multi-select encoding (comma-separated in sample 1, repeated keys in sample 2).
    - Some acceptance checks do not prove what they claim. `grep -r "TOSS_SECRET" .next/static` searches for the env var name, which is never inlined, rather than the secret value. The dark-mode checks are subjective ('main pages', 'readable text').
    - Long even when a case calls for brevity. The 'quick' dark-mode provisional brief runs about 430-500 words, and the strong brief is about 1,400-1,500 words with 15 requirements plus a 9-row manual check table.
    - Some context is stated as fact without verification. It assumes a shared constant for filter-chip values exists ('reuse the constant the filter chips are built from') without marking it [ASSUMPTION].
  evaluationCriteria:
    - Names files, constraints, acceptance checks, and explicit non-goals before implementation begins
    - Produces Task brief in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
