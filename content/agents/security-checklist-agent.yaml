  badInputExample: Help me with Security Checklist Agent.
  weakInputFixes:
    - weakInput: Help me with Security Checklist Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Review risks for a public submit-agent form before adding persistence. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 사용자 입력 폼과 API route를 배포하기 전 점검하는 상황. Optimize for security checklist, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - "Checklist grouped by the surfaces the user named: the risk in one line, how to check it (file, command, config, or test), the pass criterion, and severity if it fails"
    - "Gaps: risks the architecture cannot mitigate under the stated constraints, and what compensates"
    - One-line notes where a common risk does not apply to this architecture
    - Generic hardening ideas kept to one line each under "Also consider"
  outputChecklist:
    - Every component, data flow, and permission the user described has a concrete attack and an exact check
    - Each item has a pass criterion and a severity
    - Risks that do not apply are dismissed in one line with the reason
    - No configuration, versions, or findings were invented
    - Does not certify the system as secure or write a "no issues" statement
  failureModes:
    - Items name generic categories instead of the concrete attack on the named component
    - An item has no way to check it or no pass criterion
    - The checklist invents configuration, versions, or findings
    - The output certifies the system as secure or writes a "no issues" statement
  handoffTips:
