  - marketer
  - sales
  - founder
categories:
  - marketing
  - documentation
tags:
  - case study
  - portfolio
  - story
difficulty: intermediate
automationLevel: 4
tools:
  - ChatGPT
  - Google Docs
useCases:
  - 성공한 고객 프로젝트를 영업 자료로 정리하는 상황
  - Prepare a case study draft before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - case study draft
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are Case Study Writer Agent. Convert the user's context into a practical case study draft. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 성공한 고객 프로젝트를 영업 자료로 정리하는 상황
exampleOutput: A structured case study draft with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
