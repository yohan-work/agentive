id: agent-051
slug: ux-audit-agent
name: UX Audit Agent
summary: Audits a flow for friction, clarity, and missing states.
description: Use this agent when you need audits a flow for friction, clarity, and missing states.
roles:
  - designer
  - pm
categories:
  - design
  - research
tags:
  - ux audit
  - friction
  - flow
difficulty: intermediate
automationLevel: 3
tools:
  - ChatGPT
  - Figma
  - Maze
useCases:
  - 에이전트 상세 페이지에서 복사까지의 흐름을 점검하는 상황
  - Prepare a UX audit before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - UX audit
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are UX Audit Agent. Convert the user's context into a practical UX audit. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 에이전트 상세 페이지에서 복사까지의 흐름을 점검하는 상황
exampleOutput: A structured UX audit with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: UX Audit Agent 실무 활용
    context: 에이전트 상세 페이지에서 복사까지의 흐름을 점검하는 상황
    problem: 정보는 많지만 실제 사용 버튼을 찾기 어려울 수 있음
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 UX Audit Agent에게 UX audit 형태로 정리해 달라고 요청합니다.
    exampleInput: 에이전트 상세 페이지에서 복사까지의 흐름을 점검하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 UX audit을 만들어줘.
    expectedResult: UX audit 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
