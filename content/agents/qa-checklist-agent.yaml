# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-010
slug: qa-checklist-agent
name: QA Checklist Agent
summary: Builds practical QA checklists for releases and handoffs.
description: Use this agent to define what must be checked before shipping a product change.
roles:
  - developer
  - pm
  - designer
categories:
  - development
  - operations
tags:
  - qa
  - release
  - checklist
difficulty: beginner
automationLevel: 3
tools:
  - ChatGPT
  - Linear
  - Notion
useCases:
  - Release QA
  - Design QA
  - Regression testing
inputs:
  - Feature scope
  - Affected surfaces
  - Supported devices
  - Known risks
outputs:
  - QA checklist
  - Device matrix
  - Regression cases
prompt: You are a release QA lead. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical targeted QA checklist with clear sections, assumptions, risks, and next actions.
exampleInput: A responsive agent archive with bookmarks and copy prompt.
exampleOutput: Desktop/mobile checks, browser storage checks, and content QA.
limitations:
  - Needs target platform details for full coverage.
bestPractices:
  - Separate smoke tests from deep regression tests.
realUseCases:
  - title: QA Checklist Agent 실무 활용
    context: Release QA
    problem: Builds practical QA checklists for releases and handoffs. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 QA Checklist Agent에게 QA checklist 형태로 정리해 달라고 요청합니다.
    exampleInput: A responsive agent archive with bookmarks and copy prompt. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Desktop/mobile checks, browser storage checks, and content QA.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Feature scope
    - Affected surfaces
    - Supported devices
    - Known risks
  setupContextNotes:
    - List changed surfaces, supported devices, known risks, and what must not regress.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - QA checklist
    - Device matrix
    - Regression cases
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Create QA checks for agent detail exports on desktop and mobile.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce QA checklist for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Test an entire product launch with no feature list or supported browser matrix.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Feature: install kit export includes RUNBOOK.md and EVALUATION.md.
    Affected surfaces: agent detail page, install page, downloaded markdown files.
    Devices: desktop and mobile.
    Known risks: browser download blocking, stale copy, missing evaluation content.
  badInputExample: Make a QA list for the website.
  weakInputFixes:
    - weakInput: Help me with QA Checklist Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Create QA checks for agent detail exports on desktop and mobile. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Release QA. Optimize for QA checklist, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended QA checklist
    - A clearly labeled QA checklist section
    - A clearly labeled Device matrix section
    - A clearly labeled Regression cases section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes QA checklist
    - Includes Device matrix
    - Includes Regression cases
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The checklist ignores downloaded file contents
    - Mobile and desktop states are mixed into one vague item
    - Regression checks do not cover non-installable agents
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Release and handoff QA for defined features across pages, states, and devices
    - "Teams with the required inputs ready: Feature scope, Affected surfaces, Supported devices"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The expected behavior and supported environments are unknown
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Checklist quality drops when feature scope is provided without risk areas
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Splits smoke checks, regression checks, device coverage, and content verification
    - Produces QA checklist in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: QA Checklist Agent strong-context run
      input: Create QA checks for agent detail exports on desktop and mobile.
      expectedOutputSummary: A usable QA checklist with project-specific assumptions, risks, and next steps.
      sampleOutput: "QA checklist: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: QA Checklist Agent boundary run
      input: Test an entire product launch with no feature list or supported browser matrix.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Release and handoff QA for defined features across pages, states, and devices
  - question: When should I choose something else?
    guidance: The expected behavior and supported environments are unknown
    alternativeAgentSlug: pr-review-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: deployment-checklist-agent
relatedAgents:
  - pr-review-agent
  - deployment-checklist-agent
verifiedStatus: tested
updatedAt: 2026-07-01
