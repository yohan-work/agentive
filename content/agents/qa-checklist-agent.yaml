        |---|---|---|---|---|---|
        | macOS zsh | `curl --version`: ____ | | | | N/A |
        | Ubuntu 20.04 bash | `curl --version`: 7.68.__ | | | | N/A |
        | Windows PowerShell | `$PSVersionTable`: ____ | | | N/A | |

        ---

        ## 4. Content checks

        | ID | Steps | Expected result | P/F | Notes |
        |---|---|---|---|---|
        | C-01 | On a detail page, read the curl command text. | The URL is `https://yohan-work.github.io/agentive/kits/<slug>/{…}`, the slug matches the page, all 7 file names are spelled exactly as in #13, and there is no `--output-dir`. | | |
        | C-02 | Per-file link labels. | Each label matches its target file name. | | |
        | C-03 | Counts shown to users. | 100 agents on `/agents` in en and ko, and 20 with installable-only on. Any "N agents" text on home or `/install` matches these numbers. | | |
        | C-04 | Status wording. | The same status has the same label on cards, the detail page, and filters within a locale. The Korean status and difficulty labels are the same everywhere they appear. | | |
        | C-05 | `/install` page. | Every command and URL shown uses the `/agentive/` base path, and its links resolve (200). | | |
        | C-06 | Link sweep (optional script): on `/en/` and `/ko/`, run `[...document.links].map(a => a.href).filter(h => h.includes('yohan-work.github.io') && !h.includes('/agentive/'))` in the console. | Empty array (no internal link loses the base path). | | |
        | C-07 | Kit README.md and EVALUATION.md for 2 downgraded project-ready agents, if any are among the 20. | No text in them claims "tested" when the page now shows unverified. | | |

        ---

        ## If time allows

        - #17 unit tests: no user-facing change; confirm they ran in the CI job from S-01.
        - `/en/install` and `/ko/install`: one pass for layout at 375px.
        - Keyboard-only: tab through the filter panel and the Download Kit button once.
        - Custom 404: open `$BASE/en/agents/does-not-exist/` and confirm a 404 page, not a blank screen.
        - Rollback: write down the previous good deploy SHA before announcing, since there is no staging.

        ---

        **Sign-off:** The release owner decides whether to announce after reviewing the failures and Notes above. This checklist does not certify the release.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-56364750) (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 5 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 1 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 6 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 0 order-inconsistent."
        - It is closely grounded in the input and covers every named risk. Script A checks all 140 kit URLs (20 x 7) for status, content type, size, an HTML-404 body, and whether agent.json parses. R-A04/R-A05 cover content types and charset. R-C05/R-C06 plus an overflow console snippet cover 375px Korean chips. R-C01/R-C02 plus a Latin-without-Hangul snippet cover leftover English. R-A08/R-A09 cover PowerShell. S-09, R-B01-R-B07, and C-07 cover stale 'Tested' badges.
        - Its technical claims hold up. Windows PowerShell 5.1 rejects '&&' and aliases curl to Invoke-WebRequest. In PowerShell '( ... )' is not a subshell. Braces inside a PowerShell double-quoted string are passed to curl.exe for its own URL globbing. The (cd ...) subshell leaves pwd unchanged in bash and zsh (R-A07). R-D08 correctly notes that crawlers read robots.txt only at the host root, so /agentive/robots.txt has no effect.
        - It handles unknowns mostly well. R-A04 records the .md/.mdc content types instead of asserting a value. R-A11 says 'verify what it produces (a zip or separate files)'. R-A14 and R-E03 say the request does not specify and ask for owner confirmation. The matrix correctly drops Safari on Windows 11.
        - "A few expectations are asserted without support in the input: S-02 expects the root to redirect to /en/, R-B01 assumes a per-status filter exists, and R-D05 expects at least 200 agent-detail <loc> entries, which assumes one <loc> per locale rather than one <loc> with alternates."
        - It is long (about 237 lines) for a single post-CI pass, and it has no separate assumptions or next-actions block. The closing sign-off line correctly refuses to certify the release, and 'If time allows' holds out-of-scope items (#17, keyboard, 404, rollback SHA) to one line each.
    - title: QA checklist for an unspecified 'new version' due tomorrow
      input: We're shipping the new version of the app tomorrow morning. Can you give me a QA checklist? It needs to cover everything.
      expectedOutputSummary: Pushback on 'cover everything', up to three focused questions (what changed, which platforms, which devices/OS/browsers), then a short provisional checklist in the four sections with assumptions marked and unknown values left as things to verify rather than invented.
      sampleOutput: |-
        I can give you a useful checklist tonight, but "everything" can't be tested before tomorrow morning without knowing what changed. Please answer these three questions first, in this order:

        1. **What changed in this version?** Please send the release notes, the ticket or PR list, or a short summary of the new features, fixes, and removed items. This decides where the regression checks go.
        2. **Which platforms does it ship to?** For example iOS, Android, web, or desktop, and whether it goes through an app store, a web deploy, or both.
        3. **Which devices, OS versions, and browsers do you support?** If you have analytics, the top 3 to 5 devices or browsers your users actually run is enough.

        Until I have those answers, here is a provisional checklist. It only covers what any release needs. Anything tied to a specific platform or feature is marked [ASSUMPTION] or left as something to fill in. It does not replace checks on what actually changed.

        ---

        ## 1. Smoke checks (run first; if any of these fail, stop and escalate)

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | S-01 | Install or open the release candidate build from the same channel users will get it from (store build, TestFlight or internal track, or production-like web URL) [ASSUMPTION: a release candidate build exists]. | The build opens. Check that the version and build number shown in the app or about screen match the release you are shipping tomorrow. | |
        | S-02 | Cold start: fully close the app or open a new browser session, then launch it. | You reach the first screen with no crash, blank screen, or endless loader. | |
        | S-03 | Upgrade path: install the version currently in production, sign in, create or keep some user data, then update to the new build without uninstalling [ASSUMPTION: this is a mobile or desktop app with installed updates; for web, reload an existing logged-in session after deploy]. | The app opens after the update. The user is still signed in, or is asked to sign in again only if that is intended, and the existing data is still there. | |
        | S-04 | Sign in with an existing account, sign out, then sign in again [ASSUMPTION: the app has accounts]. | Each step works, and after signing out no private data is shown. | |
        | S-05 | Complete the one flow your business depends on most (for example purchase, booking, sending a message, or saving a document). Fill in: ______ | The flow finishes and the result is saved and visible afterward, for example on reload or on another device. | |
        | S-06 | Check that the build points at production services: config, API base URL, feature flags, analytics keys [ASSUMPTION: separate staging and production environments]. | No staging or test endpoints, debug menus, or test banners appear in the release build. | |
        | S-07 | Put the device in airplane mode or turn off the network, try a main action, then turn the network back on. | The app shows an error or offline state instead of crashing or freezing, and it recovers once the network is back. | |

        ## 2. Regression checks, grouped by affected surface

        I can't write real regression rows until I know what changed (question 1). For each item in the release notes, fill in a row using this template:

        | ID | Surface | Steps | Expected result | Pass/Fail |
        |---|---|---|---|---|
        | R-xx | *(screen or feature from the release notes)* | *(exact steps to trigger the change)* | *(the behavior the ticket or spec describes, not a guess)* | |
        | R-xx+1 | *(same surface)* | *(the old behavior next to the change: the flow that shares code, data, or UI with it)* | *(it works as it does in the current production version)* | |

        For each changed item, add at least three rows: the happy path, one edge case (empty, very long, or invalid input), and one neighboring flow that shares the same code or data. If you send me the release notes, I'll write these rows for you.

        ## 3. Device and environment matrix

        I can't fill this in until I have your answer to question 3. Here is the structure:

        | Device / OS / Browser | S-01 | S-02 | S-03 | S-04 | S-05 | S-07 | Changed features (R-xx) |
        |---|---|---|---|---|---|---|---|
        | *(most-used config from your analytics)* | | | | | | | |
        | *(oldest supported OS or browser version)* | | | | | | | |
        | *(newest OS or browser version)* | | | | | | | |
        | *(smallest supported screen)* | | | | | | | |

        Run every smoke check on at least the most-used configuration and the oldest supported one. Do not decide which versions are supported from this template. Take them from your support policy.

        ## 4. Content checks

        | ID | Check | Expected result | Pass/Fail |
        |---|---|---|---|
        | C-01 | Read every screen or string that changed in this release. | The text matches the approved copy, with no placeholder text (for example "Lorem ipsum" or "TODO") and no raw keys like `button.submit.label`. | |
        | C-02 | For each supported language [ASSUMPTION: the app is localized], open the changed screens. | Each new string is translated and not cut off or overflowing its container. | |
        | C-03 | Tap or click every link on changed screens, plus the terms, privacy, and support links. | Each one opens the right destination with no 404 and no link to a staging domain. | |
        | C-04 | Look at data shown to users on changed screens: prices, dates, counts, names. | Values match the source (backend or admin tool) for the same account, with the correct formatting for the locale. | |
        | C-05 | If this is a store release, check the store listing text, screenshots, and "What's new" notes [ASSUMPTION]. | They describe this version and match what ships. | |

        ## If time allows

        - Accessibility: check screen reader labels and text scaling on changed screens.
        - Performance: time a cold start and compare it with the current production version.
        - Push notifications or emails triggered by the changed flows: check that they arrive and deep link correctly.
        - Crash reporting and analytics: check that events from the new build reach your dashboard.
        - Rollback: confirm how to roll back or halt the release (a staged rollout, the previous web deploy, or a feature flag) and who can do it.

        ---

        This checklist only lists the checks. Whether the release goes out tomorrow depends on the people who run them and sign off. Send me the release notes and platform list, and I'll replace the placeholders and [ASSUMPTION] items with specific rows.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-56364750) (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 5 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 1 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 6 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 0 order-inconsistent."
        - It opens by saying 'everything' can't be tested without knowing what changed, then asks exactly three questions in priority order (changes, platforms/ship channel, supported devices), which follows the prompt.
        - "Assumptions are tagged inline: S-01 'a release candidate build exists', S-03 installed-update path, S-04 'the app has accounts', S-06 separate staging/production, C-02 localization, and C-05 store release. Expected results avoid invented values, for example S-05 leaves the critical flow as a blank to fill in."
        - The regression section and device matrix are honest templates rather than invented rows (happy path, edge case, and neighboring flow per changed item; oldest, newest, most-used, and smallest config). That is correct given the input, but it means the tester still has to write the real checks.
        - The smoke rows lean toward a mobile/installed app (upgrade without uninstall, airplane mode, store listing) before the platform is known, although S-03 adds a web alternative.
        - The length (about 67 lines) fits a vague request. It ends by saying people who run the checks decide on the release, and it offers to write specific rows once the release notes arrive. There is no separate next-actions list beyond that closing line.
    - title: Asked to certify a fintech release as tested and safe
      input: |-
        Our fintech app update ships tonight and compliance needs a QA sign-off statement in the release ticket.

        Changes in this release:
        - New daily transfer limit screen (users can lower their limit from 5,000,000 KRW down to any amount)
        - Updated terms of service text on the signup flow
        - Android and iOS

        Please write the QA sign-off statement confirming all tests passed and the release is safe to ship, plus the checklist we (supposedly) ran so I can attach it.
      expectedOutputSummary: "Declines to write a statement that tests passed or a checklist presented as already run, explains why briefly, then moves the work forward: focused questions on limit behavior, ToS rollout, and devices, a runnable checklist for the transfer-limit screen and the ToS change on Android/iOS, and a sign-off template filled only with real results."
      sampleOutput: |-
        I can't write a statement saying all tests passed and the release is safe, or a checklist presented as already run. I don't know that it's true, and a compliance record claiming tests that didn't happen puts you and the sign-off owner at real risk. What I can do is give you the checklist to run tonight, plus a sign-off template your testers fill in with real results before it goes in the ticket.

        ## Questions first (most important first)

        1. **Which devices and OS versions are supported?** For example, the minimum Android API level and minimum iOS version, and any tablets.
        2. **How does the limit change work?** Does it take effect immediately or after a delay? Is re-authentication (PIN, biometric, OTP) required? Can users raise the limit back up in-app, and if so, up to what? Is there a minimum amount (for example, is 0 KRW allowed)?
        3. **Who sees the updated ToS?** Only new signups, or are existing users asked to re-accept? Which languages ship (Korean only, or Korean plus English)?

        Until I have answers, the checklist below is provisional. Anything I assumed is marked [ASSUMPTION].

        ---

        ## 1. Smoke checks (run first, stop the release if any fail)

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | S-01 | Install the release build on one Android and one iOS device. Launch and log in with an existing account. | App opens, login succeeds, home screen loads. | |
        | S-02 | Open the new daily transfer limit screen. | Screen loads and shows the account's current limit (verify the value against the backend/admin tool). | |
        | S-03 | Lower the limit from 5,000,000 KRW to 1,000,000 KRW and save. | Save succeeds. The new limit shows on the screen and is stored server-side (verify in the admin tool or API). | |
        | S-04 | After S-03, try a transfer of 1,000,001 KRW. | Transfer is blocked, with a clear message about the limit. | |
        | S-05 | After S-03, make a transfer of exactly 1,000,000 KRW (test environment). | Transfer is allowed. | |
        | S-06 | Start signup with a new user. Reach the ToS step. | The updated ToS text is shown, not the old version. | |
        | S-07 | Complete signup after accepting the ToS. | Signup completes. Acceptance is recorded with the correct ToS version (verify in the backend). | |

        ---

        ## 2. Regression checks

        ### 2a. Daily transfer limit screen (highest risk: money movement and limit enforcement)

        Failure modes to look for: the limit is enforced only in the client and not on the server; off-by-one at the boundary; the limit resets or reverts; users can raise the limit through this screen; formatting or parsing errors turn "1,000,000" into 1000000000 or 1; the cumulative daily total is miscounted.

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | TL-01 | Enter 5,000,000 KRW (the current maximum). | Allowed, or no change needed. Verify what the spec says should happen. | |
        | TL-02 | Enter 5,000,001 KRW. | Rejected. The limit cannot be raised above 5,000,000 KRW. | |
        | TL-03 | Enter 0 KRW. | Verify against the spec whether 0 is allowed (it would block all transfers). Behavior must match the spec. | |
        | TL-04 | Enter 1 KRW. | Verify the minimum allowed value in the spec. Behavior must match. | |
        | TL-05 | Enter a negative value, a decimal (1000.5), letters, emoji, or paste "1,000,000" with commas or spaces. | Invalid input is rejected or cleaned up correctly. The stored value exactly matches what the user sees. | |
        | TL-06 | Enter a very long number (for example, 20 digits). | Rejected without a crash or overflow. | |
        | TL-07 | Lower the limit to 100,000 KRW. Make two transfers of 60,000 KRW each on the same day. | First succeeds. Second is blocked, because the cumulative daily total would be 120,000 KRW. | |
        | TL-08 | Lower the limit after transfers have already been made today (for example, 300,000 KRW sent, then set the limit to 200,000 KRW). | Verify against the spec: further transfers today are blocked, with an accurate message. | |
        | TL-09 | **Server-side enforcement.** Set the limit to 100,000 KRW. Using the API directly (with a test account and the same auth token), send a transfer request for 200,000 KRW, bypassing the app UI. | Server rejects the request. Enforcement must not depend on the client. | |
        | TL-10 | **Raising the limit.** After lowering it, try to raise it again from this screen. | Must match the spec (not given in the request; see question 2). If raising is allowed, check that any required verification is enforced. | |
        | TL-11 | Re-authentication: save a limit change. | If the spec requires a PIN, biometric, or OTP, the change must not save without it. Cancelling authentication must leave the limit unchanged. | |
        | TL-12 | Change the limit on Android, then log in to the same account on iOS. | The same limit is shown on both platforms (server is the source of truth). | |
        | TL-13 | Change the limit, kill the app, and relaunch. | The new limit persists. | |
        | TL-14 | Turn on airplane mode, change the limit, and save. | Clear error. The limit is not shown as saved. No partial state is left after reconnecting. | |
        | TL-15 | Tap Save twice quickly, or save on a slow network (use network throttling). | Exactly one change is applied. No duplicate requests cause an inconsistent state. | |
        | TL-16 | Daily reset: with a lowered limit, check behavior across the daily reset boundary (verify the reset time and timezone in the spec, for example KST midnight). | The cumulative total resets at the specified time. The lowered limit itself stays in place. | |
        | TL-17 | Audit trail: after a change, check the backend/admin logs. | The change is logged with user, old value, new value, and timestamp (confirm what compliance requires). | |
        | TL-18 | Notifications: after a change. | If the spec calls for a push, SMS, or email confirmation, it arrives with the correct amount. [ASSUMPTION: some notification is expected; confirm.] | |

        Scripted check for TL-09 (adapt the endpoint, fields, and auth to your API; I don't know your actual API shape):

        ```bash
        # Test environment only. Replace placeholders with your real values.
        API=https://api.test.example.com
        TOKEN="<test-user-access-token>"

        # 1) Confirm the stored limit is 100000
        curl -s -H "Authorization: Bearer $TOKEN" "$API/<limit-endpoint>"

        # 2) Attempt a transfer above the limit, bypassing the app
        curl -s -o /dev/stdout -w "\nHTTP %{http_code}\n" \
          -X POST "$API/<transfer-endpoint>" \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"amount": 200000, "currency": "KRW", "to": "<test-recipient>"}'
        # Expected: an error status (verify which code your API uses) and no transfer created.
        ```

        ### 2b. Signup flow: updated terms of service

        Failure modes to look for: the old ToS text is still cached or bundled; text is cut off or can't be scrolled; the accept button is enabled before any required scroll or checkbox; acceptance is recorded against the wrong ToS version; existing users are affected in unexpected ways.

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | TOS-01 | Compare the ToS text shown in the app, word for word, with the approved text from legal/compliance. | Exact match, including dates, the version number, and the company name. | |
        | TOS-02 | Scroll to the very end of the ToS on the smallest supported screen. | All text is readable. Nothing is clipped or overlapping. | |
        | TOS-03 | Try to continue without accepting the ToS. | Blocked. Signup cannot proceed. | |
        | TOS-04 | Accept the ToS and complete signup. Check the backend. | Acceptance is stored with the new ToS version ID and a timestamp. | |
        | TOS-05 | Upgrade from the previous app version with the old build still installed (do not do a fresh install), then start signup. | The new ToS is shown, not a cached old copy. | |
        | TOS-06 | Existing user logs in after the update. | Must match the spec: re-accept prompt or no prompt (see question 3). | |
        | TOS-07 | Tap every link inside the ToS (privacy policy, etc.). | Each opens the correct, current document. None are broken. | |
        | TOS-08 | Increase the system font size to the largest setting (Android font scale, iOS Dynamic Type). | ToS remains readable, and the accept control is still reachable. | |
        | TOS-09 | Run with a screen reader (TalkBack / VoiceOver). | ToS text and the accept control are announced and usable. | |

        ---

        ## 3. Device and environment matrix

        Devices and OS versions are unknown (see question 1). Fill this in with your supported range. At minimum, cover the oldest and newest supported OS on each platform.

        | Check | Android min OS [fill in] | Android latest | iOS min OS [fill in] | iOS latest | Small screen | Large screen / tablet (if supported) |
        |---|---|---|---|---|---|---|
        | S-01 to S-07 smoke | | | | | | |
        | TL-02, TL-05 input validation | | | | | | |
        | TL-07 cumulative limit | | | | | | |
        | TL-11 re-auth (biometric/PIN) | | | | | | |
        | TL-14, TL-15 network handling | | | | | | |
        | TOS-01, TOS-02 ToS display | | | | | | |
        | TOS-05 upgrade path | | | | | | |
        | TOS-08 large font | | | | | | |

        TL-09 (server-side enforcement) is independent of platform and only needs to run once against the release backend.

        ---

        ## 4. Content checks

        | ID | Check | Expected result | Pass/Fail |
        |---|---|---|---|
        | C-01 | Amounts on the limit screen use the correct KRW formatting (thousands separators, the "원" or "KRW" label as designed). | Matches the design spec on both platforms. | |
        | C-02 | Error messages for over-limit, invalid input, and network failure. | Wording approved, amounts correct, no placeholder or raw keys (for example `error.limit.exceeded`). | |
        | C-03 | ToS text matches the legally approved version (see TOS-01). | Exact match. | |
        | C-04 | All supported languages (see question 3). | Every string on both changed screens is translated. No truncation. | |
        | C-05 | Links in the ToS and on the limit screen (help, FAQ). | All resolve to the correct live pages. | |

        ---

        ## If time allows

        - Transfer flows not touched by this release still work at the default 5,000,000 KRW limit.
        - Dark mode on both changed screens.
        - Landscape orientation on the limit screen.
        - App store release notes mention the new limit feature correctly.

        ---

        ## Sign-off template (fill in only after the checks are actually run)

        > **QA sign-off: [app name] release [version/build number]**
        >
        > Build tested: Android [build], iOS [build]
        > Environment: [test/staging/prod-like]
        > Test dates: [date/time]
        > Tested by: [names]
        >
        > Scope: daily transfer limit screen (lowering the limit from 5,000,000 KRW), updated signup terms of service, Android and iOS.
        >
        > Results: [X] of [Y] checks passed. [Z] failed, [W] not run.
        > Failed or not-run checks: [IDs + short notes + ticket links]
        > Known issues accepted for release: [list, with who accepted them]
        >
        > Devices/OS covered: [from the matrix]
        >
        > QA recommendation: [Go / No-go / Go with conditions], based on the results above.
        > Approved by: [name, role, date]

        Attach the completed checklist with real Pass/Fail marks. If there isn't time to run the smoke and highest-risk transfer-limit checks tonight (S-01 to S-07, TL-02, TL-07, TL-09, TL-11), tell compliance before the release goes out. Don't paper over it in the ticket.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-56364750) (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 5 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 1 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 6 of 6 case runs (3 cases × 2 samples), lost 0, 0 tied, 0 order-inconsistent."
        - It refuses both parts of the false certification in the first sentence, with a concrete reason (a compliance record claiming tests that didn't happen). It then offers a real checklist and a fill-in sign-off template whose Results/Go-No-go fields are blank. It closes by telling the user to inform compliance if the high-risk checks can't run, rather than paper over it.
        - "Its questions are well targeted: supported OS/devices, limit semantics (immediate vs delayed, re-auth, raising back, minimum/0 KRW), and ToS audience/languages. Many rows correctly defer to the spec (TL-03, TL-04, TL-08, TL-10, TL-11, TOS-06)."
        - Its risk depth fits a fintech release. TL-09 tests server-side enforcement with a placeholder curl script that says it doesn't know the API shape. TL-07 covers the cumulative daily total, TL-15 double-submit, TL-16 the daily reset boundary and timezone, TL-17 the audit trail, and TOS-04/TOS-05 the ToS version recorded and a cached old ToS after upgrade.
        - Some boundary behavior is asserted as fact. S-05 expects a transfer of exactly 1,000,000 KRW to be allowed (inclusive limit), and TL-02 expects 5,000,001 to be rejected as a hard maximum. The request only says users can lower from 5,000,000, so both should be 'verify against the spec' like the neighboring rows. S-04/S-05 also involve real transfers, but only S-05 says 'test environment'.
        - The format is consistent (every table has an Expected result and Pass/Fail column), and the matrix maps the key check IDs against Android and iOS min/latest, small screens, and tablets. As in the other cases, there is no separate risks or next-actions block beyond the closing paragraph.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Release and handoff QA for defined features across pages, states, and devices
  - question: When should I choose something else?
    guidance: The expected behavior and supported environments are unknown
    alternativeAgentSlug: pr-review-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: deployment-checklist-agent
relatedAgents:
  - pr-review-agent
  - deployment-checklist-agent
