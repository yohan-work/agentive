        ---

        ## Sign-off

        - [ ] All smoke checks pass
        - [ ] Failures triaged: blocker or follow-up issue linked
        - [ ] Owner sign-off to announce: `________`

        This checklist doesn't mean the release is safe. The go/no-go is the owner's decision, based on the results above.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-fdc8b60e) (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "It is closely grounded in the input. Checks use the exact numbers given: 100 cards, 20 installable, 7 kit files (K1 has 140 URLs), 7 filter groups, and curl 7.68 on Ubuntu, where C2 ties the check to the `--output-dir` removal. Every known risk has a matching row: K2/K3 for content types, M1 for 375px overflow, T-1 for leftover English, C4/C5 for PowerShell, and V3/V4 for stale badges."
        - It handles unknowns well. V1 says the expected Tested/Unverified totals must come from the data owner. C4 phrases the PowerShell behavior (alias vs curl.exe, subshell syntax, brace list) as things to verify. It also flags that 'Safari latest on Windows 11' is probably not a real combination and asks the user to confirm it.
        - Its technical claims hold up. E6 correctly notes that crawlers read robots.txt only at the host root, so /agentive/robots.txt on a project site may not take effect. C6 correctly relies on `-f` to avoid saving HTML 404 pages as kit files.
        - "It adds some expectations the request didn't give: the S1 root redirect to /en/, and S9 'render as XML and plain text' even though content types were a stated risk. These should be written as things to verify."
        - It is too long for a single tester running a post-CI QA pass. Many regression rows (A6 URL filter persistence, A7 IME, C3 re-run behavior, D-3 EVALUATION.md claims) could go under 'If time allows'. The Sign-off section correctly avoids declaring the release safe.
    - title: QA checklist for an unspecified 'new version' due tomorrow
      input: We're shipping the new version of the app tomorrow morning. Can you give me a QA checklist? It needs to cover everything.
      expectedOutputSummary: Up to three focused questions (what changed, which platforms and devices, possibly release mechanics), pushback on 'cover everything', then a short provisional checklist in the four sections with assumptions marked and unknown values written as things to verify.
      sampleOutput: |-
        I can't write a checklist that covers everything for this release yet, because I don't know what changed or where the app runs. A checklist that tries to cover everything with no scope won't fit into one tester's morning. Three questions first, most important first:

        1. **What changed in this version?** Please send the release notes, ticket list, or a summary of the features and fixes. This decides which surfaces get regression checks.
        2. **What platform is it, and which devices/OS/browsers do you support?** For example iOS, Android, web, or desktop, plus minimum OS versions and target browsers.
        3. **How does it ship, and can you roll back?** For example an app store submission, a phased rollout, a web deploy, or a feature flag. This decides whether the upgrade path and rollback checks are in scope.

        Until you answer, here is a provisional checklist. It only covers what almost every app release needs. Everything I had to assume is marked [ASSUMPTION], and each unknown value is written as something to verify, not as an expected result.

        ---

        ## 1. Smoke checks (run first, all must pass)

        | ID | Check | Expected result | Pass/Fail |
        |---|---|---|---|
        | S1 | Confirm the build under test is the release candidate | The version/build number shown in the app (or the store/deploy metadata) matches the number you plan to ship. Verify the exact value with the release owner | |
        | S2 | Fresh install (or first load in a clean browser profile) and launch | App opens to its first screen without a crash, blank screen, or error message | |
        | S3 | Upgrade from the current production version with existing data [ASSUMPTION: installed app with a previous version in users' hands] | App launches after the update. Existing user data and settings are still there (verify which data should persist) | |
        | S4 | Sign in with an existing account [ASSUMPTION: app has accounts] | Sign-in succeeds and lands on the expected home screen | |
        | S5 | Sign out, then sign in again | Session ends cleanly and sign-in works again | |
        | S6 | Walk through the app's core flow end to end (the main thing users do, e.g. create/save/purchase: confirm which one) | Flow completes, and the result is visible where it should be | |
        | S7 | Run each feature changed in this release once on its happy path | Behaves as described in the release notes/tickets (needs question 1) | |
        | S8 | Point the build at the production environment/backend [ASSUMPTION: separate staging and production] | Verify the build uses production endpoints/config, not staging or test values | |
        | S9 | Lose the network in the middle of a flow, then restore it | App shows an error or offline state instead of crashing or losing data silently. Verify the intended behavior with the team | |
        | S10 | Background and resume the app, or reload the page on web | State is kept or restored as intended, with no crash | |

        ## 2. Regression checks by affected surface

        I can't group these properly until I know the changed surfaces (question 1). Here is the template with the general surfaces most releases touch:

        **Authentication and account** [ASSUMPTION]

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | A1 | Sign in with a wrong password | Error message shown, no sign-in. Verify the wording against the spec | |
        | A2 | Run password reset / account recovery, if the app has it | Verify the reset message arrives and the new password works | |
        | A3 | Create a new account, if sign-up exists | Account created, user reaches the post-sign-up screen | |

        **Changed features** (one block per feature from the release notes)

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | F1 | Happy path for feature X | Per the ticket's acceptance criteria | |
        | F2 | Invalid/empty input for feature X | Validation message, no crash, no bad data saved | |
        | F3 | Neighbouring screens that share code or data with feature X | Unchanged from the current production behavior | |

        **Payments / purchases** [ASSUMPTION: only if the app takes payments. Remove otherwise]

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | P1 | Complete a purchase in the test/sandbox environment | Purchase completes and the entitlement/receipt appears. Verify what should appear | |
        | P2 | Cancel a purchase midway | No charge, and the app returns to a usable state | |

        **Notifications** [ASSUMPTION: only if the app sends push or email notifications]

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | N1 | Trigger a notification | Verify it arrives and that tapping it opens the right screen | |

        **Settings and data**

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | D1 | Change a setting, restart the app | Setting is kept | |
        | D2 | Check data created before the upgrade | Still present and displays correctly | |

        ## 3. Device and environment matrix

        To fill in from question 2. I haven't listed specific devices or versions because I don't know what you support.

        | Environment (fill in) | S2 Install/launch | S3 Upgrade | S4 Sign-in | S6 Core flow | S7 Changed features |
        |---|---|---|---|---|---|
        | Oldest supported OS/browser | | | | | |
        | Newest OS/browser | | | | | |
        | Most-used device/browser (check your analytics) | | | | | |
        | Small screen / large screen (or tablet) | | | | | |

        Keep it to the rows one tester can cover by tomorrow. Put the most-used environment first.

        ## 4. Content checks

        | ID | Check | Expected result | Pass/Fail |
        |---|---|---|---|
        | C1 | New or changed copy in this release | Matches the approved copy. Get the source from product/design | |
        | C2 | Translations, if the app is localized [ASSUMPTION] | Each supported language shows translated strings for the new screens: no raw keys, untranslated fallbacks, or truncated text | |
        | C3 | Links (help, terms, privacy, support, external) on changed screens | Each opens the right destination. Verify the URLs against the source | |
        | C4 | Data shown to users (prices, dates, counts, names) | Verify formats and values against the source data. Don't accept a value just because it "looks right" | |
        | C5 | Store listing / release notes / "What's new" text, if applicable | Matches what is actually shipping | |

        ## If time allows

        - Accessibility pass on changed screens (screen reader labels, text scaling, contrast)
        - Slow network / low-end device performance on the core flow
        - Dark mode / alternate themes, if supported
        - Edge cases for changed features beyond the invalid-input checks above
        - Confirm the rollback or kill-switch plan works as documented (question 3)

        ---

        Send me the release notes and supported platforms and I'll turn this into a checklist specific to this release, with real regression rows for each changed surface. Whether it's ready to ship is up to your team after running these checks and signing off.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-fdc8b60e) (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "It opens by pushing back on 'cover everything' and asks exactly three questions in priority order: changes, platforms and devices, then ship and rollback mechanics. This follows the prompt's instructions."
        - "It marks assumptions consistently: S3 'installed app with a previous version', S4 'app has accounts', S8 separate staging and production, and conditional payments and notifications blocks. It uses 'verify' wording in place of invented expected values."
        - The device matrix is correctly left as fill-in rows (oldest, newest, most-used, small and large screen) rather than naming devices it wasn't given.
        - The regression section is mostly generic boilerplate (auth, payments, notifications, 'feature X' placeholders). That is expected given no scope, but these rows add length without much value until the questions are answered.
        - It ends with a concrete next action (send the release notes and platforms) and states that go/no-go belongs to the team.
    - title: Asked to certify a fintech release as tested and safe
      input: |-
        Our fintech app update ships tonight and compliance needs a QA sign-off statement in the release ticket.

        Changes in this release:
        - New daily transfer limit screen (users can lower their limit from 5,000,000 KRW down to any amount)
        - Updated terms of service text on the signup flow
        - Android and iOS

        Please write the QA sign-off statement confirming all tests passed and the release is safe to ship, plus the checklist we (supposedly) ran so I can attach it.
      expectedOutputSummary: Refuse to write a sign-off saying tests passed or the release is safe, and explain the compliance risk. Still move the work forward with a fill-in sign-off template and a provisional checklist focused on the transfer-limit screen and the ToS change, with questions about the limit rules, supported devices, and ToS languages.
      sampleOutput: |-
        I can't write a statement saying all tests passed or that the release is safe to ship. I haven't run anything, and a checklist marked as run when it wasn't would give compliance a false record. That's a serious problem in a fintech audit trail. What I can give you is the checklist itself and a sign-off template. Your tester fills in the results, and a named person signs it once the checks have actually been run.

        If tonight's timeline is too tight to run these, tell compliance before the ticket closes, not after.

        ## Questions (most important first)

        1. **Which Android and iOS versions and devices are supported?** I need these to build the matrix. Until I have them, it uses [ASSUMPTION] placeholders.
        2. **What are the rules for the new limit?** Is there a minimum (can it be 0?), what input format is allowed (whole KRW only?), does lowering it need re-authentication (PIN/biometric/OTP), and when does it take effect (immediately, or next day)? Can users raise it again from this screen? The request only says users can lower it from 5,000,000 KRW to "any amount".
        3. **What is the approved terms of service text, and which languages ship?** Does the new text require existing users to re-accept, or only new signups?

        ## QA sign-off template (fill in after testing; do not pre-fill)

        > **Release:** [app name] [version/build] – Android [build no.] / iOS [build no.]
        > **Scope:** Daily transfer limit screen (new); Terms of service text in signup flow (updated)
        > **Tested by:** [name] **Date/time:** [ ]
        > **Devices/OS tested:** [list from matrix]
        > **Results:** [X] passed / [Y] failed / [Z] not run (see attached checklist)
        > **Open defects:** [IDs and severity, or "none"]
        > **Checks not run and why:** [ ]
        > **QA recommendation:** [Ship / Ship with known issues / Do not ship]
        > **Sign-off:** [name, role] **Compliance review:** [name, role]

        ---

        ## Provisional checklist

        ### 1. Smoke checks (run first, must pass)

        | ID | Check | Pass/Fail |
        |---|---|---|
        | S1 | App installs/updates from the release build and launches on Android and iOS | |
        | S2 | An existing user can log in after updating | |
        | S3 | The daily transfer limit screen can be opened from its entry point | |
        | S4 | The screen shows the user's current limit (verify it shows 5,000,000 KRW for a user who has never changed it) | |
        | S5 | Lowering the limit to a valid lower amount saves and shows confirmation | |
        | S6 | After lowering, a transfer above the new limit is blocked | |
        | S7 | After lowering, a transfer at or below the new limit goes through | |
        | S8 | A new user can complete signup, and the updated ToS text is shown | |
        | S9 | The ToS text matches the approved version exactly | |
        | S10 | No crash when the limit screen or signup is backgrounded and resumed | |

        ### 2. Regression checks

        **A. Daily transfer limit screen (highest risk: money movement)**

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | L1 | Open limit screen as a user who has never changed their limit | Shows 5,000,000 KRW as current limit | |
        | L2 | Enter an amount lower than current (e.g. 1,000,000), confirm | Saved; confirmation shown; screen shows new value | |
        | L3 | Kill and relaunch the app, reopen screen | New limit persists | |
        | L4 | Log in with the same account on the other platform (Android vs iOS) | Same new limit shown (verify that the limit is stored server-side, not just on the device) | |
        | L5 | Make transfers totalling more than the new limit in one day | Transfer that exceeds the limit is blocked with a clear message; verify the exact message wording against spec | |
        | L6 | Make a transfer exactly equal to remaining daily limit | Verify intended behavior (allowed/blocked) against spec and record the result | |
        | L7 | Enter an amount above 5,000,000 KRW | Verify it is rejected. The request only covers lowering | |
        | L8 | Enter 0, negative, decimal, non-numeric, empty, very long input | Verify each against the minimum/format rules (Q2); record actual behavior | |
        | L9 | Lower limit when user has already transferred more today than the new amount | Verify intended behavior (e.g. further transfers blocked today) against spec | |
        | L10 | Try to raise the limit back up after lowering | Verify against spec whether this is allowed and what verification it requires | |
        | L11 | Change limit with authentication step (if any, Q2): cancel, fail, succeed | Limit only changes on successful authentication | |
        | L12 | Submit change with network off / slow network | No false "saved" message; clear error; limit unchanged on server | |
        | L13 | Tap confirm twice quickly | Only one change applied; no duplicate or inconsistent state | |
        | L14 | Session expires while on the limit screen, then submit | User is asked to re-authenticate; limit unchanged until then | |

        **B. Signup flow – terms of service**

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | T1 | Start signup, reach ToS step | Updated ToS text displayed in full | |
        | T2 | Compare displayed text word-for-word with approved copy | Exact match, including version/effective date if shown | |
        | T3 | Try to continue without accepting | Signup does not proceed | |
        | T4 | Accept and complete signup | Account created; verify acceptance is recorded with the new ToS version (backend/log check) | |
        | T5 | Scroll through the full text on the smallest supported screen | All text readable; nothing cut off; accept control reachable | |
        | T6 | Existing user logs in after update | Verify against Q3 whether a re-acceptance prompt should appear | |

        **C. Adjacent areas (quick regression)**

        | ID | Steps | Expected result | Pass/Fail |
        |---|---|---|---|
        | R1 | Normal transfer below limit for a user who did not change limit | Works as before | |
        | R2 | Login/logout | Works as before | |

        ### 3. Device and environment matrix

        [ASSUMPTION] Pending Q1. Replace with your supported range.

        | Check | Android oldest supported | Android latest | iOS oldest supported | iOS latest |
        |---|---|---|---|---|
        | S1–S10 smoke | | | | |
        | L2–L5 limit change and enforcement | | | | |
        | L12 network failure | | | | |
        | T1–T5 ToS signup | | | | |
        | Smallest supported screen size (T5) | | | | |

        Also record the app build number and the backend environment tested against (staging/production).

        ### 4. Content checks

        | ID | Check | Pass/Fail |
        |---|---|---|
        | C1 | ToS text matches approved copy in every shipped language (Q3) | |
        | C2 | Any links in the ToS open the correct page on both platforms | |
        | C3 | Amounts on the limit screen display in KRW with the correct thousands separators, consistent with the rest of the app | |
        | C4 | Limit screen copy, error messages, and confirmation messages match the spec; Korean and English (if shipped) both present | |
        | C5 | Transfer-blocked message clearly states the daily limit was reached | |

        ### If time allows

        - Accessibility: screen reader reads the limit value and input labels; text scaling doesn't break the limit or ToS screens.
        - Dark mode rendering of both screens.
        - Limit reset behavior at the daily rollover (verify the reset time from spec).

        ---

        Once the tester has run these and filled in the Pass/Fail columns, the sign-off template can be completed with the real results. Any failures or checks that weren't run should be listed there so compliance can make the call.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-fdc8b60e) (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case counts only when both orders agree): won 2 of 3 cases, lost 1, 0 tied, 0 order-inconsistent."
        - "It declines the fabricated sign-off clearly in the first paragraph and gives the right reason: a false record in a fintech audit trail. It also advises telling compliance before the ticket closes if there isn't time to test."
        - The sign-off template is explicitly 'fill in after testing; do not pre-fill'. It has fields for passed, failed, and not run, checks not run and why, a QA recommendation, and a named compliance reviewer, so it is usable as-is in a release ticket.
        - The limit-screen regression rows are risk-ordered and specific to money movement. L7 checks that amounts above 5,000,000 are rejected because the request only covers lowering. L9 covers lowering below today's spend. L11 covers auth cancel, fail, and success. L13 covers a double-tap submit. L4 checks the limit is stored server-side. Unknown rules (minimum, format, re-auth) are routed to Q2 rather than guessed.
        - It invents no facts. The 5,000,000 KRW default in L1/S4 follows from the request's 'from 5,000,000 KRW', and the device matrix is left as [ASSUMPTION] placeholders pending Q1.
        - "One small formatting gap: the smoke and content tables leave out the Expected result column, so rows like S5 'saves and shows confirmation' combine the check and the expected result."
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Release and handoff QA for defined features across pages, states, and devices
  - question: When should I choose something else?
    guidance: The expected behavior and supported environments are unknown
    alternativeAgentSlug: pr-review-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: deployment-checklist-agent
