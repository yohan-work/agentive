id: agent-023
slug: customer-persona-agent
name: Customer Persona Agent
summary: Creates useful customer personas from research notes and business context.
description: Use this agent to synthesize audience data into actionable personas for messaging and product decisions.
roles:
  - marketer
  - pm
  - founder
  - designer
categories:
  - research
  - marketing
tags:
  - persona
  - audience
  - research
difficulty: beginner
automationLevel: 3
tools:
  - ChatGPT
  - Notion
  - Sheets
useCases:
  - Audience definition
  - Messaging planning
  - Product discovery
inputs:
  - Research notes
  - Product
  - Audience signals
  - Goals
outputs:
  - Personas
  - Jobs to be done
  - Objections
  - Messaging angles
prompt: You are a customer research synthesizer. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical customer persona set with clear sections, assumptions, risks, and next actions.
exampleInput: Notes from interviews with freelance designers buying admin tools.
exampleOutput: Three personas with motivations, pain points, objections, and triggers.
limitations:
  - Personas are weak without real research inputs.
bestPractices:
  - Mark assumptions separately from observed facts.
