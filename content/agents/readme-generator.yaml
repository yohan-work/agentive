prompt: You are a software documentation writer. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical concise README with clear sections, assumptions, risks, and next actions.
exampleInput: |-
  Write a README.md for a new small open-source project. Keep it concise — it's a CLI, not a framework.

  Project name: agentkit-cli
  Purpose: a zero-config Node CLI that installs "install kits" from Agent Archive (https://yohan-work.github.io/agentive/) into your repo. Each project-ready agent in the archive publishes 7 files at stable URLs: https://yohan-work.github.io/agentive/kits/<slug>/{AGENTS.md,CLAUDE.md,cursor-rule.mdc,agent.json,README.md,RUNBOOK.md,EVALUATION.md}. Today users copy a curl one-liner per agent; this CLI does it for many agents at once and merges into existing files safely.

  Tech stack: TypeScript, Node >= 20.9, commander for args, undici fetch, vitest for tests, tsup for bundling, published to npm as `agentkit-cli`. MIT license. Repo: github.com/yohan-work/agentkit-cli.

  Features (all implemented in v0.3.0):
  - `agentkit add <slug...>` downloads kits into ./agent-kits/<slug>/
  - `agentkit add <slug> --target codex|claude|cursor` also appends the instructions to AGENTS.md / CLAUDE.md, or writes .cursor/rules/<slug>.mdc
  - Appends are wrapped in `<!-- agentkit:<slug>:start -->` / `<!-- agentkit:<slug>:end -->` markers, so re-running updates in place instead of duplicating
  - `agentkit remove <slug>` removes the marked block and the kit folder
  - `agentkit list` shows installed kits and their agent.json version
  - `--dry-run` prints the diff without writing
  - `--base-url` for self-hosted mirrors of the archive
  - Exits non-zero if any file 404s; never overwrites files outside marked blocks

  Setup / scripts:
  ```
  npm install
  npm run build      # tsup -> dist/
  npm test           # vitest run
  npm run lint       # eslint
  npm run typecheck  # tsc --noEmit
  npm link           # try the CLI locally
  ```
  Usage example: `npx agentkit-cli add pr-review-agent test-case-generator --target claude`

  Known limitations: no Windows CI yet (works on macOS/Linux in CI); no offline cache; no signature verification of downloaded files.

  Roadmap: Windows CI, `agentkit update` to refresh all installed kits, checksum verification using agent.json, a `--pack <starter-pack>` option.

  Audience: developers using Codex, Claude Code, or Cursor. Include getting started, scripts, and a roadmap section.
exampleOutput: |-
  Here's the README. I kept it short and made a few assumptions, which are listed under the file.

  ````markdown
  # agentkit-cli

  A zero-config Node CLI that installs agent **install kits** from [Agent Archive](https://yohan-work.github.io/agentive/) into your repo. It handles many agents at once and merges into existing files safely.

  Without it, you run one curl command per agent. With it:

  ```bash
  npx agentkit-cli add pr-review-agent test-case-generator --target claude
  ```

  ## What gets installed

  Every project-ready agent in the archive publishes 7 files at stable URLs:

  ```
  https://yohan-work.github.io/agentive/kits/<slug>/
    AGENTS.md  CLAUDE.md  cursor-rule.mdc  agent.json  README.md  RUNBOOK.md  EVALUATION.md
  ```

  `agentkit add` downloads them to `./agent-kits/<slug>/`. If you pass `--target`, it also wires the agent into your tool's config:

  | `--target` | Writes to |
  |---|---|
  | `codex`  | appends to `AGENTS.md` |
  | `claude` | appends to `CLAUDE.md` |
  | `cursor` | writes `.cursor/rules/<slug>.mdc` |

  Each append is wrapped in markers:

  ```md
  <!-- agentkit:pr-review-agent:start -->
  ...
  <!-- agentkit:pr-review-agent:end -->
  ```

  When you run the command again, it updates the block in place instead of adding a second copy. **agentkit never changes content outside its own marked blocks.**

  ## Getting started

  Requires **Node >= 20.9**.

  ```bash
  # one-off
  npx agentkit-cli add <slug...>

  # or install globally
  npm install -g agentkit-cli
  agentkit add <slug...>
  ```

  Find slugs on [Agent Archive](https://yohan-work.github.io/agentive/). They're in each agent's URL.

  ## Usage

  ```bash
  agentkit add <slug...>                        # download kits to ./agent-kits/<slug>/
  agentkit add <slug> --target codex|claude|cursor
  agentkit remove <slug>                        # remove the marked block and the kit folder
  agentkit list                                 # installed kits and their agent.json version
  ```

  | Option | Description |
  |---|---|
  | `--target <tool>` | `codex`, `claude`, or `cursor` (see table above) |
  | `--dry-run` | Print the diff without writing anything |
  | `--base-url <url>` | Use a self-hosted mirror of the archive |

  **Exit codes:** the command exits non-zero if any kit file returns 404.

  Tip: run with `--dry-run` first on repos that already have an `AGENTS.md` or `CLAUDE.md`.

  ## Development

  ```bash
  npm install
  npm run build      # tsup -> dist/
  npm test           # vitest run
  npm run lint       # eslint
  npm run typecheck  # tsc --noEmit
  npm link           # try the `agentkit` command locally
  ```

  Stack: TypeScript, commander, undici fetch, vitest, tsup.

  ## Known limitations

  - **No Windows CI yet.** It's tested in CI on macOS and Linux only.
  - **No offline cache.** Every `add` fetches from the network.
  - **No signature or checksum verification.** Downloaded files are trusted as served. Only use `--base-url` with mirrors you control or trust, and review the diff (`--dry-run`) before committing, because these files become instructions for your coding agent.

  ## Roadmap

  - [ ] Windows CI
  - [ ] `agentkit update` to refresh all installed kits
  - [ ] Checksum verification using `agent.json`
  - [ ] `--pack <starter-pack>` to install a curated set of agents at once

  ## Contributing

  Issues and PRs are welcome at [github.com/yohan-work/agentkit-cli](https://github.com/yohan-work/agentkit-cli). Please run `lint`, `typecheck`, and `test` before you open a PR.

  ## License

  MIT
  ````

  **Assumptions to check:**
  1. The npm bin name is `agentkit`, so `npx agentkit-cli …` and a global `agentkit …` both work.
  2. `--target claude` appends the kit's `CLAUDE.md`, and `--target codex` appends its `AGENTS.md`.
  3. `--target` takes one value per run. If it accepts several (for example `--target claude,cursor`), update the usage line.
  4. I left out a "what happens on a partial failure" line, because the brief doesn't say whether files already written are rolled back when one 404s.

  **Risk to note:** The biggest one is unverified downloads that turn into agent instructions (a prompt-injection risk). I called it out under limitations instead of hiding it. Once checksum verification ships, change that bullet.

  **Next actions:**
  - Confirm the four assumptions above.
  - Add a `CHANGELOG.md` entry for v0.3.0.
  - Add npm version and CI badges under the title once the CI workflow URL is final.
limitations:
  - Will not infer hidden setup requirements.
bestPractices:
  - Include exact environment variables if any.
realUseCases:
  - title: README Generator 실무 활용
    context: New repo docs
    problem: Creates a concise README for a software project. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 README Generator에게 README draft 형태로 정리해 달라고 요청합니다.
    exampleInput: Next.js app for browsing AI agents. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Overview, features, tech stack, install commands, roadmap.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Project purpose
    - Tech stack
    - Setup commands
    - Features
  setupContextNotes:
    - Prepare package scripts, setup steps, environment variables, core features, and validation commands.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - README draft
    - Getting started
    - Scripts
    - Roadmap
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Update the Agent Archive README after adding install kits and evaluations.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce README draft for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Write complete onboarding docs for a repo without reading its config.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Next.js app for browsing AI agents.

    Goal: produce README draft for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with README Generator.
  weakInputFixes:
    - weakInput: Help me with README Generator.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Update the Agent Archive README after adding install kits and evaluations. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for New repo docs. Optimize for README draft, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended README draft
    - A clearly labeled README draft section
    - A clearly labeled Getting started section
    - A clearly labeled Scripts section
    - A clearly labeled Roadmap section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes README draft
    - Includes Getting started
    - Includes Scripts
    - Includes Roadmap
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Creating or refreshing project documentation from known setup and feature details
    - "Teams with the required inputs ready: Project purpose, Tech stack, Setup commands"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Environment variables, deployment steps, or project purpose are unknown
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - The boundary draft nests ```bash blocks inside an outer ```markdown fence, so the first inner fence closes the outer block and the draft cannot be pasted and rendered as one unit. The strong run avoided this by using four-backtick fences.
    - When facts are missing it still fills a features list with guessed domain examples ("Record income and expense entries", "JSON/CSV/SQLite"). They are marked as examples, but they invite copy-paste of invented content.
    - It adds small unrequested claims that the brief does not support, e.g. "Find slugs ... They're in each agent's URL" and a global `npm install -g` path that depends on an assumed bin name.
    - The assumptions, risks, and next-actions sections come after the README instead of inside it. That fits the criteria, but it means the user has to strip them out before committing the file.
  evaluationCriteria:
    - Documents purpose, features, setup, scripts, validation, and roadmap accurately
    - Produces README draft in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
