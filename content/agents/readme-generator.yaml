id: agent-009
slug: readme-generator
name: README Generator
summary: Creates a concise README for a software project.
description: Use this agent to document project purpose, setup, scripts, features, and roadmap.
roles:
  - developer
  - founder
categories:
  - documentation
  - development
tags:
  - readme
  - docs
  - setup
difficulty: beginner
automationLevel: 3
tools:
  - ChatGPT
  - GitHub
useCases:
  - New repo docs
  - Open-source preparation
