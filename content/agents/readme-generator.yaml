# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-009
slug: readme-generator
name: README Generator
summary: Creates a concise README for a software project.
description: Use this agent to document project purpose, setup, scripts, features, and roadmap.
roles:
  - developer
  - founder
categories:
  - documentation
  - development
tags:
  - readme
  - docs
  - setup
difficulty: beginner
automationLevel: 3
tools:
  - ChatGPT
  - GitHub
useCases:
  - New repo docs
  - Open-source preparation
  - Internal onboarding
inputs:
  - Project purpose
  - Tech stack
  - Setup commands
  - Features
outputs:
  - README draft
  - Getting started
  - Scripts
  - Roadmap
prompt: You are a software documentation writer. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical concise README with clear sections, assumptions, risks, and next actions.
exampleInput: Next.js app for browsing AI agents.
exampleOutput: Overview, features, tech stack, install commands, roadmap.
limitations:
  - Will not infer hidden setup requirements.
bestPractices:
  - Include exact environment variables if any.
realUseCases:
  - title: README Generator 실무 활용
    context: New repo docs
    problem: Creates a concise README for a software project. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 README Generator에게 README draft 형태로 정리해 달라고 요청합니다.
    exampleInput: Next.js app for browsing AI agents. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Overview, features, tech stack, install commands, roadmap.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Project purpose
    - Tech stack
    - Setup commands
    - Features
  setupContextNotes:
    - Prepare package scripts, setup steps, environment variables, core features, and validation commands.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - README draft
    - Getting started
    - Scripts
    - Roadmap
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Update the Agent Archive README after adding install kits and evaluations.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce README draft for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Write complete onboarding docs for a repo without reading its config.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Next.js app for browsing AI agents.

    Goal: produce README draft for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with README Generator.
  weakInputFixes:
    - weakInput: Help me with README Generator.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Update the Agent Archive README after adding install kits and evaluations. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for New repo docs. Optimize for README draft, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended README draft
    - A clearly labeled README draft section
    - A clearly labeled Getting started section
    - A clearly labeled Scripts section
    - A clearly labeled Roadmap section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes README draft
    - Includes Getting started
    - Includes Scripts
    - Includes Roadmap
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Creating or refreshing project documentation from known setup and feature details
    - "Teams with the required inputs ready: Project purpose, Tech stack, Setup commands"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Environment variables, deployment steps, or project purpose are unknown
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - May omit hidden setup requirements unless scripts and config are supplied
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Documents purpose, features, setup, scripts, validation, and roadmap accurately
    - Produces README draft in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: README Generator strong-context run
      input: Update the Agent Archive README after adding install kits and evaluations.
      expectedOutputSummary: A usable README draft with project-specific assumptions, risks, and next steps.
      sampleOutput: "README draft: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: README Generator boundary run
      input: Write complete onboarding docs for a repo without reading its config.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Creating or refreshing project documentation from known setup and feature details
  - question: When should I choose something else?
    guidance: Environment variables, deployment steps, or project purpose are unknown
    alternativeAgentSlug: policy-doc-writer
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: codex-task-brief
relatedAgents:
  - policy-doc-writer
  - codex-task-brief
verifiedStatus: tested
updatedAt: 2026-07-01
