    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - README draft
    - Getting started
    - Scripts
    - Roadmap
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Update the Agent Archive README after adding install kits and evaluations.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce README draft for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Go deep on the risks and constraints listed above.
        - Mark assumptions.
        - Flag missing context.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Write complete onboarding docs for a repo without reading its config.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Next.js app for browsing AI agents.

    Goal: produce README draft for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with README Generator.
  weakInputFixes:
    - weakInput: Help me with README Generator.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Update the Agent Archive README after adding install kits and evaluations. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for New repo docs. Optimize for README draft, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - "The README in Markdown, ready to paste: purpose, requirements, install, quick start, commands, configuration, limitations, roadmap, license"
    - Copy-pasteable usage for every named feature, command, and flag
    - Known limitations stated plainly; roadmap items not presented as features
    - "Notes for the author outside the README: assumptions and what to verify"
  outputChecklist:
    - Every feature, command, flag, and limitation the user named is documented with exact usage
    - Uses only the names, commands, versions, and URLs given
    - No invented badges, metrics, users, or benchmarks
    - Length matches what the user asked for
    - Assumptions are listed under notes for the author
  failureModes:
    - The input lacks the project context the agent needs
    - A risk or constraint the user named gets a generic line instead of a concrete failure mode and check
    - Unrequested extras crowd out depth on what the user asked for
    - The agent invents facts, numbers, or approvals that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Creating or refreshing project documentation from known setup and feature details
    - "Teams with the required inputs ready: Project purpose, Tech stack, Setup commands"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Environment variables, deployment steps, or project purpose are unknown
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Wraps the README in a ```markdown fence but uses ``` fences inside it (boundary: ```bash install/quick-start blocks; out-of-scope: ```python and ```bash blocks), so the outer block closes early when rendered and the draft is not cleanly paste-ready; the strong case correctly used a four-backtick outer fence, so the behavior is inconsistent."
    - "Adds plausible but unstated claims to the README body: 'instead of installing a partial kit' for the 404 exit (strong, only hedged in the notes), and 'The API may change before 1.0', 'first release', and a roadmap of 'Set up CI / Raise test coverage / Publish reproducible benchmarks' that the csvtidy author never stated (out-of-scope)."
    - "Notes for the author get long: 10 bullets on the strong case, whose user asked to keep things concise. Several could be merged into a single list of behaviors to verify."
    - When input is minimal, the provisional README is a full generic skeleton (about 12 sections of <TBD> placeholders, including Configuration, Roadmap, and Contributing that were not requested), which adds little beyond a template.
  evaluationCriteria:
    - Documents purpose, features, setup, scripts, validation, and roadmap accurately
    - Produces README draft in a format that can be pasted into a ticket, PR, document, or handoff
    - Uses only facts the user gave, with placeholders for anything missing, and lists assumptions under notes for the author
    - Refuses invented badges, metrics, adoption claims, benchmarks, or audits
