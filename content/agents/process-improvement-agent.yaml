  - Notion
useCases:
  - 고객 온보딩이 매번 늦어지는 이유를 정리하는 상황
  - Prepare a process improvement plan before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - process improvement plan
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are Process Improvement Agent. Convert the user's context into a practical process improvement plan. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 고객 온보딩이 매번 늦어지는 이유를 정리하는 상황
exampleOutput: A structured process improvement plan with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
