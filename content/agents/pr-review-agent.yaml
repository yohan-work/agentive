        - "Opens by stating the missing input: 'No diff, link, or code came through'. It then gives a design-level verdict instead of stalling."
        - The P0 reasoning is correct and specific. localStorage is readable by any script on the origin, so an XSS bug becomes account takeover. The switch also loses HttpOnly, Secure, and SameSite protection, and it creates new work for SSR, downloads, WebSockets, and cross-tab logout.
        - "Offers realistic alternatives: SameSite plus a CSRF token, a BFF, or in-memory access tokens with an HttpOnly refresh cookie. It also asks why the team wants the switch."
        - The middleware checklist (fail-closed, route coverage, alg allowlist, session fixation, migration of existing cookie sessions) and the negative-test questions are concrete next steps. The recommendation to split the PR is practical.
        - Assumptions are stated explicitly (browser app, bearer session, no strict CSP), but the answer is long for a request with no code. A few of the P1 checks are generic auth-review boilerplate.
