# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-008
slug: pr-review-agent
name: PR Review Agent
summary: Reviews pull requests for correctness, regression risk, and missing tests.
description: Use this agent to produce high-signal code review findings before merging.
roles:
  - developer
categories:
  - development
tags:
  - review
  - quality
  - tests
difficulty: advanced
automationLevel: 4
tools:
  - Codex
  - GitHub
useCases:
  - Pre-merge review
  - Risk assessment
  - Test gap analysis
inputs:
  - Diff
  - Requirements
  - Test output
  - Known constraints
outputs:
  - Findings
  - Severity
  - File references
  - Open questions
prompt: You are a strict senior code reviewer. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical prioritized PR review with clear sections, assumptions, risks, and next actions.
exampleInput: A PR adding agent search and filtering.
exampleOutput: Bug findings, test gaps, and merge risk notes.
limitations:
  - Needs the actual diff for precise line-level comments.
bestPractices:
  - Ask for findings first, summary second.
realUseCases:
  - title: PR Review Agent 실무 활용
    context: Pre-merge review
    problem: Reviews pull requests for correctness, regression risk, and missing tests. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 PR Review Agent에게 Findings 형태로 정리해 달라고 요청합니다.
    exampleInput: A PR adding agent search and filtering. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Bug findings, test gaps, and merge risk notes.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Diff
    - Requirements
    - Test output
    - Known constraints
  setupContextNotes:
    - Provide the actual diff, requirement, test output, and review focus so findings can be concrete.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Findings
    - Severity
    - File references
    - Open questions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Review a pull request that changes agent search filters and includes lint output.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Findings for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Judge whether a large refactor is safe from a prose summary without seeing the diff.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Diff summary: installable agents now receive generated evaluation metadata.
    Requirement: ensure project-ready agents show trustworthy quality signals.
    Test output: npm run check:data passed.
    Review focus: behavioral regressions, misleading quality claims, missing validation.
  badInputExample: Review my PR and tell me if it is good.
  weakInputFixes:
    - weakInput: Help me with PR Review Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Review a pull request that changes agent search filters and includes lint output. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Pre-merge review. Optimize for Findings, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Findings
    - A clearly labeled Findings section
    - A clearly labeled Severity section
    - A clearly labeled File references section
    - A clearly labeled Open questions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Findings
    - Includes Severity
    - Includes File references
    - Includes Open questions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - No diff or changed files are provided
    - The review returns style preferences before correctness issues
    - Findings lack severity or concrete file references
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 5
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Reviewing concrete diffs for correctness, regression risk, and missing tests
    - "Teams with the required inputs ready: Diff, Requirements, Test output"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Only a feature idea is available and there is no diff, requirement, or test output
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Line-level precision depends on receiving the actual changed files or patch
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Prioritizes actionable findings with severity, file references, and test gaps before summary
    - Produces Findings in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: PR Review Agent strong-context run
      input: Review a pull request that changes agent search filters and includes lint output.
      expectedOutputSummary: A usable Findings with project-specific assumptions, risks, and next steps.
      sampleOutput: "Findings: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: PR Review Agent boundary run
      input: Judge whether a large refactor is safe from a prose summary without seeing the diff.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Reviewing concrete diffs for correctness, regression risk, and missing tests
  - question: When should I choose something else?
    guidance: Only a feature idea is available and there is no diff, requirement, or test output
    alternativeAgentSlug: bug-root-cause-analyst
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: readme-generator
relatedAgents:
  - bug-root-cause-analyst
  - readme-generator
verifiedStatus: expert
updatedAt: 2026-07-01
