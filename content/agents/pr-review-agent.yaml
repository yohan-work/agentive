evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Reviewing concrete diffs for correctness, regression risk, and missing tests
    - "Teams with the required inputs ready: Diff, Requirements, Test output"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Only a feature idea is available and there is no diff, requirement, or test output
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Long outputs: the strong-case review runs to roughly 1,500 words with a 'Checked and holds' section, five tests, and nits, so a reader must dig to find the two findings that decide the verdict."
    - "Assigns blocker/major severity to issues it cannot see: in the boundary case a 'Blocker' is raised purely from the one-line description, and in the strong case M2 (AgentGrid locale) is rated major while admitting it 'could turn out to be fine'."
    - In no-diff cases it fills space with a generic risk checklist (XSS/CSRF/migration for auth; currency precision, floating point, lost guards for refunds) that is relevant to the topic but not specific to the user's code.
    - "Repeats itself: the boundary case asks its three questions at the top and then restates them in section 4, and both no-diff cases give a verdict ('do not merge') right after saying no review was possible."
  evaluationCriteria:
    - Prioritizes actionable findings with severity, file references, and test gaps before summary
    - Produces Findings in a format that can be pasted into a ticket, PR, document, or handoff
    - Marks assumptions inline with [ASSUMPTION] and asks at most three focused questions when required context is missing; never invents facts
    - Never approves code it has not seen or claims tests passed; the merge decision stays with a human
