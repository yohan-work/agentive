    - weakInput: Help me with PR Review Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Review a pull request that changes agent search filters and includes lint output. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Pre-merge review. Optimize for Findings, keep assumptions explicit, and list the changes made.
