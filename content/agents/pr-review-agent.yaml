runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Diff
    - Requirements
    - Test output
    - Known constraints
  setupContextNotes:
    - Provide the actual diff, requirement, test output, and review focus so findings can be concrete.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Findings
    - Severity
    - File references
    - Open questions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Review a pull request that changes agent search filters and includes lint output.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Findings for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Judge whether a large refactor is safe from a prose summary without seeing the diff.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Diff summary: installable agents now receive generated evaluation metadata.
    Requirement: ensure project-ready agents show trustworthy quality signals.
    Test output: npm run check:data passed.
    Review focus: behavioral regressions, misleading quality claims, missing validation.
  badInputExample: Review my PR and tell me if it is good.
  weakInputFixes:
    - weakInput: Help me with PR Review Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Review a pull request that changes agent search filters and includes lint output. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Pre-merge review. Optimize for Findings, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Findings
    - A clearly labeled Findings section
    - A clearly labeled Severity section
    - A clearly labeled File references section
    - A clearly labeled Open questions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Findings
    - Includes Severity
    - Includes File references
    - Includes Open questions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - No diff or changed files are provided
    - The review returns style preferences before correctness issues
    - Findings lack severity or concrete file references
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Reviewing concrete diffs for correctness, regression risk, and missing tests
    - "Teams with the required inputs ready: Diff, Requirements, Test output"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Only a feature idea is available and there is no diff, requirement, or test output
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Severity inflation: the top finding is rated High and 'Blocks merge: Yes' even though it is only a hypothesis to confirm. In the merged code AgentGrid already accepts and forwards locale, and every badge, card, and grid call site passes it."
    - Rates a finding Medium on a code path the input's constraints make unreachable. The difficultyLabel/statusLabel 'undefined' chip needs filters seeded from the URL, but only the query is read via useSearchParams, and filter values come from the typed arrays.
    - Makes small unverified technical claims in its test advice. It says the search panel 'probably' only renders on the client, but agents/page.tsx uses AgentSearchPanel itself as the Suspense fallback, so its text is in the static HTML. The suggested `out/ko/**/*.html` grep does not recurse in default bash.
    - Runs long. The strong review carries six findings (two nits), four test gaps, open questions, and a next-steps table for a clean translation PR. The boundary answer is also lengthy.
    - Boundary verdict is firm ('no, don't merge today') and rests only on the one-line description. It is justified for localStorage sessions, but the review assumes a browser app with no CSP rather than asking about it first.
  evaluationCriteria:
    - Prioritizes actionable findings with severity, file references, and test gaps before summary
    - Produces Findings in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: "Review real PR #19 Korean translation of badges and search panel"
