        주신 정보만으로 계약서를 확정할 수 있습니다. 아래에서 정하지 않은 부분은 **[가정]**으로 표시했고 기본값도 적어 두었습니다. 월요일 전에 확인이 필요한 항목은 5장에 모았습니다. 답이 없으면 기본값으로 진행하면 됩니다.

