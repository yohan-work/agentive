    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 API Contract Agent에게 API contract 형태로 정리해 달라고 요청합니다.
    exampleInput: 프론트엔드와 백엔드가 병렬 개발을 시작하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 API contract을 만들어줘.
    expectedResult: API contract 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
    recommendedWorkflow: Codex Development Prep Flow
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Prepare domain rules, request examples, response needs, auth assumptions, and error cases.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - API contract
    - Endpoint specs
    - Error codes
    - Example requests and responses
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Draft an API contract for submitting new agent ideas with moderation status.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce API contract for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Go deep on the risks and constraints listed above.
        - Mark assumptions.
        - Flag missing context.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Invent a full billing API without pricing rules or account model.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    프론트엔드와 백엔드가 병렬 개발을 시작하는 상황

    Goal: produce API contract for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with API Contract Agent.
  weakInputFixes:
    - weakInput: Help me with API Contract Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Draft an API contract for submitting new agent ideas with moderation status. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 프론트엔드와 백엔드가 병렬 개발을 시작하는 상황. Optimize for API contract, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - "Conventions: base URL, auth, headers, CORS, rate limits, error format, naming and time formats"
    - "Endpoints: method and path, request and validation, success response, every error with status and error code, and example JSON"
    - "Behavior rules: idempotency, limits, ordering, merging, and what happens at each limit"
    - Open questions only when they block implementation
    - Suggestions kept to one line each under "Suggested (not required)"
  outputChecklist:
    - Every stated decision and limit is applied to each endpoint it touches, with its status and error code
    - The user's formats (casing, error envelope, time format) are kept exactly
    - Examples are valid JSON and consistent with the rules
    - No fields, endpoints, or behavior were invented
    - Unsafe requirements (no auth, exposing sensitive data) are flagged, not designed in
  failureModes:
    - A stated limit or rule has no error code or example
    - Examples contradict the stated rules or formats
    - The contract invents fields or endpoints the user did not ask for
    - The contract designs in missing auth or full exposure of sensitive data
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 5
  testedWith:
    - claude
  recommendedFor:
    - Designing request, response, error, and example shapes before parallel implementation
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Domain rules, authorization boundaries, or data ownership are unresolved
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Long outputs: the full-spec case runs to about 510 lines of Korean markdown, including DB SQL, middleware ordering, and a six-item risk list, which is more than a ticket or PR paste needs."
    - "Example data sometimes reads as fact: the bookmarks examples use slugs such as `readme-writer` and `bug-root-cause-agent` as if they were catalog entries, and the next-actions table sets a 'Friday' deadline the user never gave."
    - "Example headers are inconsistent: the bookmarks 201 example omits the Cache-Control and CORS headers that the conventions section requires on every response."
    - "In the under-specified case, each endpoint's error table sits directly under the 'Success: 201/200' heading with no errors label, and immediate token invalidation on logout is assumed without noting that a stateless JWT then needs a denylist."
    - It can override an explicit user requirement. In the admin case it replaced 'send the full list, the frontend searches' with server-side search and pagination. The change is well justified but was made unilaterally rather than offered as an option.
  evaluationCriteria:
    - Defines success payloads, validation errors, auth assumptions, and realistic examples
    - Produces API contract in a format that can be pasted into a ticket, PR, document, or handoff
    - Marks assumptions inline with [ASSUMPTION] and asks at most three focused questions when required context is missing; never invents facts
    - Refuses to design unauthenticated access or full exposure of sensitive personal or payment data
  sampleRuns:
    - title: Korean API contract for a bookmarks sync endpoint with auth
      input: |-
        프론트와 백엔드가 다음 주 월요일부터 병렬로 개발을 시작합니다. 그 전에 API 계약서를 확정하고 싶어요.

        배경: Agent Archive는 지금 북마크를 브라우저 localStorage(키 `agent-archive:bookmarks`, 값은 에이전트 slug 문자열 배열)에만 저장합니다. 여러 기기에서 북마크를 동기화하는 "선택형 로그인" 기능을 붙이려고 하고, 이를 위해 별도의 작은 API 서버(api.agentarchive.dev)를 둡니다. 사이트 자체는 계속 GitHub Pages 정적 호스팅입니다(그래서 API는 CORS 필요, origin은 https://yohan-work.github.io).

        범위(이번 계약서):
        1. 내 북마크 목록 조회
        2. 북마크 추가(단건)
        3. 북마크 삭제(단건)
        4. 최초 로그인 시 localStorage 북마크를 서버로 병합 업로드(최대 200개)

        결정된 사항:
        - 인증: GitHub OAuth로 로그인 후 서버가 발급하는 access token(JWT, 15분)을 `Authorization: Bearer` 헤더로 전달. refresh는 httpOnly 쿠키 방식이지만 이번 계약서 범위 밖.
        - 사용자당 북마크 최대 500개.
        - slug 규칙: 소문자 영문/숫자/하이픈, 3~64자. 존재하지 않는 slug 저장은 거부해야 함(서버가 빌드 시점 agents 목록을 알고 있음, 현재 100개).
        - 북마크에는 slug와 생성 시각만 저장. 폴더/메모 없음.
        - 같은 slug를 두 번 추가하면 에러가 아니라 멱등 처리.
        - 레이트 리밋: 사용자당 분당 60회.
        - 응답 JSON은 camelCase, 시간은 ISO 8601 UTC.
        - 에러 포맷은 팀 표준 `{ "error": { "code": "STRING_CODE", "message": "사람이 읽는 문장", "details": {...} } }`.

        청중: 프론트 개발자 2명(Next.js 클라이언트 fetch), 백엔드 1명(Hono on Cloudflare Workers + D1).
        원하는 결과: 엔드포인트별 메서드/경로/요청/응답/에러 코드 표, 실제 예시 JSON, 인증·CORS·레이트리밋 가정, 병합 규칙, 리스크, 다음 액션.
      expectedOutputSummary: A Korean contract for the 4 bookmark endpoints that keeps the team error envelope, camelCase, and ISO UTC, and applies the JWT/CORS origin/60-per-minute/500-cap/slug regex and catalog/idempotent-add/200-item merge rules per endpoint with status and error codes and valid examples, plus merge rules, risks, next actions, and blocking questions kept separate.
      sampleOutput: |-
        # Agent Archive 북마크 동기화 API 계약서 (v1, 확정 후보)

        범위: 북마크 목록 조회 / 단건 추가 / 단건 삭제 / 최초 로그인 병합 업로드.
        범위 밖(이 문서에서 설계하지 않음): GitHub OAuth 로그인 흐름, refresh 토큰 발급·갱신, 로그아웃, 계정 삭제, 폴더/메모, 페이지네이션.

        `[ASSUMPTION]` 표시는 요청에 명시되지 않아 제가 임의로 정한 값입니다. 월요일 전에 확인해 주세요. 확정이 필요한 3가지는 맨 아래 "미결 사항"에 있습니다.

        ---

        ## 1. 공통 규약

        ### 1.1 Base URL과 경로

        | 항목 | 값 |
        |---|---|
        | Base URL | `https://api.agentarchive.dev` |
        | 경로 접두사 | `/v1` `[ASSUMPTION]` (나중에 호환되지 않는 변경을 할 때를 대비) |
        | 리소스 | `/v1/me/bookmarks`: 항상 토큰의 사용자 본인 것만 다룹니다. 경로에 user id가 들어가지 않으므로 다른 사용자의 북마크에 접근할 수 있는 경로 자체가 없습니다. |

        ### 1.2 인증

        - 모든 엔드포인트(CORS preflight `OPTIONS` 제외)에 `Authorization: Bearer <accessToken>`이 필요합니다.
        - access token은 서버가 발급한 JWT이고 유효 기간은 15분입니다. 서버는 서명과 `exp`를 검증하고, 사용자 식별자는 `sub` 클레임에서 가져옵니다 `[ASSUMPTION: 클레임 이름]`.
        - 만료와 그 밖의 무효 토큰은 서로 다른 에러 코드로 구분합니다. 프론트가 "refresh 후 1회 재시도"와 "로그아웃 상태로 전환"을 코드만 보고 결정할 수 있게 하기 위해서입니다.

        | 상황 | 상태 | `error.code` | 프론트 동작 |
        |---|---|---|---|
        | 헤더 없음, `Bearer ` 형식 아님, 서명 불일치, JWT 파싱 실패 | 401 | `UNAUTHENTICATED` | 로그아웃 상태로 전환(localStorage 모드) |
        | `exp` 경과 | 401 | `TOKEN_EXPIRED` | refresh(범위 밖) 후 같은 요청 1회 재시도 |

        ### 1.3 요청/응답 헤더

        | 헤더 | 규칙 |
        |---|---|
        | `Content-Type: application/json` | 본문이 있는 요청(`POST /merge`)에 필수. 응답은 본문이 있으면 항상 `application/json; charset=utf-8`. |
        | `Cache-Control: no-store` | 모든 응답에 붙입니다 `[ASSUMPTION]`. 사용자별 데이터라 캐시되면 안 됩니다. |
        | `Retry-After` | 429 응답에만. 정수 초. |

        ### 1.4 CORS

        | 항목 | 값 |
        |---|---|
        | `Access-Control-Allow-Origin` | `https://yohan-work.github.io` (정확히 일치할 때만 반환. 와일드카드 `*` 사용 안 함) |
        | `Access-Control-Allow-Methods` | `GET, PUT, DELETE, POST, OPTIONS` |
        | `Access-Control-Allow-Headers` | `Authorization, Content-Type` |
        | `Access-Control-Expose-Headers` | `Retry-After` (safelisted 헤더가 아니라서 이걸 빼면 프론트 JS에서 읽을 수 없습니다) |
        | `Access-Control-Max-Age` | `86400` `[ASSUMPTION]` |
        | `Access-Control-Allow-Credentials` | 이 4개 엔드포인트에는 보내지 않습니다. 토큰이 헤더로 오므로 쿠키가 필요 없고, 프론트는 `credentials: "omit"`(기본값 `same-origin`도 가능)으로 호출합니다. |
        | `Vary` | `Origin` |

        규칙:
        - 허용되지 않은 origin: CORS 헤더 없이 정상 처리합니다. 브라우저가 응답을 차단합니다. 서버에서 별도 에러 코드를 주지는 않습니다.
        - `OPTIONS` preflight: 인증과 레이트 리밋 없이 `204`를 반환합니다.
        - 4xx/5xx(특히 401, 429) 응답에도 CORS 헤더가 반드시 붙어야 합니다. 빠지면 프론트는 에러 본문 대신 `TypeError: Failed to fetch`만 보게 됩니다. Hono에서는 CORS 미들웨어를 인증·레이트 리밋 미들웨어보다 먼저 등록하고, `onError`/`notFound` 핸들러 응답에도 헤더가 붙는지 확인해 주세요.
        - 로컬 개발 origin(`http://localhost:3000`) 허용 여부는 미결 사항 3번입니다.

        ### 1.5 레이트 리밋

        - 사용자(`sub`)당 **분당 60회**. 4개 엔드포인트가 한 버킷을 공유하고, `merge` 한 번도 1회로 셉니다.
        - 윈도우: 고정 60초 윈도우 `[ASSUMPTION]`.
        - 집계 대상: 인증을 통과한 모든 요청(4xx 응답 포함). 인증 실패(401)는 사용자를 식별할 수 없어 이 버킷에 넣지 않고, `OPTIONS`도 세지 않습니다.
        - 초과 시:

        ```http
        HTTP/1.1 429 Too Many Requests
        Content-Type: application/json; charset=utf-8
        Retry-After: 23
        Access-Control-Allow-Origin: https://yohan-work.github.io
        Access-Control-Expose-Headers: Retry-After
        ```
        ```json
        {
          "error": {
            "code": "RATE_LIMITED",
            "message": "요청이 너무 많습니다. 23초 후에 다시 시도해 주세요.",
            "details": {
              "limit": 60,
              "windowSeconds": 60,
              "retryAfterSeconds": 23
            }
          }
        }
        ```

        - 프론트는 429를 받으면 `Retry-After`초 동안 같은 요청을 재시도하지 않습니다. 북마크 토글 UI는 낙관적 업데이트를 되돌리거나 대기열에 넣습니다(프론트 재량).

        ### 1.6 에러 포맷(팀 표준 그대로)

        ```json
        { "error": { "code": "STRING_CODE", "message": "사람이 읽는 문장", "details": {} } }
        ```

        - `code`: 프론트가 분기하는 기준. 아래 표에 있는 값만 사용합니다.
        - `message`: 사람이 읽는 한국어 문장 `[ASSUMPTION: 언어]`. 프론트는 이 값으로 분기하지 않습니다.
        - `details`: 항상 객체입니다. 추가 정보가 없으면 `{}`를 보내고 생략하지 않습니다.

        **공통 에러(모든 엔드포인트)**

        | 상태 | `code` | 발생 조건 | `details` |
        |---|---|---|---|
        | 401 | `UNAUTHENTICATED` | 1.2 참고 | `{}` |
        | 401 | `TOKEN_EXPIRED` | 1.2 참고 | `{}` |
        | 404 | `NOT_FOUND` | 정의되지 않은 경로/메서드 | `{}` |
        | 429 | `RATE_LIMITED` | 1.5 참고 | `{ "limit", "windowSeconds", "retryAfterSeconds" }` |
        | 500 | `INTERNAL_ERROR` | 서버 오류 (D1 실패 등) | `{}` |

        **검사 순서(모든 엔드포인트 공통)**: CORS → 인증(401) → 레이트 리밋(429) → 입력 검증(400) → 카탈로그 검사(422) → 상태 검사(409) → 처리.
        그래서 한 요청이 여러 조건에 동시에 걸리면 앞선 에러 하나만 반환합니다.

        ### 1.7 네이밍과 데이터 형식

        | 항목 | 규칙 |
        |---|---|
        | JSON 필드 | camelCase |
        | 시간 | ISO 8601 UTC, 밀리초 포함, `Z` 접미사. 예: `2026-10-05T01:23:45.678Z` |
        | slug 형식 | 정규식 `^[a-z0-9-]{3,64}$`. 대문자, 공백, 밑줄은 거부하며 **서버가 소문자로 정규화하지 않습니다** `[ASSUMPTION]`. `"Code-Review"`는 `INVALID_SLUG`입니다. |
        | slug 존재 | 서버가 빌드 시점에 가진 agents 목록(현재 100개)에 있어야 추가할 수 있습니다. |

        ### 1.8 데이터 모델

        북마크 = `{ slug, createdAt }` 두 필드뿐입니다.

        ```json
        { "slug": "pr-review-agent", "createdAt": "2026-10-05T01:23:45.678Z" }
        ```

        백엔드 참고(D1): `bookmarks(user_id TEXT NOT NULL, slug TEXT NOT NULL, created_at TEXT NOT NULL, PRIMARY KEY (user_id, slug))`. 멱등성과 동시성 규칙(3절)은 이 기본키에 의존합니다.

        ---

        ## 2. 엔드포인트

        ### 요약표

        | # | 메서드 | 경로 | 성공 | 엔드포인트 고유 에러 |
        |---|---|---|---|---|
        | 1 | `GET` | `/v1/me/bookmarks` | `200` | 없음(공통 에러만) |
        | 2 | `PUT` | `/v1/me/bookmarks/{slug}` | `201` 새로 추가 / `200` 이미 있음 | `400 INVALID_SLUG`, `422 UNKNOWN_SLUG`, `409 BOOKMARK_LIMIT_REACHED` |
        | 3 | `DELETE` | `/v1/me/bookmarks/{slug}` | `204` (있었든 없었든) | `400 INVALID_SLUG` |
        | 4 | `POST` | `/v1/me/bookmarks/merge` | `200` | `400 INVALID_BODY`, `400 TOO_MANY_ITEMS` |

        모든 엔드포인트는 1.6의 공통 에러(401 ×2, 404, 429, 500)도 반환할 수 있습니다.

        단건 추가를 `POST /bookmarks` + body 대신 `PUT /bookmarks/{slug}`로 정한 이유: "같은 slug를 두 번 추가해도 에러 없이 멱등"이라는 결정이 PUT의 의미와 그대로 맞고, 본문이 없어 검증할 것이 경로 하나로 줄어듭니다.

        ---

        ### 2.1 내 북마크 목록 조회

        `GET /v1/me/bookmarks`

        **요청**
        - 쿼리 파라미터 없음. 본문 없음.
        - 페이지네이션 없음: 사용자당 최대 500개라 한 번에 전부 반환합니다.

        **성공 `200 OK`**

        | 필드 | 타입 | 설명 |
        |---|---|---|
        | `bookmarks` | `Bookmark[]` | 0~500개. 정렬: `createdAt` 내림차순(최신 먼저), 같으면 `slug` 오름차순. |

        - 북마크가 없으면 `{ "bookmarks": [] }`입니다(404 아님).
        - 저장된 뒤 카탈로그에서 사라진 slug도 **그대로 반환합니다** `[ASSUMPTION, 미결 사항 2]`. 프론트는 현재 agents 목록에 없는 slug를 화면에서 숨깁니다.

        **에러**: 공통 에러만.

        **예시**

        ```http
        GET /v1/me/bookmarks HTTP/1.1
        Host: api.agentarchive.dev
        Origin: https://yohan-work.github.io
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJnaDoxMjM0NTYiLCJleHAiOjE3OTE0MzY4MjV9.sig
        ```

        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json; charset=utf-8
        Cache-Control: no-store
        Access-Control-Allow-Origin: https://yohan-work.github.io
        ```
        ```json
        {
          "bookmarks": [
            { "slug": "pr-review-agent", "createdAt": "2026-10-05T01:23:45.678Z" },
            { "slug": "bug-root-cause-agent", "createdAt": "2026-10-04T09:10:11.000Z" },
            { "slug": "readme-writer", "createdAt": "2026-10-04T09:10:11.000Z" }
          ]
        }
        ```

        (두 번째와 세 번째는 `createdAt`이 같아서 `slug` 오름차순으로 정렬됐습니다. 보통 같은 병합 요청으로 들어온 경우입니다.)

        ---

        ### 2.2 북마크 추가(단건, 멱등)

        `PUT /v1/me/bookmarks/{slug}`

        **요청**

        | 위치 | 이름 | 규칙 |
        |---|---|---|
        | path | `slug` | `^[a-z0-9-]{3,64}$` + 카탈로그에 존재 |
        | body | 없음 | 본문을 보내도 무시합니다 |

        **처리 순서**: 형식 검사 → 카탈로그 검사 → 이미 있는지 확인 → 개수 한도 검사 → 삽입.
        이미 있는지를 한도보다 먼저 확인하므로, 500개가 꽉 찬 상태에서도 **이미 있는 slug를 다시 추가하면 `200`**입니다(`409` 아님).

        **성공**

        | 상태 | 조건 | 본문 |
        |---|---|---|
        | `201 Created` | 새로 저장됨. `createdAt` = 서버 현재 시각 | `{ "bookmark": Bookmark }` |
        | `200 OK` | 이미 있었음. 아무것도 바꾸지 않고, **기존 `createdAt`을 유지**해서 반환 | `{ "bookmark": Bookmark }` |

        프론트는 201과 200을 같은 성공으로 처리하면 됩니다. 구분은 로그와 디버깅용입니다.

        **에러**

        | 상태 | `code` | 조건 | `details` |
        |---|---|---|---|
        | 400 | `INVALID_SLUG` | 형식 위반(길이, 대문자, 허용되지 않는 문자) | `{ "slug": "<받은 값>", "pattern": "^[a-z0-9-]{3,64}$" }` |
        | 422 | `UNKNOWN_SLUG` | 형식은 맞지만 카탈로그에 없음 | `{ "slug": "<받은 값>" }` |
        | 409 | `BOOKMARK_LIMIT_REACHED` | 새 slug인데 이미 500개 | `{ "limit": 500, "current": 500 }` |
        | + 공통 | | | |

        **예시: 새로 추가 (201)**

        ```http
        PUT /v1/me/bookmarks/pr-review-agent HTTP/1.1
        Host: api.agentarchive.dev
        Origin: https://yohan-work.github.io
        Authorization: Bearer eyJhbGciOi...
        ```
        ```http
        HTTP/1.1 201 Created
        Content-Type: application/json; charset=utf-8
        ```
        ```json
        {
          "bookmark": { "slug": "pr-review-agent", "createdAt": "2026-10-05T01:23:45.678Z" }
        }
        ```

        **예시: 같은 요청 반복 (200, createdAt 그대로)**

        ```json
        {
          "bookmark": { "slug": "pr-review-agent", "createdAt": "2026-10-05T01:23:45.678Z" }
        }
        ```

        **예시: 형식 위반 (400)**. `PUT /v1/me/bookmarks/PR_Review`

        ```json
        {
          "error": {
            "code": "INVALID_SLUG",
            "message": "slug는 소문자 영문, 숫자, 하이픈으로 된 3~64자여야 합니다.",
            "details": { "slug": "PR_Review", "pattern": "^[a-z0-9-]{3,64}$" }
          }
        }
        ```

        **예시: 카탈로그에 없음 (422)**. `PUT /v1/me/bookmarks/not-a-real-agent`

        ```json
        {
          "error": {
            "code": "UNKNOWN_SLUG",
            "message": "존재하지 않는 에이전트입니다.",
            "details": { "slug": "not-a-real-agent" }
          }
        }
        ```

        **예시: 한도 초과 (409)**

        ```json
        {
          "error": {
            "code": "BOOKMARK_LIMIT_REACHED",
            "message": "북마크는 최대 500개까지 저장할 수 있습니다.",
            "details": { "limit": 500, "current": 500 }
          }
        }
        ```

