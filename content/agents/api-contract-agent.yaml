        | 프론트 | 1.2의 TS 타입과 2장의 예시 JSON으로 MSW 목(mock) 핸들러 작성. 월요일부터 서버 없이 개발 가능 | 월요일 |
        | 프론트 | 에러 `code`별 en/ko i18n 문구 추가 | 1주차 |
        | 백엔드 | CORS와 레이트 리밋 미들웨어 먼저 배포(엔드포인트는 stub). 프론트가 preflight를 조기에 검증할 수 있게 함 | 1주차 초 |
        | 공동 | 계약 테스트: 엔드포인트별 성공 1건, 주요 에러 1건, 401/429 응답의 CORS 헤더 | 통합 전 |
        | 리드 | **refresh 쿠키의 크로스 사이트 문제(리스크 1번)** 결정. 커스텀 도메인 여부 | 가능한 빨리(구현 2주차 전) |

        계약서를 동결한 뒤 변경할 때는 `/v1` 안에서 **필드 추가만** 허용합니다. 필드 삭제나 의미 변경이 필요하면 `/v2`를 만들거나, 양쪽이 합의한 뒤 이 문서의 버전을 올립니다.
      reviewNotes:
        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - Faithfully applies every given decision. It uses the exact localStorage key `agent-archive:bookmarks`, the 500 per-user and 200 per-merge limits, the 3-64 char lowercase slug rule, idempotent add (modelled as PUT /v1/me/bookmarks/{slug} returning 201/200 with the original createdAt kept), camelCase, ISO 8601 UTC, the team `{error:{code,message,details}}` format, and 60/min rate limiting.
        - "The merge rules (section 2.4) are precise and well reasoned: whole-request 400 vs per-item `skipped` with reasons, union-only with no deletion, array-order filling of the 500 cap, server-time createdAt instead of invented past times, and chunking localStorage lists over 200. The worked example request/response pair is internally consistent."
        - "The CORS section is technically correct and practical: an exact-origin reflection with no `*`, `Vary: Origin`, no Allow-Credentials because a Bearer header is used, unauthenticated OPTIONS excluded from rate limiting, and an explicit rule that 401/429 responses must carry CORS headers so the frontend can read TOKEN_EXPIRED vs RATE_LIMITED."
        - The top risk is a genuinely valuable insight not stated in the input. Refresh via an httpOnly cookie on api.agentarchive.dev from yohan-work.github.io is a third-party cookie that ITP-style blocking will kill. It proposes a same-site custom domain and puts that decision into next actions with an owner and deadline.
        - "Minor defects: the D1 note merges the limit check and ON CONFLICT into one INSERT, so rows-changed alone cannot distinguish 200 from 409 as the contract requires. Assumptions are only tagged inline rather than listed in one section. The D1 schema section and overall length go beyond what a handoff contract needs."
