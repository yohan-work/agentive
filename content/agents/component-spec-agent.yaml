    - Usage examples invent dictionary paths and state shapes (t.filters.level, t.filterChips, filters.tool, setFilters) without marking them as placeholders, so they look like existing project APIs.
    - The strong output runs about 19KB with many tables. That fits the long list of requested sections, but some design-review notes (hoverOnlyWhenSupported, layout-shift discussion) could be trimmed for a ticket.
    - "The boundary draft stays generic: hideBelow drops columns on narrow screens without saying how users reach the hidden data, onSortChange is left untyped ((sort) => void), and row-click keyboard behavior is only a caution, not a spec."
  evaluationCriteria:
