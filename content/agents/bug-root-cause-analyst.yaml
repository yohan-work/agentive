# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-007
slug: bug-root-cause-analyst
name: Bug Root Cause Analyst
summary: Analyzes symptoms, logs, and code context to isolate likely causes.
description: Use this agent when a bug report needs triage before engineering work begins.
roles:
  - developer
  - pm
  - cs
categories:
  - development
  - operations
tags:
  - debugging
  - triage
  - logs
difficulty: advanced
automationLevel: 4
tools:
  - Codex
  - GitHub
  - Sentry
useCases:
  - Bug triage
  - Incident analysis
  - Regression investigation
inputs:
  - Bug symptoms
  - Steps to reproduce
  - Logs
  - Recent changes
outputs:
  - Hypotheses
  - Evidence map
  - Reproduction plan
  - Fix direction
prompt: You are a pragmatic debugging lead. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical root-cause analysis report with clear sections, assumptions, risks, and next actions.
exampleInput: Users cannot bookmark after refreshing; localStorage key exists.
exampleOutput: Likely hydration/state mismatch, repro steps, and files to inspect.
limitations:
  - Cannot prove a cause without code or runtime evidence.
bestPractices:
  - Provide timestamps and recent deploy details.
realUseCases:
  - title: Bug Root Cause Analyst 실무 활용
    context: Bug triage
    problem: Analyzes symptoms, logs, and code context to isolate likely causes. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 Bug Root Cause Analyst에게 Hypotheses 형태로 정리해 달라고 요청합니다.
    exampleInput: Users cannot bookmark after refreshing; localStorage key exists. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Likely hydration/state mismatch, repro steps, and files to inspect.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Bug symptoms
    - Steps to reproduce
    - Logs
    - Recent changes
  setupContextNotes:
    - Collect symptoms, logs, reproduction steps, recent changes, and affected environment details.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Hypotheses
    - Evidence map
    - Reproduction plan
    - Fix direction
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Analyze why bookmarks disappear after refresh using browser logs and the storage helper.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Hypotheses for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Explain a production outage from a screenshot of an error toast only.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Users cannot bookmark after refreshing; localStorage key exists.

    Goal: produce Hypotheses for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Bug Root Cause Analyst.
  weakInputFixes:
    - weakInput: Help me with Bug Root Cause Analyst.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Analyze why bookmarks disappear after refresh using browser logs and the storage helper. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Bug triage. Optimize for Hypotheses, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Hypotheses
    - A clearly labeled Hypotheses section
    - A clearly labeled Evidence map section
    - A clearly labeled Reproduction plan section
    - A clearly labeled Fix direction section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Hypotheses
    - Includes Evidence map
    - Includes Reproduction plan
    - Includes Fix direction
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Triage where symptoms, logs, reproduction notes, and recent changes are available
    - "Teams with the required inputs ready: Bug symptoms, Steps to reproduce, Logs"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The task needs proof of root cause without runtime evidence or code context
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - May over-rank plausible causes when logs are partial or reproduction is missing
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Separates evidence, hypotheses, reproduction plan, and fix direction
    - Produces Hypotheses in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Bug Root Cause Analyst strong-context run
      input: Analyze why bookmarks disappear after refresh using browser logs and the storage helper.
      expectedOutputSummary: A usable Hypotheses with project-specific assumptions, risks, and next steps.
      sampleOutput: "Hypotheses: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Bug Root Cause Analyst boundary run
      input: Explain a production outage from a screenshot of an error toast only.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Triage where symptoms, logs, reproduction notes, and recent changes are available
  - question: When should I choose something else?
    guidance: The task needs proof of root cause without runtime evidence or code context
    alternativeAgentSlug: pr-review-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: qa-checklist-agent
relatedAgents:
  - pr-review-agent
  - qa-checklist-agent
verifiedStatus: community
updatedAt: 2026-07-01
