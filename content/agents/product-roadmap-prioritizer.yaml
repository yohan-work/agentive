# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-025
slug: product-roadmap-prioritizer
name: Product Roadmap Prioritizer
summary: Ranks roadmap items by impact, confidence, effort, and timing.
description: Use this agent when you need ranks roadmap items by impact, confidence, effort, and timing.
roles:
  - pm
  - founder
categories:
  - planning
  - business
tags:
  - roadmap
  - prioritization
  - rice
difficulty: intermediate
automationLevel: 3
tools:
  - ChatGPT
  - Linear
  - Sheets
useCases:
  - 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황
  - Prepare a prioritized roadmap before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - prioritized roadmap
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are Product Roadmap Prioritizer. Convert the user's context into a practical prioritized roadmap. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황
exampleOutput: A structured prioritized roadmap with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Product Roadmap Prioritizer 실무 활용
    context: 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황
    problem: 대표와 PM이 중요하다고 느끼는 기능이 달라 우선순위 회의가 길어짐
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Product Roadmap Prioritizer에게 prioritized roadmap 형태로 정리해 달라고 요청합니다.
    exampleInput: 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 prioritized roadmap을 만들어줘.
    expectedResult: prioritized roadmap 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
    recommendedWorkflow: Local Business Validation Flow
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Bring candidate items, scoring dimensions, strategy constraints, effort estimates, and dependencies.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - prioritized roadmap
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Rank 20 feature candidates for the next quarter with effort estimates.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce prioritized roadmap for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Choose the company strategy from a brainstorm list.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황

    Goal: produce prioritized roadmap for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Product Roadmap Prioritizer.
  weakInputFixes:
    - weakInput: Help me with Product Roadmap Prioritizer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Rank 20 feature candidates for the next quarter with effort estimates. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황. Optimize for prioritized roadmap, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended prioritized roadmap
    - A clearly labeled prioritized roadmap section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes prioritized roadmap
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Ranking candidate roadmap items when impact, confidence, effort, and timing inputs exist
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Leadership has not agreed on strategy, constraints, or scoring dimensions
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Scoring can look objective even when the inputs are subjective guesses
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Shows scoring assumptions, tradeoffs, confidence, dependencies, and sequencing rationale
    - Produces prioritized roadmap in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Product Roadmap Prioritizer strong-context run
      input: Rank 20 feature candidates for the next quarter with effort estimates.
      expectedOutputSummary: A usable prioritized roadmap with project-specific assumptions, risks, and next steps.
      sampleOutput: "prioritized roadmap: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Product Roadmap Prioritizer boundary run
      input: Choose the company strategy from a brainstorm list.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Ranking candidate roadmap items when impact, confidence, effort, and timing inputs exist
  - question: When should I choose something else?
    guidance: Leadership has not agreed on strategy, constraints, or scoring dimensions
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
verifiedStatus: community
createdBy: Agent Archive
updatedAt: 2026-07-01
