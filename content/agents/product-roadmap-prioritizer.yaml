  **점수에 대한 보충 설명**
  - **1번**: 지수 자체로도 상위권이지만 점수로 순위를 매기지 않습니다. 하지 않으면 매장 약 508곳, 단순 비례로 MRR 약 3,560만 원이 걸린 연동이 중단됩니다[가정: POS 매장의 매장당 MRR이 평균과 같음].
  - **6번**: 로고 기준 영향은 4곳(0.3%p, 1회성)으로 작습니다. 하지만 매출 기준으로는 14% × 8,700만 ÷ 23곳 ≈ 곳당 53만 원이고, 4곳이면 **약 212만 원/월(MRR의 2.4%)** 입니다[가정: 4곳 MRR = 다지점 평균]. 단일 매장 약 30곳분에 해당합니다. 그래서 점수는 낮아도 "제외"가 아니라 "조건부"로 두었습니다.
  - **12번**: 안정성을 2점으로 준 근거는 12월 성수기에 사용량이 늘어난다는 [가정]입니다.

