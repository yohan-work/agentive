        | 디자이너 휴가 2주 | 10일 ÷ 5 × 0.75 | −1.5 |
        | **실 가용** | | **58.4** |

        말씀하신 60pw에는 디자이너 휴가가 빠져 있어서 1.5pw를 뺐습니다.

        **직군별 용량과 부하**. 확정 항목의 직군별 분해는 모두 [가정]이며 팀장 확인이 필요합니다.

