prompt: You are Product Roadmap Prioritizer. Convert the user's context into a practical prioritized roadmap. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: |-
  다음 분기(2026 Q4, 10/6~12/26, 12주) 로드맵 우선순위를 정리해 주세요. 금요일 경영진 리뷰에 그대로 붙일 수 있는 형태면 좋겠습니다.

  회사/제품: "밀키트노트" — 소규모 식당·카페(직원 3~15명)용 재고·발주 관리 SaaS. 웹 + 모바일 앱. 유료 매장 1,240곳, MRR 약 8,700만 원, 월 로고 이탈률 3.1%(목표 2.0%).

  목표(우선순위 순):
  1. 이탈률 3.1% → 2.3%로 낮추기
  2. 신규 유료 전환율(14일 체험 → 유료) 18% → 22%
  3. 12월 연말 성수기 전에 장애 없이 안정화

  팀 capacity: 백엔드 3명, 프론트 2명, 모바일 1명, 디자이너 1명, PM 1명(나). 12주 × 7명 개발 = 대략 80 person-week인데 운영/버그 대응으로 25% 빠짐 → 가용 약 60 person-week.

  제약:
  - 10월 말 POS 연동 파트너(포스플러스) API가 v2로 바뀜. v1은 12/31 종료 확정. 현재 매장의 41%가 이 연동을 씀.
  - 11월에 디자이너 2주 휴가.
  - 모바일 앱 스토어 심사 기간 평균 3일.

  후보 목록 (추정 공수는 팀장 추정, 영향은 데이터 근거 표시):
  1. 포스플러스 API v2 마이그레이션 — 8pw. 안 하면 41% 매장 연동 중단.
  2. 발주 추천(지난 4주 소진량 기반) — 10pw. 인터뷰 12곳 중 9곳 요청. 이탈 사유 1위 "발주 여전히 수작업"(해지 설문 32%).
  3. 재고 실사 모바일 바코드 스캔 — 6pw. 체험 사용자 세션 녹화에서 실사 화면 이탈 58%.
  4. 온보딩 체크리스트 개편 — 3pw. 체험 1일차에 품목 20개 이상 등록한 매장의 전환율 31% vs 미만 9%.
  5. 엑셀 품목 일괄 업로드 개선(오류 행 표시) — 2pw. CS 문의 월 140건 중 38건.
  6. 다지점 대시보드 — 9pw. 다지점 고객 23곳(매출 비중 14%), 그중 4곳이 "없으면 해지" 언급.
  7. 카카오 알림톡으로 재고 부족 알림 — 3pw. 요청 많음(정확한 수치 없음).
  8. 다크 모드 — 2pw. 요청 11건.
  9. 결제 실패 재시도/더닝 메일 — 2pw. 비자발적 이탈이 전체 이탈의 약 0.6%p로 추정.
  10. 원가 리포트(메뉴별 원가율) — 7pw. 영업팀이 신규 계약 필수라고 주장, 근거는 영업 파이프라인 6건.
  11. 권한 관리(직원별 메뉴 접근 제한) — 4pw. 보안 문의 월 5건.
  12. 앱 성능 개선(품목 2,000개 이상 매장에서 목록 로딩 6~9초) — 4pw. 해당 매장 87곳, NPS -12.
  13. 영문 UI — 5pw. 해외 문의 월 2~3건.
  14. 거래처(공급업체) 포털 — 12pw. 전략적이라고 CEO가 언급, 검증 데이터 없음.
  15. 알림 설정 세분화 — 1pw.
  16. 공휴일/임시휴무 캘린더 — 1pw. 발주 추천(2번)의 정확도에 필요.
  17. 모니터링/알림 체계 정비(현재 장애 감지 평균 47분) — 3pw.
  18. 리퍼럴 프로그램 — 4pw. 기존 고객 NPS 41.

  이해관계자: CEO(14번 선호), 영업총괄(10번 강하게 요구), CS팀장(5번, 7번).

  원하는 결과: 점수 기준과 가정이 보이는 우선순위 표, 이번 분기에 넣을 것/뺄 것, 순서와 의존성, 이해관계자별로 왜 빠졌는지 설명할 근거, 리스크, 다음 액션.
exampleOutput: |-
  # 밀키트노트 2026 Q4 로드맵 우선순위 (10/6~12/26, 12주)

  ## 0. 한 줄 요약

  **가용 60pw 중 39pw를 확정 과제 9개에, 9pw를 W6 게이트 조건부 과제에, 12pw를 버퍼로 배정합니다.** 반드시 해야 하는 일은 포스플러스 v2 전환과 모니터링이고, 이탈 방어는 더닝, 성능 개선, 발주 추천으로, 전환율은 온보딩, 엑셀 업로드, 바코드 스캔으로 공략합니다. 대형 변경은 11/28까지 끝내고 12/8부터 변경을 동결합니다. 공급업체 포털(14)과 원가 리포트(10)는 이번 분기 개발에서 빼고 검증(discovery) 과제로 돌립니다.

  > **경영진 기대치 조정이 필요합니다.** 발주 추천은 11월 말 GA 예정이라 이탈 개선 효과가 12월 수치에는 거의 반영되지 않습니다. 이번 분기 현실적인 이탈률 목표는 **12월 기준 2.6~2.7%**이고, 2.3%는 **2027년 2월 기준**으로 잡는 것을 제안합니다(근거는 5장).

  ---

  ## 1. 점수 기준

  | 항목 | 정의 |
  |---|---|
  | 목표 기여 (0~3) | G1 이탈 ×3, G2 체험→유료 전환 ×2, G3 연말 안정화 ×2. 가중치는 말씀하신 목표 우선순위를 반영 |
  | 영향 합 | Σ(기여 × 가중치), 최대 21 |
  | 신뢰도 | 1.0 = 직접 측정한 정량 데이터 / 0.7 = 설문·인터뷰·상관관계·추정치 / 0.4 = 주장·일화, 수치 없음 |
  | 점수 | 영향 합 × 신뢰도 ÷ 공수(pw) → **1pw당 기대 가치** |
  | 게이트 | 기한이 정해졌거나 사업 연속성이 걸린 과제는 점수와 상관없이 **필수**로 분류 |

  점수는 공수로 나누기 때문에 큰 과제가 불리하게 나옵니다. 그래서 **영향 합(절대 크기)**도 같이 보고 판단했습니다. 발주 추천(2)은 이 기준 때문에 점수는 중간이지만 포함했습니다.

  ## 2. 우선순위 표

  | 순위 | # | 과제 | G1 | G2 | G3 | 영향 합 | 신뢰도 | 공수 | 점수 | 판정 |
  |---|---|---|---|---|---|---|---|---|---|---|
  | 필수 | 1 | 포스플러스 API v2 마이그레이션 | 3 | 0 | 3 | 15 | 1.0 | 8 | 1.88 | **확정 (기한 12/31)** |
  | 1 | 9 | 결제 실패 재시도/더닝 | 3 | 0 | 0 | 9 | 0.7 | 2 | 3.15 | **확정** |
  | 2 | 17 | 모니터링/알림 체계 정비 | 1 | 0 | 3 | 9 | 1.0 | 3 | 3.00 | **확정 (필수 성격)** |
  | 3 | 5 | 엑셀 일괄 업로드 개선 | 1 | 2 | 0 | 7 | 0.7 | 2 | 2.45 | **확정** |
  | 4 | 4 | 온보딩 체크리스트 개편 | 1 | 3 | 0 | 9 | 0.7 | 3 | 2.10 | **확정** |
  | 5 | 12 | 대용량 매장 성능 개선 | 2 | 0 | 1 | 8 | 1.0 | 4 | 2.00 | **확정** |
  | 6 | 15 | 알림 설정 세분화 | 1 | 0 | 0 | 3 | 0.4 | 1 | 1.20 | 조건부 (7과 묶음) |
  | 7 | 3 | 재고 실사 바코드 스캔 | 1 | 2 | 0 | 7 | 0.7 | 6 | 0.82 | **확정** |
  | 8 | 2+16 | 발주 추천 + 공휴일 캘린더 | 3 | 1 | 0 | 11 | 0.7 | 11 | 0.70 | **확정 (영향 최대)** |
  | 9 | 6 | 다지점 대시보드 | 2 | 0 | 0 | 6 | 0.7 | 9 | 0.47 | 조건부, **범위 축소 MVP 약 5pw** |
  | 10 | 7 | 카카오 알림톡 재고 부족 알림 | 1 | 0 | 0 | 3 | 0.4 | 3 | 0.40 | 조건부 |
  | 11 | 11 | 권한 관리 | 1 | 0 | 0 | 3 | 0.4 | 4 | 0.30 | 제외 (Q1 후보) |
  | 12 | 10 | 원가 리포트 | 0 | 1 | 0 | 2 | 0.4 | 7 | 0.11 | 제외, **검증 과제로 전환** |
  | – | 14 | 거래처 포털 | 0 | 0 | 0 | 0 | 0.4 | 12 | 0 | 제외, **검증 과제로 전환** |
  | – | 18 | 리퍼럴 프로그램 | 0 | 0 | 0 | 0 | 0.7 | 4 | 0 | 제외 (획득은 이번 분기 목표 밖) |
  | – | 13 | 영문 UI | 0 | 0 | 0 | 0 | 0.4 | 5 | 0 | 제외 |
  | – | 8 | 다크 모드 | 0 | 0 | 0 | 0 | 0.4 | 2 | 0 | 제외 |

  ## 3. 이번 분기 포함 / 제외

  ### 확정 (39pw, 가용의 65%)
  | 과제 | pw | 목표 | 넣는 이유 |
  |---|---|---|---|
  | 1 포스플러스 v2 | 8 | G1·G3 | 안 하면 매장 41%(약 508곳)의 연동이 12/31에 중단됩니다. 선택 사항이 아닙니다 |
  | 17 모니터링 | 3 | G3 | 현재 장애 감지에 평균 47분이 걸립니다. 성수기 전 안정화의 전제 조건입니다 |
  | 9 더닝 | 2 | G1 | 비자발적 이탈이 약 0.6%p이고, 목표 감소폭(0.8%p)의 상당 부분이 여기서 나옵니다. 2pw로 가장 싸게 줄일 수 있는 이탈입니다 |
  | 5 엑셀 업로드 | 2 | G2 | CS 문의의 27%(월 38건)를 차지합니다. 품목 20개 등록을 앞당기는 효과도 있습니다 |
  | 4 온보딩 | 3 | G2 | 1일차 품목 20개 이상 등록 매장의 전환율이 31%, 미만은 9%입니다 |
  | 12 성능 | 4 | G1 | 87개 매장에서 로딩이 6~9초, NPS -12입니다. 품목이 많은 대형(고가치) 매장일 가능성이 높습니다 |
  | 3 바코드 스캔 | 6 | G2 | 체험 사용자의 58%가 실사 화면에서 이탈합니다 |
  | 2 발주 추천 + 16 캘린더 | 11 | G1 | 해지 사유 1위(32%)이고, 인터뷰 12곳 중 9곳이 요청했습니다. 16은 2의 정확도에 필요한 선행 과제입니다 |

  ### 조건부 (9pw, W6 게이트 11/13에 결정)
  | 과제 | pw | 조건 |
  |---|---|---|
  | 6 다지점 대시보드 **MVP** | 약 5 | 범위를 "지점 통합 재고·발주 현황 조회(읽기 전용)"로 좁힙니다. 조건: ① W6에 포스 v2 일정이 정상일 것 ② 해지를 언급한 4곳에 인터뷰해 MVP 범위로 해지를 막을 수 있다고 확인될 것 |
  | 7 알림톡 + 15 알림 설정 | 4 | CS팀이 4주간 관련 요청 건수를 태깅해 수치가 확인될 것. 발주 추천의 "재고 부족 → 추천 발주" 알림과 묶으면 가치가 커집니다 |

  ### 버퍼 (12pw, 20%)
  포스 v2 스펙이 아직 공개되지 않았고, 발주 추천은 추정 불확실성이 큽니다. 공수는 팀장 1차 추정치라서 운영 25%와 별도로 버퍼를 둡니다. W6에 버퍼가 남으면 조건부 과제에 씁니다.

  ### 제외
  10 원가 리포트, 14 거래처 포털, 11 권한 관리, 18 리퍼럴, 13 영문 UI, 8 다크 모드

  ### 직군별 용량 점검 (가정: 과제별 직군 배분은 PM 추정)
  | 직군 | 가용 | 확정 배정 | 여유 |
  |---|---|---|---|
  | 백엔드 3 | 27 | 약 21 (v2 7, 발주추천 5, 모니터링 3, 성능 2, 기타 4) | 약 6 |
  | 프론트 2 | 18 | 약 8.5 | 약 9.5 → 다지점 MVP 흡수 가능 |
  | 모바일 1 | 9 | 약 7 (바코드 5, 성능 1, 발주추천 1) | 약 2 (**단일 인력 리스크**) |
  | 디자이너 1 | 약 7.5 (휴가 2주 반영) | 약 3.5 | 여유 있음. 단, **10월에 몰아서 작업** |

  프론트에 여유가 있어서 다지점 MVP를 조건부로 넣을 수 있습니다. 모바일은 거의 꽉 찼으므로 모바일이 필요한 과제는 더 추가하지 않습니다.

  ## 4. 순서와 의존성

  | 주차 | 기간 | 주요 작업 |
  |---|---|---|
  | W1–W2 | 10/6–10/17 | 9 더닝 출시 · 17 모니터링 착수 · 5 엑셀 업로드 · 16 캘린더 · 포스 v2 사전 분석(어댑터 계층 분리) · **디자인: 온보딩/발주추천/바코드 선행 완료** |
  | W3–W4 | 10/20–10/31 | 4 온보딩 출시(10/31) · 17 완료 · 12 성능 착수 · 2 발주 추천 개발 · 3 바코드 개발 |
  | W5–W6 | 11/3–11/14 | **1 포스 v2 본개발**(10월 말 v2 공개 후) · 12 성능 출시 · **W6 게이트(11/13)**: 조건부 과제 go/no-go |
  | W7–W8 | 11/17–11/28 | 포스 v2 **단계 전환 10% → 50% → 100%**(v1 폴백 유지) · 2 발주 추천 베타(11/17) → GA(11/28) · 3 바코드 **스토어 제출 11/20 이전** · 조건부 과제 |
  | W9 | 12/1–12/5 | 마지막 소규모 릴리스 · 모바일 최종 제출 12/2 이전 · 조건부 과제 마감 |
  | W10–W12 | 12/8–12/26 | **변경 동결**(핫픽스와 기능 플래그 단계 확대만) · 성수기 모니터링 · Q1 검증 과제 정리 · 회고 |

  **핵심 의존성**
  - 16 캘린더 → 2 발주 추천 (정확도)
  - 17 모니터링 → 1 포스 v2 단계 전환 (전환 중 이상을 감지할 수 있어야 함)
  - 5 엑셀 업로드 → 4 온보딩 (체크리스트의 "품목 20개 등록" 단계가 엑셀 업로드에 의존)
  - 포스플러스 v2 공개(10월 말) → 1 본개발. 그 전에는 어댑터 계층과 테스트 하네스만 준비
  - 모바일 릴리스는 심사 3일에 재심사 여유를 더해 **출시 희망일 7일 전**에 제출
  - 디자이너 휴가(11월 2주) → 디자인이 필요한 과제는 모두 10월 안에 시안 확정

  ## 5. 가정과 기대 효과

  | 가정 | 내용 |
  |---|---|
  | A1 | 가용 60pw는 7명 전원이 12주 동안 근무한다고 보고 운영 25%를 뺀 값입니다. 공휴일은 따로 반영하지 않았습니다 |
  | A2 | 포스플러스 v2는 10월 말에 공개되고, 12/31까지 v1과 병행 운영할 수 있습니다 |
  | A3 | 디자이너 휴가는 11월 중순 2주입니다(날짜 확인 필요) |
  | A4 | 온보딩 지표(31% vs 9%)는 상관관계입니다. 원래 의지가 높은 매장이 많이 등록했을 수 있으므로 효과를 보수적으로 잡았습니다 |
  | A5 | 더닝으로 비자발적 이탈의 40~50%를 회수합니다(업계 일반 수준, 우리 데이터로는 미검증) |

  **이탈 목표 산식** (월 이탈 3.1% ≈ 38곳/월, 목표 2.3%까지 −0.8%p ≈ 10곳/월)
  - 9 더닝: −0.25~0.3%p. 10월 말부터 반영됩니다
  - 12 성능: −0.05~0.1%p (87곳 한정)
  - 2 발주 추천: 사유 1위(이탈의 32%, 약 1.0%p) 중 1/3을 해소한다고 보면 −0.3%p. **효과는 GA 이후 1~2개월 뒤에 나타납니다**
  - 1 포스 v2: 수치를 줄이는 과제가 아니라 **대량 이탈을 막는 과제**입니다
  - → 12월 **2.6~2.7%**, 2027년 2월 **2.3% 근접**

  **전환 목표**: 온보딩, 엑셀, 바코드는 11월 체험 코호트부터 반영됩니다. 12월 코호트 기준 **20~21%**를 예상하고, 22%는 Q1에 달성할 것으로 봅니다.

  ## 6. 이해관계자별 설명 근거

  ### CEO: 14 거래처 포털 (제외, 검증으로 전환)
  - 12pw는 가용 용량의 20%입니다. 이번 분기 세 가지 목표 중 어디에도 직접 기여하지 않고, 검증 데이터도 아직 없습니다.
  - 12주 안에 끝나지 않아 12월 동결 기간에 걸립니다. 반쯤 만든 채로 분기를 넘기게 됩니다.
  - **대안**: 이번 분기에 PM이 검증을 진행합니다(매장 10곳과 공급업체 5곳 인터뷰, 지불 의향과 사용 빈도 확인). 결과는 12월 중순에 보고하고 Q1 착수 여부를 결정합니다.
  - **전략 연결**: 발주 추천(2)에서 쌓이는 "매장 → 발주 데이터"가 공급업체 포털의 기반입니다. 이번 분기 작업이 포털로 가는 첫 단계라고 설명할 수 있습니다.

  ### 영업총괄: 10 원가 리포트 (제외, 조건부 재검토)
  - 근거는 파이프라인 6건인데, 딜 규모와 단계, 원가 리포트가 실제 결정 요인인지가 확인되지 않았습니다.
  - 이번 분기 전환 목표(G2)는 체험 → 유료 셀프서브 전환이라서 영업 딜과는 경로가 다릅니다.
  - 7pw는 발주 추천의 70%에 해당하는 규모입니다.
  - **요청**: 10/23까지 6건의 예상 MRR, 단계, "원가 리포트가 없으면 계약하지 않는다"는 고객 발언 근거를 공유해 주시면 W6 게이트에서 다시 보겠습니다. 급한 딜은 엑셀 내보내기와 템플릿으로 임시 대응하는 방안을 검토합니다.

  ### CS팀장: 5 엑셀 업로드 (포함), 7 알림톡 (조건부)
  - 5는 **W1–W2에 출시**합니다. CS 문의 월 38건이 줄어드는 효과를 11월에 측정해 공유하겠습니다.
  - 7은 "요청 많음"이라는 정성 근거뿐이라 조건부로 두었습니다. **4주간 요청 건수를 태깅**해 주시면 W6 게이트에서 알림 설정(15)과 묶어 결정합니다.

  ### (참고) 다지점 고객 4곳
  - 다지점 고객은 매출의 14%를 차지하고, 4곳이 해지를 언급했습니다. 로고 수로는 작지만 매출 위험은 큽니다.
  - 조건부 MVP와 별도로, **CS/영업이 10월 중 4곳을 전담 관리**하고 로드맵을 공유합니다.

  ## 7. 리스크

  | 리스크 | 영향 | 가능성 | 대응 |
  |---|---|---|---|
  | 포스플러스 v2 공개 지연이나 스펙 변경 | 높음 | 중간 | 10월 중 샌드박스 확보 요청, 어댑터 계층 선분리, 공개가 11/7을 넘기면 조건부 과제 전부 취소하고 버퍼 투입. v1 폴백 유지 |
  | 포스 v2 전환이 12월 성수기에 걸림 | 높음 | 중간 | 단계 전환을 11/28까지 끝내는 것이 목표. 늦어지면 12월에는 신규 매장만 v2로 전환하고 기존 매장은 v1 종료 직전 야간에 전환 |
  | 발주 추천이 부정확해 신뢰 하락 | 중간 | 중간 | 옵트인 베타, 추천 근거 표시, 최소 4주 데이터가 있는 매장에만 노출 |
  | 모바일 개발자 1명 (단일 장애점) | 높음 | 낮음~중간 | 바코드 과제의 핵심 로직 문서화, 프론트 1명이 코드 리뷰에 참여, 스토어 제출 일정을 여유 있게 |
  | 공수 과소 추정 | 중간 | 중간 | 버퍼 20%, W6 게이트에서 재추정 |
  | 온보딩 효과가 상관관계에 불과할 가능성 | 중간 | 중간 | 신규 체험 매장 50%에만 적용하는 A/B 출시 |
  | 이탈 목표 2.3%를 Q4 안에 달성하지 못함 | 중간 | 높음 | 이번 리뷰에서 목표 시점을 재합의(5장) |

  ## 8. 다음 액션

  | # | 액션 | 담당 | 기한 |
  |---|---|---|---|
  | 1 | 금요일 리뷰에서 결정 받기: ① 확정·조건부 범위 ② 12/8 변경 동결 ③ 이탈 목표 시점 조정 ④ 14·10을 검증 과제로 전환 | PM | 10/2(금) |
  | 2 | 포스플러스에 v2 공개일, 샌드박스 제공일, v1/v2 병행 가능 여부 공식 확인 | PM + 백엔드 리드 | 10/7 |
  | 3 | 디자이너 휴가 날짜 확정, 10월 디자인 일정 고정 | PM + 디자이너 | 10/6 |
  | 4 | 팀장들과 직군별 공수 배분 재확인 (특히 발주 추천 10pw) | PM + 각 리드 | 10/8 |
  | 5 | 더닝과 온보딩의 측정 지표 정의 (회수율, 1일차 20품목 달성률), A/B 설정 | PM + 백엔드 | 10/10 |
  | 6 | 영업총괄에게 원가 리포트 딜 데이터 요청 | PM | 10/23 회신 |
  | 7 | CS팀 알림톡 요청 태깅 시작 | CS팀장 | 10/6부터 4주 |
  | 8 | 다지점 해지 언급 4곳 인터뷰 (MVP 범위 검증) | PM + CS | 10/31 |
  | 9 | 거래처 포털 검증 계획 수립과 인터뷰 착수 | PM | 10/16 착수 → 12/15 보고 |
  | 10 | W6 게이트 리뷰 (조건부 과제 go/no-go, 버퍼 재배분) | PM + 리드 | 11/13 |

  ---

  **확인 요청 (답에 따라 일정만 조정되고 우선순위는 바뀌지 않습니다)**
  1. 디자이너 휴가가 11월 중 정확히 어느 2주인가요?
  2. 포스플러스 v2 샌드박스를 10월 말 이전에 받을 수 있나요? v1과 v2를 12/31까지 병행할 수 있나요?
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Product Roadmap Prioritizer 실무 활용
    context: 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황
    problem: 대표와 PM이 중요하다고 느끼는 기능이 달라 우선순위 회의가 길어짐
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Product Roadmap Prioritizer에게 prioritized roadmap 형태로 정리해 달라고 요청합니다.
    exampleInput: 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 prioritized roadmap을 만들어줘.
    expectedResult: prioritized roadmap 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
    recommendedWorkflow: Local Business Validation Flow
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Bring candidate items, scoring dimensions, strategy constraints, effort estimates, and dependencies.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - prioritized roadmap
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Rank 20 feature candidates for the next quarter with effort estimates.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce prioritized roadmap for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Choose the company strategy from a brainstorm list.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황

    Goal: produce prioritized roadmap for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Product Roadmap Prioritizer.
  weakInputFixes:
    - weakInput: Help me with Product Roadmap Prioritizer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Rank 20 feature candidates for the next quarter with effort estimates. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 스타트업이 다음 분기 기능 후보 20개를 줄여야 하는 상황. Optimize for prioritized roadmap, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended prioritized roadmap
    - A clearly labeled prioritized roadmap section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes prioritized roadmap
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Ranking candidate roadmap items when impact, confidence, effort, and timing inputs exist
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Leadership has not agreed on strategy, constraints, or scoring dimensions
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Impact sub-scores (0-3 per goal) are assigned by judgment without per-item justification, e.g. monitoring (#17) gets G1=1 and performance (#12) gets G3=1 with no stated reason, so the 'objective' score depends on unexplained inputs
    - "The rank column mixes scores and verdicts: alert settings (#15, conditional) is ranked 6th, above the committed barcode (#3) and order-recommendation (#2) items, which makes the table confusing to paste as-is"
    - "The strong-run plan is optimistic in places: an 11pw order-recommendation GA on 11/28 leaves one week before the 12/8 freeze, and the fallback of cutting stores over from v1 overnight in late December conflicts with the freeze and the peak season it was meant to protect"
    - When product type and goals are missing, it defaults to a generic B2B SaaS frame and ranks items on plausible-sounding but unsupported rationales (e.g. payment methods 'reduce payment failures/churn', admin roles 'enterprise deal blocker')
    - Outputs run long; the strong run adds a separate per-role capacity table and a KPI forecast on top of the main table, which is useful but heavy for a single exec review page
  evaluationCriteria:
    - Shows scoring assumptions, tradeoffs, confidence, dependencies, and sequencing rationale
    - Produces prioritized roadmap in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Korean B2B SaaS cutting 18 Q4 candidates to a roadmap
      input: |-
        다음 분기(2026 Q4, 10/6~12/26, 12주) 로드맵 우선순위를 정리해 주세요. 금요일 경영진 리뷰에 그대로 붙일 수 있는 형태면 좋겠습니다.

        회사/제품: "밀키트노트" — 소규모 식당·카페(직원 3~15명)용 재고·발주 관리 SaaS. 웹 + 모바일 앱. 유료 매장 1,240곳, MRR 약 8,700만 원, 월 로고 이탈률 3.1%(목표 2.0%).

        목표(우선순위 순):
        1. 이탈률 3.1% → 2.3%로 낮추기
        2. 신규 유료 전환율(14일 체험 → 유료) 18% → 22%
        3. 12월 연말 성수기 전에 장애 없이 안정화

        팀 capacity: 백엔드 3명, 프론트 2명, 모바일 1명, 디자이너 1명, PM 1명(나). 12주 × 7명 개발 = 대략 80 person-week인데 운영/버그 대응으로 25% 빠짐 → 가용 약 60 person-week.

        제약:
        - 10월 말 POS 연동 파트너(포스플러스) API가 v2로 바뀜. v1은 12/31 종료 확정. 현재 매장의 41%가 이 연동을 씀.
        - 11월에 디자이너 2주 휴가.
        - 모바일 앱 스토어 심사 기간 평균 3일.

        후보 목록 (추정 공수는 팀장 추정, 영향은 데이터 근거 표시):
        1. 포스플러스 API v2 마이그레이션 — 8pw. 안 하면 41% 매장 연동 중단.
        2. 발주 추천(지난 4주 소진량 기반) — 10pw. 인터뷰 12곳 중 9곳 요청. 이탈 사유 1위 "발주 여전히 수작업"(해지 설문 32%).
        3. 재고 실사 모바일 바코드 스캔 — 6pw. 체험 사용자 세션 녹화에서 실사 화면 이탈 58%.
        4. 온보딩 체크리스트 개편 — 3pw. 체험 1일차에 품목 20개 이상 등록한 매장의 전환율 31% vs 미만 9%.
        5. 엑셀 품목 일괄 업로드 개선(오류 행 표시) — 2pw. CS 문의 월 140건 중 38건.
        6. 다지점 대시보드 — 9pw. 다지점 고객 23곳(매출 비중 14%), 그중 4곳이 "없으면 해지" 언급.
        7. 카카오 알림톡으로 재고 부족 알림 — 3pw. 요청 많음(정확한 수치 없음).
        8. 다크 모드 — 2pw. 요청 11건.
        9. 결제 실패 재시도/더닝 메일 — 2pw. 비자발적 이탈이 전체 이탈의 약 0.6%p로 추정.
        10. 원가 리포트(메뉴별 원가율) — 7pw. 영업팀이 신규 계약 필수라고 주장, 근거는 영업 파이프라인 6건.
        11. 권한 관리(직원별 메뉴 접근 제한) — 4pw. 보안 문의 월 5건.
        12. 앱 성능 개선(품목 2,000개 이상 매장에서 목록 로딩 6~9초) — 4pw. 해당 매장 87곳, NPS -12.
        13. 영문 UI — 5pw. 해외 문의 월 2~3건.
        14. 거래처(공급업체) 포털 — 12pw. 전략적이라고 CEO가 언급, 검증 데이터 없음.
        15. 알림 설정 세분화 — 1pw.
