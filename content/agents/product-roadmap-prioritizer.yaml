  1. **공수 추정을 직군별(BE/FE/모바일/디자인)로 나눠 주실 수 있나요?** 총량 기준으로는 여유가 있지만, 제가 가정한 분해로 보면 **모바일 1명이 병목(가동률 98%)** 입니다. 모바일 앱이 FE와 코드를 공유하는 구조라면(예: RN/웹뷰) 병목이 풀립니다.
  2. **디자이너 휴가 날짜와 12월 배포 동결 정책.** 아래는 휴가 11/9~11/20, 고위험 배포 마감 11/27, 12/14부터 동결로 가정했습니다.
  3. **"이탈률 2.3%"는 언제 측정하나요?** 11월 말에 배포되는 기능은 12월 단월 이탈률에 거의 반영되지 않습니다. Q4 말 기준이라면 더닝(9번)의 비중을 더 높여야 하고, Q1 기준이라면 현재 계획이 맞습니다.

  아래는 이 세 가지를 [가정]으로 두고 작성한 안입니다.

  ---

  # 밀키트노트 2026 Q4 로드맵 우선순위 (안)

  기간: 2026-10-06 ~ 12-24 (실 영업일 57일) · 작성: PM · 10/2 경영진 리뷰용

  ## 요약

  - **확정 9개 항목, 37.5pw** (가용 58.4pw의 64%): POS v2 마이그레이션, 모니터링, 더닝, 엑셀 업로드, 온보딩 체크리스트, 앱 성능, 공휴일 캘린더, 발주 추천(웹 우선), 바코드 스캔.
  - **조건부 2개**: 알림톡(7번)은 POS v2가 일정대로 끝나면 W9에 투입, 다지점 대시보드(6번)는 해당 고객 4곳 확인 후 Q4에 개발하고 1월에 배포.
  - **제외**: 거래처 포털(14), 원가 리포트(10), 다크 모드, 권한 관리, 영문 UI, 알림 설정, 리퍼럴. 세 가지 목표와 연결되는 근거가 없거나 약합니다. 항목마다 다시 넣을 조건을 적어 두었습니다.
  - **순서의 핵심**: POS v2 전환은 **11/27까지 완료**합니다(v1 종료는 12/31이지만 12월 성수기에 전환하지 않기 위해서). 모니터링은 가장 먼저 합니다. 디자인은 휴가 전인 11/6까지 넘깁니다.
  - **가장 큰 리스크**: 포스플러스 v2 스펙이 늦게 공개되는 것, 모바일 1인 병목, 발주 추천이 성수기 수요를 과소 추정하는 것.

  ### 목표를 숫자로 바꾸면

  | 지표 | 현재 | 목표 | 월 해지 매장 수 |
  |---|---|---|---|
  | 로고 이탈률 | 3.1% | 2.3% | 1,240 × 3.1% ≈ **38곳 → 29곳 (월 약 10곳 감소 필요)** |
  | 비자발적 이탈 | 0.6%p (추정) | - | ≈ 7곳/월 → 더닝(9번)이 다룰 수 있는 대상 |
  | 자발적 이탈 중 "발주 수작업" | 2.5%p × 32% | - | ≈ 10곳/월 [가정: 해지 설문이 전체 해지를 대표] → 발주 추천(2번)이 다룰 수 있는 대상 |
  | POS 연동 매장 | 41% | - | ≈ **508곳**. 월 해지 수의 13배가 12/31에 연동 중단 위험에 놓임 |
  | 매장당 MRR | - | - | 8,700만 ÷ 1,240 ≈ **7.0만 원** |

  이 값들은 대상 규모(상한)이지 예상 효과가 아닙니다. 기능별 이탈 감소 효과를 측정한 데이터는 없습니다.

  ---

  ## 1. 점수 기준

  | 기준 | 목표 연결 | 가중치 | 0 | 1 | 2 | 3 |
  |---|---|---|---|---|---|---|
  | 이탈 감소 | 목표 1 | **45%** | 이탈 연결 근거 없음 | 간접 근거(CS 불만 등) | 특정 세그먼트의 불만을 측정한 데이터 | 해지 사유·해지 대상 규모를 직접 측정한 데이터 |
  | 체험→유료 전환 | 목표 2 | **30%** | 근거 없음 | 간접 근거 | 체험 퍼널 이탈을 측정한 데이터 | 전환율 차이를 측정한 데이터 |
  | 성수기 안정성 | 목표 3 | **25%** | 무관 | - | 성능·부하 개선 | 장애 방지나 감지에 직접 기여 |

  - **가치** = Σ(점수 × 가중치), 최대 3.0
  - **신뢰도 계수**: 높음 1.0 (측정값 + 인과가 명확함) / 중간 0.8 (측정값은 있으나 해당 기능의 효과는 미검증) / 낮음 0.5 (의견·요청뿐이고 수치가 없음)
  - **우선순위 지수** = 가치 × 신뢰도 ÷ 공수(pw) × 100
  - **게이트(점수와 별개)**: 날짜가 확정된 외부 마감(1번)과 필수 선행 의존성(16번)은 점수와 관계없이 먼저 넣습니다.
  - **가중치를 정한 이유**: 목표에 매긴 우선순위(1 > 2 > 3)를 그대로 반영했습니다. 목표 3은 가중치는 가장 낮지만, 1번과 17번이 게이트나 상위권에 들어가면서 충족됩니다.
  - **민감도 점검**: 가중치를 균등하게(각 1/3) 바꿔도 IN/OUT 경계는 달라지지 않습니다(2번 9.7 > 3번 8.9 > 7번 5.6). 14번은 어떤 가중치로 계산해도 0점입니다. 세 목표 모두와 연결 근거가 없기 때문입니다.

