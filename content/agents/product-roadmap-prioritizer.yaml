        | 9 더닝 | 1.5 | 0.5 | 0 | 0 | 2 |
        | 5 엑셀 업로드 | 1 | 1 | 0 | 0 | 2 |
        | 12 성능 | 2 | 1 | 1 | 0 | 4 |
