        - → 12월 **2.6~2.7%**, 2027년 2월 **2.3% 근접**

        **전환 목표**: 온보딩, 엑셀, 바코드는 11월 체험 코호트부터 반영됩니다. 12월 코호트 기준 **20~21%**를 예상하고, 22%는 Q1에 달성할 것으로 봅니다.

        ## 6. 이해관계자별 설명 근거

        ### CEO: 14 거래처 포털 (제외, 검증으로 전환)
        - 12pw는 가용 용량의 20%입니다. 이번 분기 세 가지 목표 중 어디에도 직접 기여하지 않고, 검증 데이터도 아직 없습니다.
        - 12주 안에 끝나지 않아 12월 동결 기간에 걸립니다. 반쯤 만든 채로 분기를 넘기게 됩니다.
        - **대안**: 이번 분기에 PM이 검증을 진행합니다(매장 10곳과 공급업체 5곳 인터뷰, 지불 의향과 사용 빈도 확인). 결과는 12월 중순에 보고하고 Q1 착수 여부를 결정합니다.
        - **전략 연결**: 발주 추천(2)에서 쌓이는 "매장 → 발주 데이터"가 공급업체 포털의 기반입니다. 이번 분기 작업이 포털로 가는 첫 단계라고 설명할 수 있습니다.

        ### 영업총괄: 10 원가 리포트 (제외, 조건부 재검토)
        - 근거는 파이프라인 6건인데, 딜 규모와 단계, 원가 리포트가 실제 결정 요인인지가 확인되지 않았습니다.
        - 이번 분기 전환 목표(G2)는 체험 → 유료 셀프서브 전환이라서 영업 딜과는 경로가 다릅니다.
        - 7pw는 발주 추천의 70%에 해당하는 규모입니다.
        - **요청**: 10/23까지 6건의 예상 MRR, 단계, "원가 리포트가 없으면 계약하지 않는다"는 고객 발언 근거를 공유해 주시면 W6 게이트에서 다시 보겠습니다. 급한 딜은 엑셀 내보내기와 템플릿으로 임시 대응하는 방안을 검토합니다.

        ### CS팀장: 5 엑셀 업로드 (포함), 7 알림톡 (조건부)
        - 5는 **W1–W2에 출시**합니다. CS 문의 월 38건이 줄어드는 효과를 11월에 측정해 공유하겠습니다.
        - 7은 "요청 많음"이라는 정성 근거뿐이라 조건부로 두었습니다. **4주간 요청 건수를 태깅**해 주시면 W6 게이트에서 알림 설정(15)과 묶어 결정합니다.

        ### (참고) 다지점 고객 4곳
        - 다지점 고객은 매출의 14%를 차지하고, 4곳이 해지를 언급했습니다. 로고 수로는 작지만 매출 위험은 큽니다.
        - 조건부 MVP와 별도로, **CS/영업이 10월 중 4곳을 전담 관리**하고 로드맵을 공유합니다.

        ## 7. 리스크

        | 리스크 | 영향 | 가능성 | 대응 |
        |---|---|---|---|
        | 포스플러스 v2 공개 지연이나 스펙 변경 | 높음 | 중간 | 10월 중 샌드박스 확보 요청, 어댑터 계층 선분리, 공개가 11/7을 넘기면 조건부 과제 전부 취소하고 버퍼 투입. v1 폴백 유지 |
        | 포스 v2 전환이 12월 성수기에 걸림 | 높음 | 중간 | 단계 전환을 11/28까지 끝내는 것이 목표. 늦어지면 12월에는 신규 매장만 v2로 전환하고 기존 매장은 v1 종료 직전 야간에 전환 |
        | 발주 추천이 부정확해 신뢰 하락 | 중간 | 중간 | 옵트인 베타, 추천 근거 표시, 최소 4주 데이터가 있는 매장에만 노출 |
        | 모바일 개발자 1명 (단일 장애점) | 높음 | 낮음~중간 | 바코드 과제의 핵심 로직 문서화, 프론트 1명이 코드 리뷰에 참여, 스토어 제출 일정을 여유 있게 |
        | 공수 과소 추정 | 중간 | 중간 | 버퍼 20%, W6 게이트에서 재추정 |
        | 온보딩 효과가 상관관계에 불과할 가능성 | 중간 | 중간 | 신규 체험 매장 50%에만 적용하는 A/B 출시 |
        | 이탈 목표 2.3%를 Q4 안에 달성하지 못함 | 중간 | 높음 | 이번 리뷰에서 목표 시점을 재합의(5장) |

        ## 8. 다음 액션

        | # | 액션 | 담당 | 기한 |
        |---|---|---|---|
        | 1 | 금요일 리뷰에서 결정 받기: ① 확정·조건부 범위 ② 12/8 변경 동결 ③ 이탈 목표 시점 조정 ④ 14·10을 검증 과제로 전환 | PM | 10/2(금) |
        | 2 | 포스플러스에 v2 공개일, 샌드박스 제공일, v1/v2 병행 가능 여부 공식 확인 | PM + 백엔드 리드 | 10/7 |
        | 3 | 디자이너 휴가 날짜 확정, 10월 디자인 일정 고정 | PM + 디자이너 | 10/6 |
        | 4 | 팀장들과 직군별 공수 배분 재확인 (특히 발주 추천 10pw) | PM + 각 리드 | 10/8 |
        | 5 | 더닝과 온보딩의 측정 지표 정의 (회수율, 1일차 20품목 달성률), A/B 설정 | PM + 백엔드 | 10/10 |
        | 6 | 영업총괄에게 원가 리포트 딜 데이터 요청 | PM | 10/23 회신 |
        | 7 | CS팀 알림톡 요청 태깅 시작 | CS팀장 | 10/6부터 4주 |
        | 8 | 다지점 해지 언급 4곳 인터뷰 (MVP 범위 검증) | PM + CS | 10/31 |
        | 9 | 거래처 포털 검증 계획 수립과 인터뷰 착수 | PM | 10/16 착수 → 12/15 보고 |
        | 10 | W6 게이트 리뷰 (조건부 과제 go/no-go, 버퍼 재배분) | PM + 리드 | 11/13 |

        ---

        **확인 요청 (답에 따라 일정만 조정되고 우선순위는 바뀌지 않습니다)**
        1. 디자이너 휴가가 11월 중 정확히 어느 2주인가요?
        2. 포스플러스 v2 샌드박스를 10월 말 이전에 받을 수 있나요? v1과 v2를 12/31까지 병행할 수 있나요?
      reviewNotes:
        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "The arithmetic checks out throughout: impact sums and scores (e.g. #9 9x0.7/2=3.15, #3 7x0.7/6=0.82), committed 39 + conditional 9 + buffer 12 = 60pw, 41% of 1,240 = ~508 stores, 38/140 = 27% of CS tickets, per-role capacity (backend 27, frontend 18, mobile 9, designer 7.5 after 2-week leave)"
        - "It uses the input facts precisely and builds real dependencies from them: holiday calendar #16 before order recommendation #2, monitoring #17 before the staged POS v2 cutover, Excel upload #5 feeding the onboarding '20 items' step, mobile submissions 7 days before release given the 3-day review, and all design finalized in October before the November vacation"
        - "It pushes back usefully: it flags that 2.3% churn is unreachable within Q4 and shows the math (dunning -0.25~0.3%p, performance -0.05~0.1%p, order recommendation lagging after GA), proposing 2.6~2.7% for December and treats the 31% vs 9% onboarding gap as correlation with an A/B rollout"
        - "The stakeholder section has concrete, fair reasoning and asks: CEO #14 = 20% of capacity, no validated data, cannot finish in 12 weeks -> discovery with 10 stores + 5 suppliers; Sales #10 = request MRR/stage/quotes for the 6 deals by 10/23 for the W6 gate"
        - "Minor defects: the rank column puts conditional #15 above committed items, the sub-scores are not individually justified, and the late-December v1-overnight fallback sits awkwardly against the 12/8 freeze"
    - title: Prioritize a list of features with no goal, sizes, or data
      input: |-
        이 기능들 우선순위 좀 정해줘. 다음 분기에 다 할 수는 없을 것 같아.

        - 소셜 로그인
        - 알림 센터
        - 대시보드 리뉴얼
        - AI 요약 기능
        - 결제 수단 추가
        - 관리자 권한 세분화
        - 다국어 지원
      expectedOutputSummary: Point out that goals, team capacity, sizes, and product context are missing, ask a few focused questions, and still give a clearly labeled provisional Now/Next/Later ranking with its stated assumptions, criteria, and how the ranking would change under different goals.
      sampleOutput: |-
        지금 주신 건 기능 목록뿐이라 제품 유형, 다음 분기 목표, 팀 규모를 아직 모릅니다. 그래서 일반적인 B2B SaaS를 가정하고 **잠정안**부터 드립니다. 아래 질문 3개에 답해 주시면 그에 맞춰 순서를 다시 조정하겠습니다.

        ## 먼저 확인이 필요한 것 (우선순위를 바꿀 수 있는 정보)

        1. **다음 분기의 핵심 목표는 무엇인가요?** (예: 신규 가입 증가 / 매출·전환 / 기존 고객 유지 / 엔터프라이즈 계약)
        2. **팀 규모와 분기 가용 인력은 어느 정도인가요?** (예: 개발자 4명 × 12주)
        3. **이미 약속됐거나 막혀 있는 항목이 있나요?** (예: 특정 고객이 계약 조건으로 요구한 기능, 해외 출시 일정, 결제 수단 관련 매출 손실)

        ## 가정

        - B2B SaaS이고, 목표는 "매출과 유지율 개선"입니다.
        - 개발 인력은 4~5명 정도라서 한 분기에 **큰 기능 2개 + 작은 기능 1~2개**가 현실적인 한도입니다.
        - 특정 고객에게 약속한 기능이나 해외 출시 일정은 없습니다.

        ## 평가 기준

        각 기능을 **영향도**(목표 기여), **긴급도**(지연될 때 드는 비용), **노력**(규모), **의존성**의 네 가지로 거칠게 평가했습니다.

        | 기능 | 영향도 | 긴급도 | 노력 | 비고 |
        |---|---|---|---|---|
        | 결제 수단 추가 | 높음 | 높음 | 중간 | 매출에 직접 연결되고, 결제 실패나 이탈을 줄일 수 있음 |
        | 관리자 권한 세분화 | 높음 | 중간~높음 | 중간 | 규모가 큰 고객이나 엔터프라이즈 계약에 자주 걸리는 조건 |
        | 소셜 로그인 | 중간 | 중간 | 낮음 | 가입 전환을 개선하고 구현도 빠른 편 |
        | 알림 센터 | 중간 | 낮음 | 중간 | 유지율 개선용. AI 요약과 연결할 수 있음 |
        | AI 요약 기능 | 중간~높음(불확실) | 낮음 | 중간~높음 | 차별화 요소지만 비용·품질 검증이 필요 |
        | 대시보드 리뉴얼 | 중간 | 낮음 | 높음 | 범위가 쉽게 커짐. 사용자 불만 데이터가 없으면 미룰 것 |
        | 다국어 지원 | 목표에 따라 다름 | 낮음 | 높음 | 해외 진출 계획이 없으면 효과가 적음. 시간이 지날수록 비용이 커짐 |

        ## 추천 우선순위 (잠정)

        **다음 분기에 할 것 (Now)**
        1. **결제 수단 추가**: 매출에 가장 직접적으로 연결되고 범위도 명확합니다.
        2. **관리자 권한 세분화**: 큰 고객의 도입과 유지를 막는 요소를 제거합니다. 나중에 알림, AI 등 다른 기능도 권한 모델 위에 올라가므로 먼저 해두는 게 유리합니다.
        3. **소셜 로그인**: 노력이 적어서 남는 인력으로 끼워 넣기 좋습니다. 가입 전환 개선을 빠르게 확인할 수 있습니다.

        **그다음 분기 (Next)**
        4. **알림 센터**
        5. **AI 요약 기능**: 이번 분기에는 **1~2주 규모의 프로토타입이나 사용자 검증만** 진행하고, 본 개발은 다음 분기에 하는 것을 권합니다.

        **보류 (Later)**
        6. **대시보드 리뉴얼**: 구체적인 사용성 문제 데이터가 모일 때까지 보류합니다. 그전까지는 불편이 큰 화면만 부분적으로 개선합니다.
        7. **다국어 지원**: 해외 출시 계획이 정해지면 우선순위를 올립니다. 대신 이번 분기부터 **새 코드에 문자열을 하드코딩하지 않는 규칙(i18n 준비)**만 적용해 두면 나중에 드는 비용이 크게 줄어듭니다.

        ## 리스크

        - **권한 세분화의 범위 확장**: 역할과 권한 매트릭스를 먼저 확정하지 않으면 일정이 쉽게 늘어납니다. 첫 버전은 3~4개 역할로 제한하세요.
        - **결제 수단의 외부 의존성**: PG사 계약, 심사, 정산 테스트 기간이 개발 일정보다 길어질 수 있습니다. 계약 절차를 지금 바로 시작하는 게 좋습니다.
        - **AI 요약의 불확실성**: 품질, 비용(토큰), 개인정보 처리 이슈가 있습니다. 검증 없이 로드맵에 확정하면 위험합니다.
        - **가정이 틀렸을 경우**: 목표가 "해외 확장"이면 다국어 지원이, "신규 가입"이면 소셜 로그인이 1순위로 올라갈 수 있습니다.

        ## 다음 액션

        1. 위 질문 3개에 답해 주세요. 답을 받으면 순서와 분기 배치를 확정하겠습니다.
        2. 각 기능의 대략적인 규모(S/M/L 또는 인·주)를 개발 리드와 추정해 보세요.
        3. 결제 수단 추가를 진행한다면 PG사 계약과 심사 절차를 바로 시작하세요.
        4. 권한 세분화용으로 주요 고객 3~5곳에 필요한 역할을 확인해 보세요.
        5. AI 요약은 검증할 가설 하나(예: "요약이 있으면 주간 재방문이 늘어난다")를 정하고 짧은 프로토타입 범위를 잡아 두세요.
      reviewNotes:
        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "It gets the balance right: exactly 3 focused questions (quarterly goal, team capacity, committed/blocked items) plus a provisional ranking instead of stalling or asking a long list"
        - Assumptions are explicit and separated (B2B SaaS, revenue+retention goal, 4-5 devs, no committed features), and the Risks section states how the order flips under other goals (i18n first for expansion, social login for sign-ups)
        - "The impact/effort ratings are invented without data (payment methods 'high/high', social login 'low effort'); they are labeled rough, but the rationale for ranking payment methods #1 ('reduce payment failures/churn') is speculative for an unknown product"
        - "Practical hedges add value: an AI-summary prototype of 1-2 weeks only, capping the first version of admin roles at 3-4, starting PG contracting early, and adopting an i18n no-hardcoded-strings rule now"
        - It lacks any sizing scaffold beyond asking the user to estimate S/M/L, so the Now bucket ('2 large + 1-2 small') cannot be checked against capacity yet
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Ranking candidate roadmap items when impact, confidence, effort, and timing inputs exist
  - question: When should I choose something else?
    guidance: Leadership has not agreed on strategy, constraints, or scoring dimensions
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
