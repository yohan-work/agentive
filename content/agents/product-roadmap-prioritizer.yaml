        - **모바일이 병목입니다.** 발주 추천을 모바일까지 포함하면(+1.5pw) 7.5/6.15, 즉 122%가 됩니다. 그래서 **발주 추천은 웹 우선으로 하고 모바일 화면은 1월로** 넘겼습니다.
