        | 10 | 원가 리포트 | 근거는 파이프라인 6건뿐이고, 딜 금액·단계·"필수" 확인 여부가 없습니다. 신규 영업 딜은 목표 2(체험 → 유료 전환)와 다른 퍼널입니다 | 영업총괄이 10/16까지 6건의 금액, 단계, 고객이 "필수"라고 확인한 기록을 제출해 주시면 재채점합니다. 그래도 세 목표 밖이라, 넣으려면 경영진이 신규 MRR 목표를 추가하는 결정이 필요합니다 |
        | 8 | 다크 모드 | "요청 11건". 목표와 연결이 없습니다 | 이탈·전환 데이터와 연결되면 재평가합니다 |
        | 11 | 권한 관리 | "보안 문의 월 5건"은 문의일 뿐, 이탈이나 실주 근거가 아닙니다 | 해지·실주 사유에 권한 문제가 등장하거나 보안 사고가 나면 재평가합니다 |
