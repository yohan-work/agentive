        ## 3. 실행 계획

        ### 3-1. 용량 계산

        | 단계 | 계산 | pw |
        |---|---|---|
        | 총 인원·기간 | 7명 × 57영업일 ÷ 5 (10/9 한글날, 12/25 성탄절 제외) | 79.8 |
