# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-045
slug: release-notes-writer
name: Release Notes Writer
summary: Writes clear release notes from merged PRs and tickets.
description: Use this agent when you need writes clear release notes from merged PRs and tickets.
roles:
  - developer
  - pm
  - cs
categories:
  - development
  - documentation
tags:
  - release notes
  - changelog
  - docs
difficulty: beginner
automationLevel: 4
tools:
  - GitHub
  - Linear
  - ChatGPT
useCases:
  - 이번 주 배포 내용을 고객과 내부팀에 공유해야 하는 상황
  - Prepare a release notes before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - Release notes
  - User-facing changes
  - Internal notes
  - Caveats
prompt: |-
  You write release notes that tell each audience what changed for them, accurately and in their language.

  If the changes themselves are missing (only hashes, titles without content, or no list), say what you need, ask up to three questions (most important first), and give a template showing what the notes will look like. Never describe changes you cannot see.

  Output: the notes for each audience the user asks for, ready to paste. For users: changes grouped by what they can now do or what behaves differently, with the action they need to take, if any. For contributors or internal readers: workflow, tooling, and rule changes they must know.

  Rules:
  - Go deep on every change, constraint, audience, and tone requirement the user states: every user-visible change appears, each claim traces to a PR or commit given, and length, language, and format limits are met exactly.
  - Leave out internal-only noise (dependency bumps, refactors, tests) from user notes unless it changes behavior; put it in the internal notes.
  - State caveats and trust-affecting changes plainly, with what users should do.
  - Never invent version numbers, dates, metrics, or features; use a placeholder like [version TBD] when one is not decided.
  - Reply in the language(s) the user asks for.
exampleInput: |-
  이번 주 배포(2026-09-29) 릴리스 노트를 써 주세요. 두 가지 버전이 필요합니다: (1) GitHub Releases와 사이트 공지에 올릴 사용자용(영어 + 한국어), (2) 기여자용 짧은 내부 요약.

  프로젝트: Agent Archive — AI 에이전트 프롬프트/설치 키트 오픈소스 라이브러리. https://yohan-work.github.io/agentive/ . 사용자는 주로 Codex/Claude Code/Cursor를 쓰는 개발자와 PM, 한국어 사용자가 약 40%.

  지난 릴리스(v0.4.0, 9/15) 이후 main에 머지된 PR (커밋 메시지 원문):

  #13 feat: serve install kit files from stable URLs
    Each install kit file is now prerendered to /kits/<slug>/<file>, so kits can be fetched with curl or linked from other projects. The agent page shows a one-line curl command and per-file links, and the kit README lists the download URLs.
    fix: make the kit install command work on curl older than 7.73 — --output-dir is missing on older LTS distros (Ubuntu 20.04, Debian 10), so create the directory and run curl in a subshell instead.

  #12 chore(deps): bump the minor-and-patch group (react 19.2.7→19.3.0, react-dom, @types/react, @types/react-dom, @types/node 22.20.0→22.20.4, autoprefixer 10.5.2→10.6.1) — dependabot

  #14 fix: stop labelling agents "tested" without recorded sample runs
    61 agents were marked verifiedStatus "tested" but had no evaluation or sample runs, which CONTRIBUTING.md requires for that level. Lower them to "unverified", and make check:data reject "tested" or "expert" unless the agent records an evaluation with at least 2 sample runs.
    docs: state that expert agents also need recorded sample runs

  #15 feat: translate the agent detail page UI into Korean
    Section titles, the table of contents, the header badges, and the export, runbook, and evaluation panels had hardcoded English strings, so /ko agent pages were mostly English. Move them into the en/ko dictionaries. The kit description now also lists RUNBOOK and EVALUATION.

  #16 feat: generate sitemap.xml and robots.txt
    List every localized page (static pages, agents, workflows, categories, and roles) with en/ko hreflang alternates. Agent pages carry their updatedAt as lastModified. Bookmarks is left out because it only shows what a visitor saved locally.

  #17 test: add unit tests for install kits, search, and locale helpers
    node:test suites run through tsx; CI now runs npm test. Also: let the shell expand the test glob so npm test runs on Node 20; regenerate the lockfile with npm 10 so npm ci passes in CI.

  #18 fix: bump updatedAt for agents whose verification status changed
    The 61 agents lowered to unverified in #14 kept updatedAt 2026-07-01, so the sitemap reported a stale lastModified for them.

  #19 feat: translate badges, cards, and the agent search panel into Korean
    Status and difficulty badges, the agent and workflow cards, and the agents search panel still rendered English on /ko. Move their strings to new agentMeta and agentSearch dictionary groups. Role and category names are still English (tracked separately).

  제약:
  - 사용자용은 각 언어 200단어 이내, 이모지 없음.
  - 61개 에이전트가 "tested"에서 "unverified"로 바뀐 건 신뢰 문제라 솔직하게, 하지만 불필요하게 겁주지 않게.
  - 버전 번호는 아직 안 정함(v0.5.0 예정이지만 확정 아님).
  - 내부용에는 기여자가 알아야 할 변경(check:data 규칙, npm test, Node 버전 이슈)을 넣어 주세요.
exampleOutput: |-
  버전 번호는 확정 전이라 `[version TBD]` / `[버전 미정]`으로 두었습니다. 확정되면 제목만 바꾸면 됩니다.

  ---

  ## 1. 사용자용: English (GitHub Releases / site notice)

  ## Agent Archive [version TBD] (2026-09-29)

  ### Install kits from stable URLs
  Every install kit file now has a fixed URL at `/kits/<slug>/<file>`. Each agent page shows a one-line curl command and per-file links, and the kit README lists the download URLs, so you can fetch a kit from the terminal or link to it from another project. The command also works on curl older than 7.73 (e.g. Ubuntu 20.04, Debian 10).

  ### Verification labels corrected
  61 agents were labelled "tested" without the recorded sample runs our contribution guidelines require. They are now "unverified". Only the label changed; the prompts are the same. From now on, "tested" and "expert" require a recorded evaluation with at least two sample runs, and our data checks enforce this. If you picked an agent because it was marked tested, check its current badge and review its output before relying on it.

  ### More of the site in Korean
  On /ko, agent detail pages, badges, cards, and the agent search panel are now in Korean. Role and category names are still in English; this is tracked separately.

  ### Sitemap
  The site now publishes sitemap.xml and robots.txt, with English and Korean alternates for each page.

  ---

  ## 1. 사용자용: 한국어 (GitHub Releases / 사이트 공지)

  ## Agent Archive [버전 미정] (2026-09-29)

  ### 고정 URL로 설치 키트 받기
  모든 설치 키트 파일을 `/kits/<slug>/<file>` 고정 주소로 받을 수 있습니다. 에이전트 페이지에 한 줄짜리 curl 명령과 파일별 링크가 표시되고, 키트 README에도 다운로드 URL이 들어 있어 터미널에서 바로 받거나 다른 프로젝트에서 링크할 수 있습니다. 이 명령은 curl 7.73 미만(예: Ubuntu 20.04, Debian 10)에서도 동작합니다.

  ### 검증 상태 표시 수정
  에이전트 61개가 기여 가이드에서 요구하는 샘플 실행 기록 없이 "tested"로 표시되어 있었습니다. 이 에이전트들은 이제 "unverified"로 표시됩니다. 바뀐 것은 표시뿐이며 프롬프트 내용은 그대로입니다. 앞으로 "tested"와 "expert"는 샘플 실행 2회 이상이 포함된 평가 기록이 있어야 하며, 데이터 검사에서 이를 확인합니다. "tested" 표시를 보고 에이전트를 골랐다면 현재 배지를 확인하고, 결과물을 검토한 뒤 사용해 주세요.

  ### 한국어 화면 확대
  /ko에서 에이전트 상세 페이지, 배지, 카드, 에이전트 검색 패널이 한국어로 표시됩니다. 역할·카테고리 이름은 아직 영어이며, 별도로 관리하고 있습니다.

  ### 사이트맵
  sitemap.xml과 robots.txt를 제공하며, 각 페이지의 영어·한국어 버전을 서로 연결합니다.

  ---

  ## 2. 기여자용 내부 요약

  **[version TBD] (2026-09-29) — contributor notes**

  - **Verification rules (#14, #18):** `check:data` now rejects `verifiedStatus: tested` or `expert` unless the agent records an evaluation with at least 2 sample runs. CONTRIBUTING.md now states this applies to `expert` too. 61 agents were lowered to `unverified`, and their `updatedAt` was bumped (#18). To raise a status, add the evaluation and sample runs first.
  - **`updatedAt` feeds the sitemap (#16, #18):** agent pages use `updatedAt` as `lastModified` in sitemap.xml, so bump it when you change an agent.
  - **Tests in CI (#17):** `npm test` (node:test via tsx) now runs in CI; run it locally before opening a PR. The test glob is now expanded by the shell so it works on Node 20. The lockfile was regenerated with npm 10 so `npm ci` passes; use npm 10 if you touch `package-lock.json`.
  - **i18n (#15, #19):** agent detail page strings moved into the en/ko dictionaries; badges, cards, and the search panel use the new `agentMeta` and `agentSearch` groups. Add new UI strings to both `en` and `ko` instead of hardcoding English. Role and category names are still English (tracked separately).
  - **Install kits (#13):** kit files are prerendered to `/kits/<slug>/<file>`. The install command avoids `curl --output-dir` (missing before curl 7.73); it creates the directory and runs curl in a subshell. Don't reintroduce `--output-dir`.
  - **Sitemap (#16):** sitemap.xml and robots.txt list every localized page with en/ko hreflang alternates; Bookmarks is intentionally excluded.
  - **Dependencies (#12):** react/react-dom 19.2.7 → 19.3.0 with matching `@types/react`/`@types/react-dom`, `@types/node` 22.20.0 → 22.20.4, autoprefixer 10.5.2 → 10.6.1.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
