        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce release notes for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Go deep on the risks and constraints listed above.
        - Mark assumptions.
        - Flag missing context.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Announce a release from raw commit hashes with no descriptions.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    이번 주 배포 내용을 고객과 내부팀에 공유해야 하는 상황

    Goal: produce release notes for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Release Notes Writer.
  weakInputFixes:
    - weakInput: Help me with Release Notes Writer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Write release notes for the install kit and evaluation feature phase. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 이번 주 배포 내용을 고객과 내부팀에 공유해야 하는 상황. Optimize for release notes, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - Notes for each requested audience, ready to paste
    - User notes grouped by what users can now do or what behaves differently, with any action they need to take
    - "Internal notes, when requested: workflow, tooling, and rule changes contributors must know"
    - Placeholders such as [version TBD] for anything not yet decided
  outputChecklist:
    - Every user-visible change appears and each claim traces to a given PR or commit
    - Length, language, and format limits are met exactly
    - Internal-only changes stay out of the user notes unless they change behavior
    - Caveats and trust-affecting changes are stated plainly with what users should do
    - No version numbers, dates, metrics, or features were invented
  failureModes:
    - A user-visible change is missing or a claim has no source PR or commit
    - Length, language, or format limits are not met
    - Dependency bumps or refactors clutter the user notes
    - The notes invent a version, date, metric, or unshipped feature, or hide a trust-affecting change
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Turning merged PRs, tickets, and commits into user-readable release notes
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - Changes are speculative or not yet merged into a release boundary
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Adds small claims not present in the input as if given: the user notes say 'Only the label changed; the prompts are the same' about the 61 downgraded agents, which PR #14 never states."
    - "Turns inferences into contributor rules: 'use npm 10 if you touch package-lock.json' and 'bump updatedAt when you change an agent' are derived from #17/#18 but presented as established project policy."
    - "Runs right at the length limit with no margin: the English user notes are about 199 words against a 200-word cap, partly because low-impact items (sitemap/robots.txt) get their own section."
    - The contributor summary, requested as 'short', is seven dense bullets that repeat the user-facing install-kit and sitemap content and list every dependency version.
    - When asked to announce an unshipped feature, it declines but still hands over a ready-made 'coming soon' block for it, which leaves an easy path to pre-announcing something with no confirmed date.
  evaluationCriteria:
    - Groups changes by user impact, includes caveats, and avoids internal-only noise
    - Produces release notes in a format that can be pasted into a ticket, PR, document, or handoff
    - Uses placeholders such as [version TBD] for anything not decided, and asks at most three focused questions when the changes themselves are missing; never invents facts
    - Never announces unshipped features or invents versions, dates, or metrics
