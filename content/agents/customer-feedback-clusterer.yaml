prompt: You are Customer Feedback Clusterer. Convert the user's context into a practical feedback synthesis. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: |-
  지난 2주(9/15~9/28) 고객 의견을 정리해서 다음 주 제품 회의 자료로 쓰고 싶습니다. 제품은 "오더싱크" — 배달앱 3사(배민, 쿠팡이츠, 요기요) 주문을 한 태블릿에서 받는 매장용 앱입니다. 유료 매장 약 3,800곳. 채널은 앱 내 문의, 전화 상담 메모, 플레이스토어 리뷰입니다. 원문 그대로 붙입니다(매장명은 가림).

  1. [앱문의] 쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다.
  2. [전화] 점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트.
  3. [리뷰 ★1] 업데이트 후 로그인이 계속 풀려요. 매일 아침 다시 로그인해야 함.
  4. [앱문의] 영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요.
  5. [전화] 요기요 주문 알림이 두 번씩 울림. 같은 주문이 두 번 뜨는 건 아님.
  6. [리뷰 ★2] 정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이.
  7. [앱문의] 배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요.
  8. [전화] 알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름.
  9. [앱문의] 주문 들어왔는데 화면이 꺼져 있으면 알림이 안 울려요. 절전 모드 해제했는데도.
  10. [리뷰 ★5] 세 개 앱 따로 안 봐도 돼서 너무 편해요. 사장님들 강추.
  11. [앱문의] 메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요.
  12. [전화] 영업 종료 버튼 한 번에 3사 다 닫히면 좋겠음. 지금은 요기요만 따로 해야 함.
  13. [리뷰 ★1] 주문 누락! 쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음.
  14. [앱문의] 프린터 용지 끝나면 알려주는 기능 있나요?
  15. [전화] 로그인 풀림 문제 또 발생. 비밀번호 저장했는데도 매일 로그아웃.
  16. [앱문의] 월별 매출 엑셀 다운로드 되나요? 세무사가 달라고 함.
  17. [리뷰 ★3] 기능은 좋은데 월 3만 3천원은 비싸요. 작은 가게한테는 부담.
  18. [앱문의] 주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히.
  19. [전화] 쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의.
  20. [앱문의] 조리 시간 기본값을 메뉴별로 다르게 설정하고 싶어요.
  21. [리뷰 ★2] 알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번. 진동이라도 같이 오면 좋겠어요.
  22. [앱문의] 로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요.
  23. [전화] 정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음.
  24. [앱문의] 프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음.
  25. [리뷰 ★1] 고객센터 전화 연결이 너무 안 됨. 20분 대기.
  26. [앱문의] 다크 모드 있으면 밤에 눈이 덜 아플 듯.

  추가 맥락:
  - 9/18에 v4.12.0 배포(로그인 토큰 저장 방식 변경, 쿠팡이츠 연동 SDK 업데이트 포함).
  - 고객 이탈은 월 2.8%. 해지 사유 1위는 "주문 누락/알림 문제".
  - 청중: PM 2명, 개발 리드, CS 팀장. 30분 회의.
  - 제약: 다음 스프린트(2주)에 개발 여력 약 15 person-day.

  원하는 결과: 테마별 클러스터(건수 포함), 대표 인용, 심각도, 각 테마의 권장 다음 액션, 가정과 리스크.
exampleOutput: |-
  # 오더싱크 고객 의견 종합 (9/15~9/28)

  **대상:** PM 2명, 개발 리드, CS 팀장 · 30분 회의
  **입력:** 26건 (앱 내 문의 12, 전화 메모 8, 플레이스토어 리뷰 6)

  ---

  ## 1. 한 줄 요약

  **가장 큰 위험은 "주문을 놓치는 문제"입니다.** 해지 사유 1위(주문 누락/알림)와 같은 이야기가 7건으로 가장 많고, 그중 실제 주문 취소나 누락으로 이어진 사례가 여러 건입니다. 여기에 **v4.12.0(9/18) 이후 로그인 풀림 회귀**가 겹쳐 있습니다. 쿠팡이츠 관련 이슈가 5건인데, 같은 배포에 쿠팡이츠 SDK 업데이트가 포함돼 있어 연관 여부를 먼저 확인해야 합니다.

  ---

  ## 2. 테마별 클러스터

  | # | 테마 | 건수 | 심각도 | 해당 번호 |
  |---|---|---|---|---|
  | T1 | 주문 알림 실패·주문 누락 | **7** | 🔴 Critical | 1, 5, 7, 8, 9, 13, 21 |
  | T2 | 로그인 풀림 (v4.12.0 회귀) | 3 | 🟠 High | 3, 15, 22 |
  | T3 | 배달앱 연동 (품절·영업종료) | 3 | 🟠 High | 11, 12, 19 |
  | T4 | 피크 시간 지연·크래시 | 2 | 🟠 High | 2, 18 |
  | T5 | 영수증 프린터 | 3 | 🟡 Medium | 4, 14, 24 |
  | T6 | 정산 금액 불일치 | 2 | 🟡 Medium (신뢰 이슈) | 6, 23 |
  | T7 | 기능 요청 (편의) | 3 | 🟢 Low | 16, 20, 26 |
  | T8 | 가격·고객센터 | 2 | 🟡 Medium (이탈 신호) | 17, 25 |
  | T9 | 긍정 피드백 | 1 | — | 10 |

  > 합계 26건. 여러 테마에 걸친 건은 가장 핵심인 테마 하나에만 넣었습니다.

  **심각도 기준:** Critical = 매출 손실이나 주문 취소가 이미 발생 / High = 핵심 업무 방해 또는 회귀 / Medium = 불편·신뢰 저하 / Low = 개선 요청

  ---

  ### T1. 주문 알림 실패·주문 누락: 7건 🔴 Critical

  **하위 그룹**
  - **1a. 주문을 놓침 (5건: 1, 7, 9, 13, 21):** 알림음이 안 울리거나 너무 작거나, 화면이 꺼진 상태라 주문을 모른 경우입니다. 주문이 앱에 아예 안 뜬 경우도 있습니다.
  - **1b. 알림 구분·중복 (2건: 5, 8):** 요기요 알림이 두 번 울림, 앱별로 알림음을 다르게 하고 싶음.

  **대표 인용**
  > "쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다." (#1)
  > "주문 누락! 쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음." (#13)
  > "알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번." (#21)

  **관찰**
  - 확인된 주문 손실만 최소 6건입니다(#1 1건, #13 2건, #21 3건).
  - 쿠팡이츠를 명시한 건이 2건(#1, #13)입니다. #13은 알림 문제가 아니라 **주문 수신 자체 실패**라서 성격이 다르고 더 심각합니다.
  - #9(화면 꺼짐 시 알림 없음)는 Android 절전·백그라운드 제한 문제로 보입니다(가설).

  **권장 다음 액션**
  1. **(개발, P0)** 쿠팡이츠 주문 수신 경로를 조사합니다. 9/18 전후 주문 수신 로그와 쿠팡 측 주문 건수를 대조해 누락률을 측정하고, SDK 업데이트와의 연관성을 확인합니다.
  2. **(개발, P0)** 누락 방지 장치를 검토합니다. 예: 주기적으로 배달앱 주문 목록과 대조(reconciliation)하고, 미수신 주문을 감지하면 경고.
  3. **(개발, P1)** 알림 신뢰성을 개선합니다. 포그라운드 서비스와 화면 켜짐 알림, 미접수 주문 반복 알림, 진동 옵션(#21 요청)을 넣습니다.
  4. **(개발, P2)** 앱별 알림음 선택(#8)과 요기요 이중 알림(#5)은 다음 스프린트로 넘깁니다.
  5. **(CS, 즉시)** #1, #13, #21 매장에 먼저 연락해 상황을 파악합니다. 이탈 고위험군입니다.

  ---

  ### T2. 로그인 풀림: 3건 🟠 High (회귀)

  **대표 인용**
  > "로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요." (#22)
  > "비밀번호 저장했는데도 매일 로그아웃." (#15)

  **관찰**
  - 3건 모두 같은 증상(매일 아침 로그아웃)입니다. 고객이 버전까지 특정했고, 배포 내용(토큰 저장 방식 변경)과도 맞아떨어져 **원인 후보가 가장 명확한 이슈**입니다.
  - 오픈 전에 재로그인을 잊으면 T1(주문 놓침)로 번질 수 있습니다.

  **권장 다음 액션**
  1. **(개발, P0)** 토큰 저장·갱신 로직을 점검하고 핫픽스합니다. 기기 재부팅이나 앱 종료 후 토큰이 유지되는지, 리프레시 토큰 만료 설정은 어떤지 봅니다.
  2. **(데이터)** 9/18 이후 일별 재로그인 비율로 영향 범위를 측정합니다.
  3. **(CS, 즉시)** 핫픽스 전까지 안내할 공지와 응대 스크립트를 준비합니다.

  ---

  ### T3. 배달앱 연동 (품절·영업종료): 3건 🟠 High

  **대표 인용**
  > "메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요." (#11)
  > "쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의." (#19)
  > "영업 종료 버튼 한 번에 3사 다 닫히면 좋겠음. 지금은 요기요만 따로 해야 함." (#12)

  **관찰**
  - 쿠팡이츠 품절 연동 문제가 2건입니다. #19는 "세 번째 문의"라서 **이전부터 있던 미해결 이슈**일 수 있고, SDK 업데이트와는 무관할 가능성도 있습니다.
  - 품절이 반영되지 않으면 없는 메뉴로 주문이 들어오고, 취소와 평점 하락으로 이어집니다.
  - #12는 요기요 영업종료 연동이 아직 지원되지 않는 것으로 보입니다.

  **권장 다음 액션**
  1. **(개발, P1)** 쿠팡이츠 품절 API를 지원하는지, 연동이 실패하는지 1일 이내로 조사합니다. 버그인지, 미구현인지, 쿠팡 측 제약인지 구분합니다.
  2. **(PM)** 조사 결과를 바탕으로 해결 일정을 정하고 CS에 공유합니다. 반복 문의를 줄이려면 "언제 되는지" 답을 줘야 합니다.
  3. **(PM, 백로그)** 요기요 영업종료 연동이 가능한지 확인합니다.

  ---

  ### T4. 피크 시간 지연·크래시: 2건 🟠 High

  **대표 인용**
  > "점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트." (#2)
  > "주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히." (#18)

  **관찰**
  - 두 건 모두 점심 피크와 주문 접수 동작에서 발생합니다. 같은 원인일 가능성이 있습니다(가설: 저사양 기기의 메모리 부족, 동시 주문 처리 중 메인 스레드 블로킹).
  - 건수는 적지만 가장 바쁜 시간에 핵심 동작이 실패하는 문제입니다.

  **권장 다음 액션**
  1. **(개발, P1)** 크래시 리포트를 기기·시간대별로 분석하고, 갤럭시탭 A7 라이트 같은 저사양 기기에서 부하 재현 테스트를 합니다.
  2. **(데이터)** v4.12.0 전후 크래시율을 비교합니다.

  ---

  ### T5. 영수증 프린터: 3건 🟡 Medium

  **대표 인용**
  > "영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요." (#4)
  > "프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음." (#24)

  **관찰:** 연결 끊김(#4)과 이중 출력(#24)은 버그, 용지 부족 알림(#14)은 기능 요청입니다. #24 이중 출력은 T1의 #5(요기요 이중 알림)와 같은 이벤트 중복 처리 문제일 수 있습니다(가설).

  **권장 다음 액션**
  - **(CS)** #4는 연결 방식(BT/USB/LAN)과 기기 정보를 수집합니다.
  - **(개발, P2)** #24와 #5를 함께 보고 중복 이벤트 처리를 점검합니다.
  - #14는 백로그에 넣습니다.

  ---

  ### T6. 정산 금액 불일치: 2건 🟡 Medium (신뢰 이슈)

  **대표 인용**
  > "정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이." (#6)
  > "배민 1주 차 광고비가 빠져 있지 않음." (#23)

  **관찰:** 두 건 모두 **공제 항목(수수료, 광고비)이 빠지거나 다르게 계산된** 문제입니다. 금액은 작지만 돈과 관련된 오류는 제품 전체에 대한 신뢰를 떨어뜨립니다.

  **권장 다음 액션**
  - **(개발·데이터, 1일)** 두 매장의 실제 정산서와 앱 계산값을 대조합니다. 배민 광고비는 연동 데이터에 원래 없는 항목일 수 있습니다.
  - **(PM)** 앱에서 반영하지 못하는 항목이 있다면 정산 화면에 "예상 금액이며 광고비 등은 제외됨" 같은 문구를 명시하는 방안을 검토합니다.

  ---

  ### T7. 기능 요청: 3건 🟢 Low

  - 월별 매출 엑셀 다운로드 (#16), 세무 용도라 수요가 반복될 가능성이 높습니다.
  - 메뉴별 조리 시간 기본값 (#20)
  - 다크 모드 (#26)

  **권장 다음 액션:** 백로그에 등록합니다. #16은 이미 비슷한 기능이 있다면 CS FAQ로 바로 해결할 수 있습니다.

  ---

  ### T8. 가격·고객센터: 2건 🟡 Medium

  > "기능은 좋은데 월 3만 3천원은 비싸요. 작은 가게한테는 부담." (#17)
  > "고객센터 전화 연결이 너무 안 됨. 20분 대기." (#25)

  **관찰:** 가격 불만은 1건이라 추세로 보기는 어렵습니다. 전화 대기는 T1, T2 같은 회귀로 문의가 몰린 결과일 수 있습니다.
  **권장 다음 액션:** (CS) 9/18 전후 문의량과 대기 시간을 비교합니다. 로그인 이슈는 공지와 앱 내 안내로 문의 자체를 줄입니다.

  ---

  ### T9. 긍정: 1건

  > "세 개 앱 따로 안 봐도 돼서 너무 편해요. 사장님들 강추." (#10)

  통합 수신이라는 핵심 가치는 인정받고 있습니다. 그만큼 **주문 수신 신뢰성이 흔들리면 존재 이유가 흔들린다**는 뜻이기도 합니다.

  ---

  ## 3. 다음 스프린트 제안 (약 15 person-day)

  | 우선순위 | 항목 | 예상 공수* | 근거 |
  |---|---|---|---|
  | P0 | 로그인 풀림 핫픽스 (T2) | 2 | 명확한 회귀, 원인 후보 특정 |
  | P0 | 쿠팡이츠 주문 누락 조사 및 누락 감지 장치 (T1) | 5 | 해지 사유 1위, 주문 손실 발생 |
  | P1 | 알림 신뢰성: 화면 꺼짐, 반복 알림, 진동 (T1) | 3 | 주문 놓침 직접 원인 |
  | P1 | 피크 시간 지연·크래시 분석 및 수정 (T4) | 2.5 | 핵심 동작, 피크 시간 |
  | P1 | 쿠팡이츠 품절 연동 조사 (T3) | 1 | 반복 문의, 일정 답변 필요 |
  | P2 | 정산 불일치 대조 (T6) | 0.5 | 원인 파악까지만 |
  | — | 버퍼 (핫픽스 QA, 배포) | 1 | |
  | | **합계** | **15** | |

  \* 공수는 제가 임의로 가정한 수치입니다. 개발 리드가 검증해야 합니다.

  **이번 스프린트에서 제외:** 앱별 알림음, 요기요 이중 알림, 프린터 이슈, 영업종료 일괄 처리, 엑셀·조리시간·다크 모드. CS 대응과 백로그로 관리합니다.

  ---

  ## 4. 가정

  1. 26건은 이 기간에 받은 원문 전체이고, 한 매장이 여러 건을 남긴 경우는 구분하지 않았습니다(예: #11과 #19, #3·#15·#22가 같은 매장일 수 있음).
  2. 건수는 **신호의 강도**이지 발생률이 아닙니다. 3,800개 매장 중 26건이므로 실제 영향 범위는 텔레메트리로 확인해야 합니다.
  3. 알림 문제(#7, #9, #21)는 플랫폼이 명시되지 않은 경우 특정 배달앱 문제가 아니라고 가정했습니다.
  4. 원인 추정(SDK 연관, 저사양 기기, 이벤트 중복)은 모두 **가설**입니다. 로그로 검증되지 않았습니다.
  5. 심각도는 "매출 손실 여부"와 "해지 사유 연관성"을 기준으로 매겼습니다.

  ---

  ## 5. 리스크

  | 리스크 | 영향 | 대응 |
  |---|---|---|
  | 쿠팡이츠 누락 원인이 쿠팡 측 API에 있음 | 우리 쪽에서 고칠 수 없음, 일정 불확실 | 누락 감지와 경고로 피해를 먼저 줄이고, 쿠팡에 기술 문의를 병행 |
  | 로그인 핫픽스가 보안이나 토큰 정책과 충돌 | 핫픽스 지연 | 토큰 변경 의도를 개발 리드와 먼저 확인 |
  | 15 pd 안에 P0/P1을 다 못 끝냄 | 이탈 지속 | P0 두 건은 반드시 완료하고 P1은 조사까지만 하도록 범위 조정 |
  | 리뷰 기반 표본 편향 (부정 편향) | 우선순위 왜곡 | 크래시율, 재로그인률, 누락률 같은 정량 지표로 교차 검증 |
  | v4.12.0 영향 매장이 조용히 이탈 | 이번 달 이탈률 상승 | CS가 영향 매장에 선제 연락하고, 핫픽스 후 공지 |

  ---

  ## 6. 회의 전 확인하면 좋은 것 (필수는 아님)

  아래가 있으면 우선순위를 더 정확하게 잡을 수 있습니다. 회의 자료는 없어도 쓸 수 있습니다.

  1. **9/18 전후 쿠팡이츠 주문 수신 건수** (우리 앱 vs 쿠팡 측): 누락률 확인용
  2. **v4.12.0 전후 크래시율과 일별 재로그인 비율**
  3. #1, #13 발생 **날짜**: 9/18 이전이면 SDK 업데이트는 원인 후보에서 빠집니다
  4. 쿠팡이츠 품절 연동이 **원래 지원되던 기능인지** 여부

  ---

  ## 7. 30분 회의 진행안

  | 시간 | 내용 | 주도 |
  |---|---|---|
  | 0~5분 | 요약과 클러스터 표 공유 | PM |
  | 5~15분 | T1·T2 원인 가설 검토, P0 확정 | 개발 리드 |
  | 15~22분 | T3·T4 범위와 스프린트 공수 조정 | PM + 개발 리드 |
  | 22~27분 | CS 즉시 대응 (선제 연락, 공지, 응대 스크립트) | CS 팀장 |
  | 27~30분 | 담당자와 기한 확정 | 전원 |

  **회의에서 정해야 할 것:** ① P0 두 건의 담당자와 핫픽스 목표일 ② 쿠팡이츠 이슈 조사 결과를 공유할 시점 ③ CS 선제 연락 대상 매장 목록
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Customer Feedback Clusterer 실무 활용
    context: CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황
    problem: 개별 의견은 많지만 반복되는 문제와 우선순위가 보이지 않음
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Customer Feedback Clusterer에게 feedback synthesis 형태로 정리해 달라고 요청합니다.
    exampleInput: CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 feedback synthesis을 만들어줘.
    expectedResult: feedback synthesis 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Prepare raw feedback, source channels, customer identifiers, date range, and known duplicates.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - feedback synthesis
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Cluster 100 support notes into product improvement themes.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce feedback synthesis for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Prioritize roadmap changes from three anecdotal comments.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황

    Goal: produce feedback synthesis for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Customer Feedback Clusterer.
  weakInputFixes:
    - weakInput: Help me with Customer Feedback Clusterer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Cluster 100 support notes into product improvement themes. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황. Optimize for feedback synthesis, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended feedback synthesis
    - A clearly labeled feedback synthesis section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes feedback synthesis
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Grouping raw feedback into themes, severity, evidence, and product next actions
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The feedback sample is too small or already filtered to support prioritization
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Makes small counting and attribution errors outside the theme table: the header gives the channel split as 앱문의 12 / 전화 8 / 리뷰 6, but the input is 12 / 7 / 7, and Assumption 3 calls #7 platform-unspecified although #7 says '배민 주문 알림'."
    - "Puts feature requests into bug themes, which inflates severity: #8 (per-app alert sounds) and #5 (double Yogiyo chime) are counted in the 'Critical' T1 order-loss theme, and #12 (close all 3 apps with one button) sits in the 'High' T3."
    - "Sometimes generalizes past the quotes. It says all 3 login reports show 'the same symptom (daily morning logout)', but #22 only says logouts started after v4.12.0. It also counts '#13 2건' as confirmed order losses, though the quote says only that the orders did not appear in OrderSync."
    - On under-specified input it only asks for the data and describes the deliverable. It does not offer a provisional theme taxonomy or a paste template the user could start filling before tomorrow's meeting, and it has no separate risks section.
    - The output is long for a 30-minute meeting (9 theme sections plus sprint table, assumptions, risks, pre-meeting checks, and agenda). It uses emoji severity markers, which may not paste cleanly into tickets.
  evaluationCriteria:
    - Preserves representative quotes, counts themes, flags severity, and recommends next action
    - Produces feedback synthesis in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Cluster 26 Korean CS feedback quotes for a food-delivery POS app
      input: |-
        지난 2주(9/15~9/28) 고객 의견을 정리해서 다음 주 제품 회의 자료로 쓰고 싶습니다. 제품은 "오더싱크" — 배달앱 3사(배민, 쿠팡이츠, 요기요) 주문을 한 태블릿에서 받는 매장용 앱입니다. 유료 매장 약 3,800곳. 채널은 앱 내 문의, 전화 상담 메모, 플레이스토어 리뷰입니다. 원문 그대로 붙입니다(매장명은 가림).

        1. [앱문의] 쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다.
        2. [전화] 점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트.
        3. [리뷰 ★1] 업데이트 후 로그인이 계속 풀려요. 매일 아침 다시 로그인해야 함.
        4. [앱문의] 영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요.
        5. [전화] 요기요 주문 알림이 두 번씩 울림. 같은 주문이 두 번 뜨는 건 아님.
        6. [리뷰 ★2] 정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이.
        7. [앱문의] 배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요.
        8. [전화] 알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름.
        9. [앱문의] 주문 들어왔는데 화면이 꺼져 있으면 알림이 안 울려요. 절전 모드 해제했는데도.
        10. [리뷰 ★5] 세 개 앱 따로 안 봐도 돼서 너무 편해요. 사장님들 강추.
        11. [앱문의] 메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요.
        12. [전화] 영업 종료 버튼 한 번에 3사 다 닫히면 좋겠음. 지금은 요기요만 따로 해야 함.
        13. [리뷰 ★1] 주문 누락! 쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음.
        14. [앱문의] 프린터 용지 끝나면 알려주는 기능 있나요?
        15. [전화] 로그인 풀림 문제 또 발생. 비밀번호 저장했는데도 매일 로그아웃.
        16. [앱문의] 월별 매출 엑셀 다운로드 되나요? 세무사가 달라고 함.
        17. [리뷰 ★3] 기능은 좋은데 월 3만 3천원은 비싸요. 작은 가게한테는 부담.
        18. [앱문의] 주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히.
        19. [전화] 쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의.
        20. [앱문의] 조리 시간 기본값을 메뉴별로 다르게 설정하고 싶어요.
        21. [리뷰 ★2] 알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번. 진동이라도 같이 오면 좋겠어요.
        22. [앱문의] 로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요.
        23. [전화] 정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음.
