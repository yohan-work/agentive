# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-032
slug: customer-feedback-clusterer
name: Customer Feedback Clusterer
summary: Clusters raw feedback into themes, severity, and next actions.
description: Use this agent when you need clusters raw feedback into themes, severity, and next actions.
roles:
  - pm
  - cs
  - founder
categories:
  - research
  - operations
tags:
  - feedback
  - voc
  - clustering
difficulty: intermediate
automationLevel: 4
tools:
  - ChatGPT
  - Sheets
  - Zendesk
useCases:
  - CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황
  - Prepare a feedback synthesis before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - feedback synthesis
  - Themes with counts
  - Representative quotes
  - Recommended actions
prompt: |-
  You turn raw customer feedback into themes a product team can act on this sprint.

  If the feedback itself is missing, say so, ask for it (and for the product, channels, and time range if unknown), and describe how you will cluster it once you have it. Never invent feedback, counts, or quotes.

  Output:
  1. Themes, ordered by impact on the user's stated goal (for example churn or revenue). Each: a name, the count and the item numbers it includes, one or two verbatim quotes, severity with the reason, and the likely cause when the feedback points to one.
  2. Recommended action per theme: what to do, who owns it, and how you will know it worked, sized against the capacity the user gave.
  3. Items that fit no theme, and items that look like one-off requests.

  Rules:
  - Go deep on every piece of context the user gives (releases, dates, churn reasons, capacity, audience): connect it to the themes it explains, and say what it implies for priority.
  - Count exactly; every item belongs to one primary theme, and the counts add up to the total. Quote verbatim, never paraphrase inside quotes.
  - Separate what the feedback shows from what you infer, and mark inferences [ASSUMPTION]. Fill in everything the feedback supports; do not leave blanks the data can answer.
  - Keep ideas the feedback does not support to one line each under "Also worth watching".
  - Reply in the user's language.
exampleInput: |-
  지난 2주(9/15~9/28) 고객 의견을 정리해서 다음 주 제품 회의 자료로 쓰고 싶습니다. 제품은 "오더싱크" — 배달앱 3사(배민, 쿠팡이츠, 요기요) 주문을 한 태블릿에서 받는 매장용 앱입니다. 유료 매장 약 3,800곳. 채널은 앱 내 문의, 전화 상담 메모, 플레이스토어 리뷰입니다. 원문 그대로 붙입니다(매장명은 가림).

  1. [앱문의] 쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다.
  2. [전화] 점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트.
  3. [리뷰 ★1] 업데이트 후 로그인이 계속 풀려요. 매일 아침 다시 로그인해야 함.
  4. [앱문의] 영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요.
  5. [전화] 요기요 주문 알림이 두 번씩 울림. 같은 주문이 두 번 뜨는 건 아님.
  6. [리뷰 ★2] 정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이.
  7. [앱문의] 배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요.
  8. [전화] 알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름.
  9. [앱문의] 주문 들어왔는데 화면이 꺼져 있으면 알림이 안 울려요. 절전 모드 해제했는데도.
  10. [리뷰 ★5] 세 개 앱 따로 안 봐도 돼서 너무 편해요. 사장님들 강추.
  11. [앱문의] 메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요.
  12. [전화] 영업 종료 버튼 한 번에 3사 다 닫히면 좋겠음. 지금은 요기요만 따로 해야 함.
  13. [리뷰 ★1] 주문 누락! 쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음.
  14. [앱문의] 프린터 용지 끝나면 알려주는 기능 있나요?
  15. [전화] 로그인 풀림 문제 또 발생. 비밀번호 저장했는데도 매일 로그아웃.
  16. [앱문의] 월별 매출 엑셀 다운로드 되나요? 세무사가 달라고 함.
  17. [리뷰 ★3] 기능은 좋은데 월 3만 3천원은 비싸요. 작은 가게한테는 부담.
  18. [앱문의] 주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히.
  19. [전화] 쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의.
  20. [앱문의] 조리 시간 기본값을 메뉴별로 다르게 설정하고 싶어요.
  21. [리뷰 ★2] 알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번. 진동이라도 같이 오면 좋겠어요.
  22. [앱문의] 로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요.
  23. [전화] 정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음.
  24. [앱문의] 프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음.
  25. [리뷰 ★1] 고객센터 전화 연결이 너무 안 됨. 20분 대기.
  26. [앱문의] 다크 모드 있으면 밤에 눈이 덜 아플 듯.

  추가 맥락:
  - 9/18에 v4.12.0 배포(로그인 토큰 저장 방식 변경, 쿠팡이츠 연동 SDK 업데이트 포함).
  - 고객 이탈은 월 2.8%. 해지 사유 1위는 "주문 누락/알림 문제".
  - 청중: PM 2명, 개발 리드, CS 팀장. 30분 회의.
  - 제약: 다음 스프린트(2주)에 개발 여력 약 15 person-day.

  원하는 결과: 테마별 클러스터(건수 포함), 대표 인용, 심각도, 각 테마의 권장 다음 액션, 가정과 리스크.
exampleOutput: |-
  # 오더싱크 고객 의견 정리 (9/15~9/28, 26건)

  **요약:** 26건 중 7건이 주문 알림·누락 문제이고, 이는 해지 사유 1위("주문 누락/알림 문제")와 그대로 겹칩니다. 여기에 9/18 v4.12.0 배포와 시점·내용이 맞물리는 문제가 두 갈래 있습니다. 로그인 풀림 3건, 그리고 쿠팡이츠 관련 5건입니다. 다음 스프린트 15 person-day는 이 세 가지(알림·누락, 로그인 회귀, 쿠팡이츠 연동)에 먼저 쓰는 것을 권장합니다.

  **전체 구성**
  - 채널별: 앱 문의 12건 · 전화 8건 · 플레이스토어 리뷰 6건 (합계 26건)
  - 분류별: 테마 7개에 20건 · 테마 없음 3건 · 일회성 요청 3건 (합계 26건)

  ---

  ## 1. 테마 (해지 영향 순)

  ### T1. 주문 알림 미수신·주문 누락: 4건 (#1, #9, #13, #21)
  - **인용**
    - "쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다." (#1)
    - "쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음." (#13)
  - **심각도: 치명.** 4건 모두 주문을 실제로 놓쳤거나 놓칠 수 있는 상황이고, 그중 2건(#1, #21)은 주문 취소로 이어졌습니다. #21은 "이번 달만 3번"이라고 적었습니다. 해지 사유 1위와 같은 문제이고, 제품의 핵심 가치("세 개 앱 따로 안 봐도 돼서", #10)를 정면으로 무너뜨립니다. #13과 #21은 별점 1~2점 공개 리뷰라 신규 매장 유입에도 영향이 있습니다.
  - **피드백이 보여주는 것**
    - 4건 중 2건(#1, #13)이 쿠팡이츠에서 발생했습니다.
    - #13은 오더싱크에 주문이 아예 오지 않은 경우입니다. 알림 문제가 아니라 수신 문제입니다.
    - #9는 화면이 꺼져 있을 때만 알림이 울리지 않고, 절전 모드를 해제해도 같습니다.
  - **추정 원인**
    - [ASSUMPTION] 9/18 쿠팡이츠 연동 SDK 업데이트가 쿠팡 주문 수신과 알림 누락(#1, #13)의 원인일 수 있습니다. 각 문의의 발생 날짜가 없어 확인이 필요합니다.
    - [ASSUMPTION] #9는 Android 백그라운드 제한(Doze, 포그라운드 서비스, 알림 채널 설정) 문제로 보입니다. 앱의 절전 모드 해제만으로는 풀리지 않는 영역입니다.

  ### T2. v4.12.0 이후 로그인 풀림: 3건 (#3, #15, #22)
  - **인용**
    - "로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요." (#22)
    - "비밀번호 저장했는데도 매일 로그아웃." (#15)
  - **심각도: 높음.** 배포 이후 생긴 회귀이고 매일 반복됩니다. 3개 채널(리뷰·전화·앱 문의)에서 모두 들어와 특정 매장만의 문제가 아닐 가능성이 큽니다.
    - [ASSUMPTION] 매장이 아침에 다시 로그인하지 않으면 그동안 주문을 못 받습니다. 그러면 이 문제는 T1(주문 누락)의 원인이 되고, 해지 위험도 T1 수준으로 올라갑니다.
  - **추정 원인:** 배포 노트의 "로그인 토큰 저장 방식 변경"과 #22가 지목한 시점이 정확히 맞습니다. "매일 아침"(#3)이라는 표현으로 보아 토큰 만료나 갱신 실패가 하루 주기로 일어나는 것으로 보입니다. [ASSUMPTION]

  ### T3. 피크 시간 주문 접수 지연·앱 튕김: 2건 (#2, #18)
  - **인용**
    - "점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트." (#2)
    - "주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히." (#18)
  - **심각도: 높음.** 가장 바쁜 시간대에 핵심 동작(접수)이 멈추거나 앱이 종료됩니다.
    - [ASSUMPTION] 앱이 튕긴 동안 들어온 주문은 알림을 받지 못하므로 T1과 이어질 수 있습니다.
  - **추정 원인:** 두 건 모두 점심 12~1시에 발생했습니다. [ASSUMPTION] 주문이 몰릴 때 메인 스레드가 막히거나 메모리가 부족한 것으로 보이며, 저사양 기기(A7 Lite)에서 더 심할 것으로 보입니다. #18의 기기 정보는 없습니다.

  ### T4. 3사 매장 상태 연동 누락 (품절·영업 종료): 3건 (#11, #12, #19)
  - **인용**
    - "메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요." (#11)
    - "쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의." (#19)
  - **심각도: 중상.** 쿠팡이츠 품절이 반영되지 않으면 품절 메뉴로 주문이 들어오고, 매장이 주문을 취소하게 됩니다. #19는 같은 매장의 세 번째 문의라 CS 신뢰도가 떨어지고 있습니다. #12(요기요만 영업 종료를 따로 해야 함)는 불편 수준이라 심각도가 더 낮습니다.
  - **추정 원인:** 쿠팡이츠 연동 쪽 결함으로 보입니다. [ASSUMPTION] #19의 "세 번째 문의"로 보아 이 문제는 9/18 이전부터 있었고, SDK 업데이트 뒤에도 고쳐지지 않았을 수 있습니다.

  ### T5. 정산 금액 불일치: 2건 (#6, #23)
  - **인용**
    - "정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이." (#6)
    - "정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음." (#23)
  - **심각도: 중상.** 돈과 관련된 숫자가 틀리면 제품 전체에 대한 신뢰가 떨어집니다. #6은 공개 리뷰(★2)입니다. 두 건 모두 9월 1주 차 데이터라 v4.12.0 배포(9/18)와는 무관해 보입니다.
  - **추정 원인:** 쿠팡이츠 수수료와 배민 광고비가 정산 계산에 반영되지 않았습니다. [ASSUMPTION] 플랫폼별 차감 항목의 매핑이 빠졌거나 과금 체계 변경을 따라가지 못한 것으로 보입니다.

  ### T6. 알림 인지성 (음량·구분·중복): 3건 (#5, #7, #8)
  - **인용**
    - "배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요." (#7)
    - "알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름." (#8)
  - **심각도: 중간.** 알림이 울리긴 하지만 들리지 않거나 구분되지 않는 문제입니다. 다만 #7("주방에서 안 들림")은 사실상 주문을 놓칠 위험이 있고, #21의 진동 요청도 같은 방향이어서 T1의 해지 위험과 이어집니다.
  - **추정 원인:** #5(요기요 알림이 두 번 울리지만 주문은 한 번만 뜸)는 알림 이벤트가 중복 처리되는 것으로 보입니다. [ASSUMPTION] #24(프린터가 두 장씩 출력)와 원인이 같을 가능성이 있습니다.

  ### T7. 영수증 프린터: 3건 (#4, #14, #24)
  - **인용**
    - "영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요." (#4)
    - "프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음." (#24)
  - **심각도: 중간.** 주방 운영에 불편을 주지만 주문 자체는 앱에서 볼 수 있습니다. #14(용지 소진 알림)는 기능 요청입니다.
  - **추정 원인**
    - [ASSUMPTION] #4는 블루투스·USB 연결 유지(절전 시 연결 해제) 문제로 보입니다.
    - [ASSUMPTION] #24는 T6의 #5와 같은 이벤트 중복 문제일 수 있습니다.

  ### 쿠팡이츠 관련 이슈 (테마를 가로지르는 관점)
  쿠팡이츠 관련 항목은 5건(#1, #6, #11, #13, #19)으로, 여러 테마에 흩어져 있습니다. 26건 중 쿠팡이츠를 명시한 항목이 배민(#7, #23)이나 요기요(#5, #12)보다 많습니다. 9/18 SDK 업데이트 전후로 쿠팡이츠 연동을 한 번에 점검하는 것이 효율적입니다. [ASSUMPTION]

  ---

  ## 2. 권장 액션 (다음 스프린트 15 person-day 기준)

  공수는 모두 추정치입니다. [ASSUMPTION] 개발 리드의 검토가 필요합니다.

  | 순위 | 테마 | 할 일 | 담당 | 공수 | 성공 판단 기준 |
  |---|---|---|---|---|---|
  | 1 | T1 알림·누락 | ① 쿠팡이츠 주문을 서버 수신 로그와 쿠팡 원장으로 대조해 누락률 측정 ② SDK 업데이트 전후 수신·알림 경로 점검 ③ 화면이 꺼진 상태의 알림(포그라운드 서비스, 알림 채널 우선순위) 수정 ④ 미접수 주문 재알림(예: 1분 간격 반복) 추가 | 개발 리드 / PM 1 | 5.0 | 쿠팡 주문 누락 0건(대조 기준). "알림 못 받음" 문의가 2주 동안 절반 이하로 감소. 알림 후 미접수로 인한 취소 건 감소 |
  | 2 | T2 로그인 | v4.12.0 토큰 저장·갱신 로직 핫픽스. 토큰 갱신 실패 로깅 추가 | 개발 리드 | 2.0 | 7일 세션 유지율이 배포 전 수준으로 회복. 로그아웃 문의 0건 |
  | 3 | T3 피크 성능 | 12~1시 크래시 로그와 ANR 분석(기기별), A7 Lite에서 접수 동작 프로파일링 | 개발 리드 | 2.0 | 접수 응답 p95 1초 이하. 12~1시 크래시 없는 세션 비율 개선 |
  | 4 | T4 품절 연동 | 쿠팡이츠 품절 API 반영 실패 원인 수정(T1 점검과 묶어서). #19 매장에 직접 회신 | 개발 1명 / CS 팀장 | 2.0 | 쿠팡이츠 품절 반영 성공률 100%. 재문의 0건 |
  | 5 | T5 정산 | 쿠팡이츠 수수료와 배민 광고비 계산 로직 검증, 9월 1주 차 데이터 재계산 | 개발 1명 / PM 2 | 1.5 | 표본 매장의 정산이 플랫폼 정산서와 일치(차이 0원) |
  | 6 | T6 인지성 | 알림 진동 옵션 추가, 앱별 알림음 선택 기능(#8, #21). 요기요 중복 알림 원인 확인 | 개발 1명 | 2.0 | 알림음·진동 설정 사용률. "소리 안 들림" 문의 감소 |
  | – | T7 프린터 | 이번 스프린트에서는 제외. CS가 SRP-350III 연결 가이드를 제공하고, 두 장 출력 원인은 T6 중복 이벤트 조사 때 함께 확인 | CS 팀장 | 0 | 프린터 문의 추이 관찰 |
  | – | #12 영업 종료 | 다음 백로그. 요기요 API가 지원하는지 먼저 확인 | PM | 0 | – |

  **합계 14.5 person-day, 여유 0.5.** T1 조사가 길어지면 T6를 먼저 뺍니다. T2와 T4는 이미 알려진 결함 수정이므로 T1보다 먼저 끝낼 수 있습니다.

  ---

  ## 3. 테마에 넣지 않은 항목

  **테마 없음 (3건)**
  - **#10** 칭찬(★5): "세 개 앱 따로 안 봐도 돼서 너무 편해요." 핵심 가치가 통합 수신이라는 근거이고, 그래서 T1이 가장 치명적입니다.
  - **#17** 가격(★3): "월 3만 3천원은 비싸요. 작은 가게한테는 부담." 한 건뿐입니다. 해지 사유 데이터에서 가격이 몇 위인지 확인하는 것을 권장합니다.
  - **#25** 고객센터 연결(★1): "20분 대기." T1·T2 관련 문의가 몰리면서 대기가 길어졌을 가능성이 있습니다. [ASSUMPTION] CS 팀장이 기간 중 콜 수 추이를 확인해 주면 좋겠습니다.

  **일회성 기능 요청 (3건)**
  - **#16** 월별 매출 엑셀 다운로드 (세무사 요청)
  - **#20** 메뉴별 조리 시간 기본값
  - **#26** 다크 모드

  ---

  ## 가정과 리스크
  - **표본 규모:** 26건은 유료 매장 약 3,800곳 중 극히 일부입니다. 건수로 규모를 판단하지 말고, 로그와 대조 데이터로 영향 범위를 확인해야 합니다. 월 해지율 2.8%는 매달 약 106곳에 해당합니다.
  - **날짜 정보:** 대부분의 항목에 발생 날짜가 없어서 v4.12.0 배포 전후를 가를 수 있는 건 #22뿐입니다. T1·T4와 쿠팡이츠 SDK를 연결한 부분은 추정입니다.
  - **전화 메모:** 전화 항목은 상담원이 요약한 메모라 고객이 한 말 그대로가 아닐 수 있습니다.
  - **공수:** 표의 공수는 추정치라 T1 원인이 SDK 쪽(외부)이면 일정이 늘어날 수 있습니다.
  - **로그인과 누락의 연관성:** T2가 실제로 주문 누락을 일으키고 있다면 순위 1과 2를 합쳐 긴급 핫픽스로 처리해야 합니다.

  ## 30분 회의 구성 제안
  - **5분:** 요약과 테마 표
  - **10분:** T1과 T2 (원인 가설, 배포 연관성)
  - **10분:** 15 person-day 배분 합의
  - **5분:** CS 공지 여부 (로그인 문제 임시 대응 안내, #19 회신)

  ## 참고로 지켜볼 것
  - 로그인 풀림 문제에 대해 앱 내 공지나 임시 우회 방법 안내가 필요한지
  - 해지 사유 데이터에서 가격(#17)과 CS 대기(#25)의 비중
  - 저사양 기기(A7 Lite 등) 사용 매장의 비율
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Customer Feedback Clusterer 실무 활용
    context: CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황
    problem: 개별 의견은 많지만 반복되는 문제와 우선순위가 보이지 않음
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Customer Feedback Clusterer에게 feedback synthesis 형태로 정리해 달라고 요청합니다.
    exampleInput: CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 feedback synthesis을 만들어줘.
    expectedResult: 영향 순 테마(건수·항목 번호·원문 인용·심각도), 테마별 권장 액션(담당·성공 신호), 어느 테마에도 속하지 않는 항목이 정리됩니다.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Prepare raw feedback, source channels, customer identifiers, date range, and known duplicates.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - feedback synthesis
    - Themes with counts
    - Representative quotes
    - Recommended actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Cluster 100 support notes into product improvement themes.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce feedback synthesis for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Go deep on the risks and constraints listed above.
        - Mark assumptions.
        - Flag missing context.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Prioritize roadmap changes from three anecdotal comments.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황

    Goal: produce feedback synthesis for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Customer Feedback Clusterer.
  weakInputFixes:
    - weakInput: Help me with Customer Feedback Clusterer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Cluster 100 support notes into product improvement themes. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for CS 채널에 쌓인 고객 의견 100개를 제품 개선 항목으로 정리하는 상황. Optimize for feedback synthesis, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - "Themes ordered by impact on the stated goal: name, count and item numbers, verbatim quotes, severity with the reason, and likely cause"
    - A recommended action per theme with owner and success signal, sized to the stated capacity
    - Items that fit no theme and one-off requests
    - Unsupported ideas kept to one line each under "Also worth watching"
  outputChecklist:
    - Counts are exact and add up to the total
    - Quotes are verbatim
    - Every piece of context given (releases, churn reasons, capacity) is tied to the themes it explains
    - Inferences are marked [ASSUMPTION]
    - No feedback, counts, or quotes are invented
  failureModes:
    - Theme counts do not add up to the number of items
    - Quotes are paraphrased or invented
    - Actions ignore the capacity or goal the user gave
    - Counts are inflated to support a conclusion the data does not show
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Grouping raw feedback into themes, severity, evidence, and product next actions
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The feedback sample is too small or already filtered to support prioritization
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Summary-level tallies are less careful than theme counts: in the strong case the channel breakdown says phone 8 / reviews 6 when the input has 7 / 7 (#25 is a [리뷰 ★1], not a phone memo)."
    - "Headline numbers blend themes without saying so: '26건 중 7건이 주문 알림·누락 문제' silently adds T1 (4) and T6 (3), and the platform comparison lists 배민 as #7, #23 while omitting #11, which also mentions 배민."
    - "Stated ordering is not always followed: the out-of-scope table claims 영향도 순 yet ranks the 'low' recommendation-accuracy theme above the 'medium' coupon theme."
    - "Single-item issues are handled inconsistently: in the out-of-scope case #9 and #11 are both standalone themes and again listed under 테마 외 / 일회성, breaking the one-primary-bucket rule."
    - Effort estimates and owners in action tables are invented to fill the capacity budget; they are flagged [ASSUMPTION] but still presented as a precise 14.5 person-day plan.
  evaluationCriteria:
    - Preserves representative quotes, counts themes, flags severity, and recommends next action
    - Produces feedback synthesis in a format that can be pasted into a ticket, PR, document, or handoff
    - Marks assumptions inline with [ASSUMPTION] and asks at most three focused questions when required context is missing; never invents facts
    - Never invents or inflates feedback, counts, or quotes to support a desired conclusion
  sampleRuns:
    - title: Cluster 26 Korean CS feedback quotes for a food-delivery POS app
      input: |-
        지난 2주(9/15~9/28) 고객 의견을 정리해서 다음 주 제품 회의 자료로 쓰고 싶습니다. 제품은 "오더싱크" — 배달앱 3사(배민, 쿠팡이츠, 요기요) 주문을 한 태블릿에서 받는 매장용 앱입니다. 유료 매장 약 3,800곳. 채널은 앱 내 문의, 전화 상담 메모, 플레이스토어 리뷰입니다. 원문 그대로 붙입니다(매장명은 가림).

        1. [앱문의] 쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다.
        2. [전화] 점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트.
        3. [리뷰 ★1] 업데이트 후 로그인이 계속 풀려요. 매일 아침 다시 로그인해야 함.
        4. [앱문의] 영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요.
        5. [전화] 요기요 주문 알림이 두 번씩 울림. 같은 주문이 두 번 뜨는 건 아님.
        6. [리뷰 ★2] 정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이.
        7. [앱문의] 배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요.
        8. [전화] 알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름.
        9. [앱문의] 주문 들어왔는데 화면이 꺼져 있으면 알림이 안 울려요. 절전 모드 해제했는데도.
        10. [리뷰 ★5] 세 개 앱 따로 안 봐도 돼서 너무 편해요. 사장님들 강추.
        11. [앱문의] 메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요.
        12. [전화] 영업 종료 버튼 한 번에 3사 다 닫히면 좋겠음. 지금은 요기요만 따로 해야 함.
        13. [리뷰 ★1] 주문 누락! 쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음.
        14. [앱문의] 프린터 용지 끝나면 알려주는 기능 있나요?
        15. [전화] 로그인 풀림 문제 또 발생. 비밀번호 저장했는데도 매일 로그아웃.
        16. [앱문의] 월별 매출 엑셀 다운로드 되나요? 세무사가 달라고 함.
        17. [리뷰 ★3] 기능은 좋은데 월 3만 3천원은 비싸요. 작은 가게한테는 부담.
        18. [앱문의] 주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히.
        19. [전화] 쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의.
        20. [앱문의] 조리 시간 기본값을 메뉴별로 다르게 설정하고 싶어요.
        21. [리뷰 ★2] 알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번. 진동이라도 같이 오면 좋겠어요.
        22. [앱문의] 로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요.
        23. [전화] 정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음.
        24. [앱문의] 프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음.
        25. [리뷰 ★1] 고객센터 전화 연결이 너무 안 됨. 20분 대기.
        26. [앱문의] 다크 모드 있으면 밤에 눈이 덜 아플 듯.

        추가 맥락:
        - 9/18에 v4.12.0 배포(로그인 토큰 저장 방식 변경, 쿠팡이츠 연동 SDK 업데이트 포함).
        - 고객 이탈은 월 2.8%. 해지 사유 1위는 "주문 누락/알림 문제".
        - 청중: PM 2명, 개발 리드, CS 팀장. 30분 회의.
        - 제약: 다음 스프린트(2주)에 개발 여력 약 15 person-day.

        원하는 결과: 테마별 클러스터(건수 포함), 대표 인용, 심각도, 각 테마의 권장 다음 액션, 가정과 리스크.
      expectedOutputSummary: All 26 items assigned to themes with exact counts summing to 26, verbatim quotes, severity tied to the churn reason and the 9/18 v4.12.0 release (login token change, Coupang SDK update), actions sized to 15 person-days with owners and success measures, plus assumptions and risks.
      sampleOutput: |-
        # 오더싱크 고객 의견 정리 (9/15~9/28, 26건)

        **요약:** 26건 중 7건이 주문 알림·누락 문제이고, 이는 해지 사유 1위("주문 누락/알림 문제")와 그대로 겹칩니다. 여기에 9/18 v4.12.0 배포와 시점·내용이 맞물리는 문제가 두 갈래 있습니다. 로그인 풀림 3건, 그리고 쿠팡이츠 관련 5건입니다. 다음 스프린트 15 person-day는 이 세 가지(알림·누락, 로그인 회귀, 쿠팡이츠 연동)에 먼저 쓰는 것을 권장합니다.

        **전체 구성**
        - 채널별: 앱 문의 12건 · 전화 8건 · 플레이스토어 리뷰 6건 (합계 26건)
        - 분류별: 테마 7개에 20건 · 테마 없음 3건 · 일회성 요청 3건 (합계 26건)

        ---

        ## 1. 테마 (해지 영향 순)

        ### T1. 주문 알림 미수신·주문 누락: 4건 (#1, #9, #13, #21)
        - **인용**
          - "쿠팡이츠 주문이 알림음 없이 들어와서 20분 동안 몰랐어요. 손님한테 취소당했습니다." (#1)
          - "쿠팡이츠 주문이 앱에 아예 안 뜬 적이 2번 있음. 쿠팡 사장님앱엔 있었음." (#13)
        - **심각도: 치명.** 4건 모두 주문을 실제로 놓쳤거나 놓칠 수 있는 상황이고, 그중 2건(#1, #21)은 주문 취소로 이어졌습니다. #21은 "이번 달만 3번"이라고 적었습니다. 해지 사유 1위와 같은 문제이고, 제품의 핵심 가치("세 개 앱 따로 안 봐도 돼서", #10)를 정면으로 무너뜨립니다. #13과 #21은 별점 1~2점 공개 리뷰라 신규 매장 유입에도 영향이 있습니다.
        - **피드백이 보여주는 것**
          - 4건 중 2건(#1, #13)이 쿠팡이츠에서 발생했습니다.
          - #13은 오더싱크에 주문이 아예 오지 않은 경우입니다. 알림 문제가 아니라 수신 문제입니다.
          - #9는 화면이 꺼져 있을 때만 알림이 울리지 않고, 절전 모드를 해제해도 같습니다.
        - **추정 원인**
          - [ASSUMPTION] 9/18 쿠팡이츠 연동 SDK 업데이트가 쿠팡 주문 수신과 알림 누락(#1, #13)의 원인일 수 있습니다. 각 문의의 발생 날짜가 없어 확인이 필요합니다.
          - [ASSUMPTION] #9는 Android 백그라운드 제한(Doze, 포그라운드 서비스, 알림 채널 설정) 문제로 보입니다. 앱의 절전 모드 해제만으로는 풀리지 않는 영역입니다.

        ### T2. v4.12.0 이후 로그인 풀림: 3건 (#3, #15, #22)
        - **인용**
          - "로그아웃 문제요. 9/18 업데이트(v4.12.0) 이후부터 그래요." (#22)
          - "비밀번호 저장했는데도 매일 로그아웃." (#15)
        - **심각도: 높음.** 배포 이후 생긴 회귀이고 매일 반복됩니다. 3개 채널(리뷰·전화·앱 문의)에서 모두 들어와 특정 매장만의 문제가 아닐 가능성이 큽니다.
          - [ASSUMPTION] 매장이 아침에 다시 로그인하지 않으면 그동안 주문을 못 받습니다. 그러면 이 문제는 T1(주문 누락)의 원인이 되고, 해지 위험도 T1 수준으로 올라갑니다.
        - **추정 원인:** 배포 노트의 "로그인 토큰 저장 방식 변경"과 #22가 지목한 시점이 정확히 맞습니다. "매일 아침"(#3)이라는 표현으로 보아 토큰 만료나 갱신 실패가 하루 주기로 일어나는 것으로 보입니다. [ASSUMPTION]

        ### T3. 피크 시간 주문 접수 지연·앱 튕김: 2건 (#2, #18)
        - **인용**
          - "점심 피크 때 주문 접수 버튼 눌러도 반응이 5초 넘게 없음. 태블릿은 갤럭시탭 A7 라이트." (#2)
          - "주문 접수 누르면 가끔 앱이 튕겨요. 오후 12시~1시 사이에 특히." (#18)
        - **심각도: 높음.** 가장 바쁜 시간대에 핵심 동작(접수)이 멈추거나 앱이 종료됩니다.
          - [ASSUMPTION] 앱이 튕긴 동안 들어온 주문은 알림을 받지 못하므로 T1과 이어질 수 있습니다.
        - **추정 원인:** 두 건 모두 점심 12~1시에 발생했습니다. [ASSUMPTION] 주문이 몰릴 때 메인 스레드가 막히거나 메모리가 부족한 것으로 보이며, 저사양 기기(A7 Lite)에서 더 심할 것으로 보입니다. #18의 기기 정보는 없습니다.

        ### T4. 3사 매장 상태 연동 누락 (품절·영업 종료): 3건 (#11, #12, #19)
        - **인용**
          - "메뉴 품절 처리를 여기서 하면 배민에는 반영되는데 쿠팡이츠는 안 돼요." (#11)
          - "쿠팡이츠 품절 연동 안 되는 거 언제 고쳐지나요? 벌써 세 번째 문의." (#19)
        - **심각도: 중상.** 쿠팡이츠 품절이 반영되지 않으면 품절 메뉴로 주문이 들어오고, 매장이 주문을 취소하게 됩니다. #19는 같은 매장의 세 번째 문의라 CS 신뢰도가 떨어지고 있습니다. #12(요기요만 영업 종료를 따로 해야 함)는 불편 수준이라 심각도가 더 낮습니다.
        - **추정 원인:** 쿠팡이츠 연동 쪽 결함으로 보입니다. [ASSUMPTION] #19의 "세 번째 문의"로 보아 이 문제는 9/18 이전부터 있었고, SDK 업데이트 뒤에도 고쳐지지 않았을 수 있습니다.

        ### T5. 정산 금액 불일치: 2건 (#6, #23)
        - **인용**
          - "정산 화면에서 쿠팡이츠 수수료가 실제랑 달라요. 9월 1주 차 기준 8천원 차이." (#6)
          - "정산 금액 안 맞음. 배민 1주 차 광고비가 빠져 있지 않음." (#23)
        - **심각도: 중상.** 돈과 관련된 숫자가 틀리면 제품 전체에 대한 신뢰가 떨어집니다. #6은 공개 리뷰(★2)입니다. 두 건 모두 9월 1주 차 데이터라 v4.12.0 배포(9/18)와는 무관해 보입니다.
        - **추정 원인:** 쿠팡이츠 수수료와 배민 광고비가 정산 계산에 반영되지 않았습니다. [ASSUMPTION] 플랫폼별 차감 항목의 매핑이 빠졌거나 과금 체계 변경을 따라가지 못한 것으로 보입니다.

        ### T6. 알림 인지성 (음량·구분·중복): 3건 (#5, #7, #8)
        - **인용**
          - "배민 주문 알림 소리가 너무 작아요. 주방에서 안 들림. 볼륨 최대로 해도요." (#7)
          - "알림음 종류를 앱별로 다르게 하고 싶어요. 지금은 다 똑같아서 어디 주문인지 모름." (#8)
        - **심각도: 중간.** 알림이 울리긴 하지만 들리지 않거나 구분되지 않는 문제입니다. 다만 #7("주방에서 안 들림")은 사실상 주문을 놓칠 위험이 있고, #21의 진동 요청도 같은 방향이어서 T1의 해지 위험과 이어집니다.
        - **추정 원인:** #5(요기요 알림이 두 번 울리지만 주문은 한 번만 뜸)는 알림 이벤트가 중복 처리되는 것으로 보입니다. [ASSUMPTION] #24(프린터가 두 장씩 출력)와 원인이 같을 가능성이 있습니다.

        ### T7. 영수증 프린터: 3건 (#4, #14, #24)
        - **인용**
          - "영수증 프린터(빅솔론 SRP-350III) 연결이 하루에 두세 번 끊겨요." (#4)
          - "프린터가 주문서 두 장씩 뽑혀요. 설정에서 1장으로 돼 있음." (#24)
        - **심각도: 중간.** 주방 운영에 불편을 주지만 주문 자체는 앱에서 볼 수 있습니다. #14(용지 소진 알림)는 기능 요청입니다.
        - **추정 원인**
          - [ASSUMPTION] #4는 블루투스·USB 연결 유지(절전 시 연결 해제) 문제로 보입니다.
          - [ASSUMPTION] #24는 T6의 #5와 같은 이벤트 중복 문제일 수 있습니다.

        ### 쿠팡이츠 관련 이슈 (테마를 가로지르는 관점)
        쿠팡이츠 관련 항목은 5건(#1, #6, #11, #13, #19)으로, 여러 테마에 흩어져 있습니다. 26건 중 쿠팡이츠를 명시한 항목이 배민(#7, #23)이나 요기요(#5, #12)보다 많습니다. 9/18 SDK 업데이트 전후로 쿠팡이츠 연동을 한 번에 점검하는 것이 효율적입니다. [ASSUMPTION]

        ---

        ## 2. 권장 액션 (다음 스프린트 15 person-day 기준)

        공수는 모두 추정치입니다. [ASSUMPTION] 개발 리드의 검토가 필요합니다.

        | 순위 | 테마 | 할 일 | 담당 | 공수 | 성공 판단 기준 |
        |---|---|---|---|---|---|
        | 1 | T1 알림·누락 | ① 쿠팡이츠 주문을 서버 수신 로그와 쿠팡 원장으로 대조해 누락률 측정 ② SDK 업데이트 전후 수신·알림 경로 점검 ③ 화면이 꺼진 상태의 알림(포그라운드 서비스, 알림 채널 우선순위) 수정 ④ 미접수 주문 재알림(예: 1분 간격 반복) 추가 | 개발 리드 / PM 1 | 5.0 | 쿠팡 주문 누락 0건(대조 기준). "알림 못 받음" 문의가 2주 동안 절반 이하로 감소. 알림 후 미접수로 인한 취소 건 감소 |
        | 2 | T2 로그인 | v4.12.0 토큰 저장·갱신 로직 핫픽스. 토큰 갱신 실패 로깅 추가 | 개발 리드 | 2.0 | 7일 세션 유지율이 배포 전 수준으로 회복. 로그아웃 문의 0건 |
        | 3 | T3 피크 성능 | 12~1시 크래시 로그와 ANR 분석(기기별), A7 Lite에서 접수 동작 프로파일링 | 개발 리드 | 2.0 | 접수 응답 p95 1초 이하. 12~1시 크래시 없는 세션 비율 개선 |
        | 4 | T4 품절 연동 | 쿠팡이츠 품절 API 반영 실패 원인 수정(T1 점검과 묶어서). #19 매장에 직접 회신 | 개발 1명 / CS 팀장 | 2.0 | 쿠팡이츠 품절 반영 성공률 100%. 재문의 0건 |
        | 5 | T5 정산 | 쿠팡이츠 수수료와 배민 광고비 계산 로직 검증, 9월 1주 차 데이터 재계산 | 개발 1명 / PM 2 | 1.5 | 표본 매장의 정산이 플랫폼 정산서와 일치(차이 0원) |
        | 6 | T6 인지성 | 알림 진동 옵션 추가, 앱별 알림음 선택 기능(#8, #21). 요기요 중복 알림 원인 확인 | 개발 1명 | 2.0 | 알림음·진동 설정 사용률. "소리 안 들림" 문의 감소 |
        | – | T7 프린터 | 이번 스프린트에서는 제외. CS가 SRP-350III 연결 가이드를 제공하고, 두 장 출력 원인은 T6 중복 이벤트 조사 때 함께 확인 | CS 팀장 | 0 | 프린터 문의 추이 관찰 |
        | – | #12 영업 종료 | 다음 백로그. 요기요 API가 지원하는지 먼저 확인 | PM | 0 | – |

        **합계 14.5 person-day, 여유 0.5.** T1 조사가 길어지면 T6를 먼저 뺍니다. T2와 T4는 이미 알려진 결함 수정이므로 T1보다 먼저 끝낼 수 있습니다.

        ---

        ## 3. 테마에 넣지 않은 항목

        **테마 없음 (3건)**
        - **#10** 칭찬(★5): "세 개 앱 따로 안 봐도 돼서 너무 편해요." 핵심 가치가 통합 수신이라는 근거이고, 그래서 T1이 가장 치명적입니다.
        - **#17** 가격(★3): "월 3만 3천원은 비싸요. 작은 가게한테는 부담." 한 건뿐입니다. 해지 사유 데이터에서 가격이 몇 위인지 확인하는 것을 권장합니다.
        - **#25** 고객센터 연결(★1): "20분 대기." T1·T2 관련 문의가 몰리면서 대기가 길어졌을 가능성이 있습니다. [ASSUMPTION] CS 팀장이 기간 중 콜 수 추이를 확인해 주면 좋겠습니다.

        **일회성 기능 요청 (3건)**
        - **#16** 월별 매출 엑셀 다운로드 (세무사 요청)
        - **#20** 메뉴별 조리 시간 기본값
        - **#26** 다크 모드

        ---

        ## 가정과 리스크
        - **표본 규모:** 26건은 유료 매장 약 3,800곳 중 극히 일부입니다. 건수로 규모를 판단하지 말고, 로그와 대조 데이터로 영향 범위를 확인해야 합니다. 월 해지율 2.8%는 매달 약 106곳에 해당합니다.
        - **날짜 정보:** 대부분의 항목에 발생 날짜가 없어서 v4.12.0 배포 전후를 가를 수 있는 건 #22뿐입니다. T1·T4와 쿠팡이츠 SDK를 연결한 부분은 추정입니다.
        - **전화 메모:** 전화 항목은 상담원이 요약한 메모라 고객이 한 말 그대로가 아닐 수 있습니다.
        - **공수:** 표의 공수는 추정치라 T1 원인이 SDK 쪽(외부)이면 일정이 늘어날 수 있습니다.
        - **로그인과 누락의 연관성:** T2가 실제로 주문 누락을 일으키고 있다면 순위 1과 2를 합쳐 긴급 핫픽스로 처리해야 합니다.

        ## 30분 회의 구성 제안
        - **5분:** 요약과 테마 표
        - **10분:** T1과 T2 (원인 가설, 배포 연관성)
        - **10분:** 15 person-day 배분 합의
        - **5분:** CS 공지 여부 (로그인 문제 임시 대응 안내, #19 회신)

        ## 참고로 지켜볼 것
        - 로그인 풀림 문제에 대해 앱 내 공지나 임시 우회 방법 안내가 필요한지
        - 해지 사유 데이터에서 가격(#17)과 CS 대기(#25)의 비중
        - 저사양 기기(A7 Lite 등) 사용 매장의 비율
