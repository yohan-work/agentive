        ## 4. 가정

        1. 26건은 이 기간에 받은 원문 전체이고, 한 매장이 여러 건을 남긴 경우는 구분하지 않았습니다(예: #11과 #19, #3·#15·#22가 같은 매장일 수 있음).
        2. 건수는 **신호의 강도**이지 발생률이 아닙니다. 3,800개 매장 중 26건이므로 실제 영향 범위는 텔레메트리로 확인해야 합니다.
        3. 알림 문제(#7, #9, #21)는 플랫폼이 명시되지 않은 경우 특정 배달앱 문제가 아니라고 가정했습니다.
        4. 원인 추정(SDK 연관, 저사양 기기, 이벤트 중복)은 모두 **가설**입니다. 로그로 검증되지 않았습니다.
        5. 심각도는 "매출 손실 여부"와 "해지 사유 연관성"을 기준으로 매겼습니다.

        ---

        ## 5. 리스크

        | 리스크 | 영향 | 대응 |
        |---|---|---|
        | 쿠팡이츠 누락 원인이 쿠팡 측 API에 있음 | 우리 쪽에서 고칠 수 없음, 일정 불확실 | 누락 감지와 경고로 피해를 먼저 줄이고, 쿠팡에 기술 문의를 병행 |
        | 로그인 핫픽스가 보안이나 토큰 정책과 충돌 | 핫픽스 지연 | 토큰 변경 의도를 개발 리드와 먼저 확인 |
        | 15 pd 안에 P0/P1을 다 못 끝냄 | 이탈 지속 | P0 두 건은 반드시 완료하고 P1은 조사까지만 하도록 범위 조정 |
        | 리뷰 기반 표본 편향 (부정 편향) | 우선순위 왜곡 | 크래시율, 재로그인률, 누락률 같은 정량 지표로 교차 검증 |
        | v4.12.0 영향 매장이 조용히 이탈 | 이번 달 이탈률 상승 | CS가 영향 매장에 선제 연락하고, 핫픽스 후 공지 |

        ---

        ## 6. 회의 전 확인하면 좋은 것 (필수는 아님)

        아래가 있으면 우선순위를 더 정확하게 잡을 수 있습니다. 회의 자료는 없어도 쓸 수 있습니다.

        1. **9/18 전후 쿠팡이츠 주문 수신 건수** (우리 앱 vs 쿠팡 측): 누락률 확인용
        2. **v4.12.0 전후 크래시율과 일별 재로그인 비율**
        3. #1, #13 발생 **날짜**: 9/18 이전이면 SDK 업데이트는 원인 후보에서 빠집니다
        4. 쿠팡이츠 품절 연동이 **원래 지원되던 기능인지** 여부

        ---

        ## 7. 30분 회의 진행안

        | 시간 | 내용 | 주도 |
        |---|---|---|
        | 0~5분 | 요약과 클러스터 표 공유 | PM |
        | 5~15분 | T1·T2 원인 가설 검토, P0 확정 | 개발 리드 |
        | 15~22분 | T3·T4 범위와 스프린트 공수 조정 | PM + 개발 리드 |
        | 22~27분 | CS 즉시 대응 (선제 연락, 공지, 응대 스크립트) | CS 팀장 |
        | 27~30분 | 담당자와 기한 확정 | 전원 |

        **회의에서 정해야 할 것:** ① P0 두 건의 담당자와 핫픽스 목표일 ② 쿠팡이츠 이슈 조사 결과를 공유할 시점 ③ CS 선제 연락 대상 매장 목록
      reviewNotes:
        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "I recounted the theme counts and they are exact. T1 = {1,5,7,8,9,13,21} = 7, T2 = {3,15,22} = 3, T3 = {11,12,19} = 3, T4 = {2,18} = 2, T5 = {4,14,24} = 3, T6 = {6,23} = 2, T7 = {16,20,26} = 3, T8 = {17,25} = 2, T9 = {10} = 1. The total is 26, and every item #1 to #26 is assigned exactly once. The claim that '쿠팡이츠 관련 이슈가 5건' (#1, 6, 11, 13, 19) also checks out."
        - "Every representative quote appears verbatim in the input, or as a clean truncation of it (e.g. #21 '알림 소리 놓쳐서 주문 취소 당한 게 이번 달만 3번.', #23 '배민 1주 차 광고비가 빠져 있지 않음.'). None of the quotes are invented."
        - "It makes one factual count error: the header says '앱 내 문의 12, 전화 메모 8, 플레이스토어 리뷰 6', but the input has 7 phone notes (#2, 5, 8, 12, 15, 19, 23) and 7 reviews (#3, 6, 10, 13, 17, 21, 25). Assumption 3 also lists #7 as platform-unspecified, but #7 names 배민."
        - "It uses the given context well. It ties the T2 login regression to the v4.12.0 token-storage change, it separates #13 (order never received) from alert failures and flags the SDK link as a hypothesis, and its sprint table adds up to exactly 15 person-days (2+5+3+2.5+1+0.5+1), with the estimates explicitly labeled as its own assumptions."
        - "Severity is somewhat inflated by mixing in feature requests: #8 and #5 sit under 'Critical' T1, and #12 is under 'High' T3. The login observation also overgeneralizes: '3건 모두 같은 증상(매일 아침 로그아웃)' does not hold for #22."
    - title: Asks for a synthesis of feedback that was never pasted
      input: CS팀이 이번 달에 받은 고객 의견 200개 정도 있는데, 테마별로 묶고 어떤 게 제일 심각한지 알려주세요. 이탈에 영향 큰 순서로요. 내일 오전 회의에 써야 해요.
      expectedOutputSummary: It should recognize that the ~200 feedback items were never pasted and refuse to invent themes or rankings. It should ask for the raw data (plus optional churn signals), state how it will rank churn impact, and give a concrete next step the user can take before tomorrow's meeting.
      sampleOutput: |-
        내일 오전 회의에 쓰실 수 있게 바로 정리해 드릴게요. 다만 **고객 의견 원문이 아직 메시지에 포함되지 않았습니다.** 실제 데이터 없이 테마나 심각도를 만들어내면 회의에서 잘못된 결론으로 이어질 수 있어서, 원문을 받은 뒤에 분석하겠습니다.

        ## 1. 꼭 필요한 것 (이것만 있으면 시작 가능)

        **고객 의견 200건 원문**을 아래 방법 중 편하신 걸로 붙여 주세요.
        - 엑셀/시트에서 복사해 그대로 붙여넣기 (한 줄에 한 건)
        - CSV 텍스트
        - 양이 많으면 2~3번에 나눠 보내셔도 됩니다

        ## 2. 있으면 "이탈 영향도" 판단이 훨씬 정확해지는 것 (선택)

        각 의견에 아래 정보가 붙어 있으면 함께 주세요. 없어도 분석은 가능하지만, 없으면 이탈 영향은 **문장 내용 기반 추정**으로 표시됩니다.

        | 항목 | 왜 필요한가 |
        |---|---|
        | 해지/환불/다운그레이드 여부 | 실제 이탈과 직접 연결되는 테마 확인 |
        | 고객 등급 또는 매출 규모 (예: 유료/무료, 플랜) | 같은 불만이라도 매출 영향 가중치 반영 |
        | 채널 (전화, 채팅, 앱 리뷰, 설문 등) | 채널별 편향 보정 |
        | 날짜 | 이번 달 안에서 급증한 이슈 식별 |
        | CSAT/NPS 점수 | 심각도 보조 지표 |

        ## 3. 받으시게 될 결과물 (회의용 형태)

        1. **한 장 요약**: 이탈 영향 상위 3개 테마와 권장 조치 한 줄씩
        2. **테마별 클러스터 표**: 테마명, 건수(비중), 대표 인용문 2~3개, 심각도, 이탈 영향 순위
        3. **이탈 영향 순위 근거**: 빈도 × 심각도 × 이탈 신호(해지 언급, 경쟁사 언급, 반복 문의 등)
        4. **가정과 한계**: 데이터에서 확인한 것과 추정한 것을 구분
        5. **권장 조치 및 담당 제안**: 단기(이번 주) / 중기(이번 분기)
        6. **리스크**: 표본 편향, 소수지만 치명적인 이슈 등
        7. **다음 액션**: 회의에서 결정해야 할 항목 목록

        ## 4. 적용할 기본 가정 (다르면 알려 주세요)

        - "이탈 영향"은 **해지·환불·경쟁사 이동 언급, 핵심 기능 사용 불가, 반복 불만**을 강한 신호로 봅니다.
        - 한 의견에 여러 이슈가 섞여 있으면 복수 테마로 태깅합니다.
        - 칭찬/긍정 의견은 별도 테마로 분리해 "지켜야 할 강점"으로 정리합니다.
        - 결과는 한국어로, 회의 자료에 바로 붙일 수 있는 표 형식으로 드립니다.

        원문을 붙여 주시면 바로 분석 시작하겠습니다. 시간이 촉박하시면 2번 항목은 생략하고 원문만 보내셔도 됩니다.
      reviewNotes:
        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - It correctly notices the missing data in its first paragraph ('고객 의견 원문이 아직 메시지에 포함되지 않았습니다') and explicitly declines to fabricate themes. This is the right call.
        - "It keeps the question load small: there is one required item (the raw text, with paste formats and a split-into-batches option) and an optional table of churn signals (cancellation flag, plan, channel, date, CSAT), each with a stated reason."
        - "It moves the work forward by defining the churn-impact ranking up front ('빈도 × 심각도 × 이탈 신호') and listing default assumptions: multi-tagging, a separate praise theme, and Korean table output."
        - It gives no provisional scaffold, such as a starter theme taxonomy for common CS categories or a paste template with columns. With the meeting tomorrow, that would have made the reply more actionable.
        - Risks and limitations appear only as future deliverables, not as a separate section in this reply. For example, it does not warn that deriving churn impact from text alone, without cancellation data, is weak evidence.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Grouping raw feedback into themes, severity, evidence, and product next actions
  - question: When should I choose something else?
    guidance: The feedback sample is too small or already filtered to support prioritization
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
