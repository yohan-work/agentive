# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-016
slug: design-qa-agent
name: Design QA Agent
summary: Checks UI screens for consistency, accessibility, and implementation risks.
description: Use this agent before handoff or launch to catch design issues early.
roles:
  - designer
  - developer
  - pm
categories:
  - design
  - development
tags:
  - design qa
  - accessibility
  - handoff
difficulty: intermediate
automationLevel: 3
tools:
  - Figma
  - Playwright
  - ChatGPT
useCases:
  - Pre-handoff QA
  - Responsive review
  - Accessibility pass
inputs:
  - Screenshots
  - Design requirements
  - Breakpoints
  - Known constraints
outputs:
  - QA findings
  - Severity
  - Fix recommendations
prompt: You are a product design QA reviewer. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical design QA report with clear sections, assumptions, risks, and next actions.
exampleInput: Review a dark documentation layout on mobile and desktop.
exampleOutput: Spacing, contrast, overflow, hierarchy, and interaction findings.
limitations:
  - Needs visual evidence for specific UI findings.
bestPractices:
  - Include viewport sizes and expected behavior.
realUseCases:
  - title: Design QA Agent 실무 활용
    context: Pre-handoff QA
    problem: Checks UI screens for consistency, accessibility, and implementation risks. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 Design QA Agent에게 QA findings 형태로 정리해 달라고 요청합니다.
    exampleInput: Review a dark documentation layout on mobile and desktop. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Spacing, contrast, overflow, hierarchy, and interaction findings.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Screenshots
    - Design requirements
    - Breakpoints
    - Known constraints
  setupContextNotes:
    - Provide screenshots or a running URL, target viewports, design reference, and states to inspect.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - QA findings
    - Severity
    - Fix recommendations
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        QA the mobile navigation overlay and agent detail page spacing.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce QA findings for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Evaluate brand direction without seeing the interface.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Review a dark documentation layout on mobile and desktop.

    Goal: produce QA findings for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Design QA Agent.
  weakInputFixes:
    - weakInput: Help me with Design QA Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: QA the mobile navigation overlay and agent detail page spacing. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Pre-handoff QA. Optimize for QA findings, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended QA findings
    - A clearly labeled QA findings section
    - A clearly labeled Severity section
    - A clearly labeled Fix recommendations section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes QA findings
    - Includes Severity
    - Includes Fix recommendations
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Checking implemented screens against design intent, responsive behavior, and visual polish
    - "Teams with the required inputs ready: Screenshots, Design requirements, Breakpoints"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - There is no screenshot, design reference, or target viewport
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Can miss interaction details if only static screenshots are provided
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Finds layout, hierarchy, state, copy, and responsive issues with concrete fixes
    - Produces QA findings in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Design QA Agent strong-context run
      input: QA the mobile navigation overlay and agent detail page spacing.
      expectedOutputSummary: A usable QA findings with project-specific assumptions, risks, and next steps.
      sampleOutput: "QA findings: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Design QA Agent boundary run
      input: Evaluate brand direction without seeing the interface.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Checking implemented screens against design intent, responsive behavior, and visual polish
  - question: When should I choose something else?
    guidance: There is no screenshot, design reference, or target viewport
    alternativeAgentSlug: qa-checklist-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: wireframe-text-planner
relatedAgents:
  - qa-checklist-agent
  - wireframe-text-planner
verifiedStatus: expert
updatedAt: 2026-07-01
