evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Generating functional, edge, and regression cases from clear requirements
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The implementation behavior is still exploratory and expected outputs are unknown
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - "Bookkeeping errors in summaries: the coupon run says 'P1(17개)' when the matrix actually contains 15 P1 rows, and the MAX-dependent set is cited as A-12~A-14 in one place and A-13~A-15 in another."
    - "Generates code against guessed APIs: the node:test skeleton calls filterAgents(fx, { query, filters }) and models realUseCases as a string array, while the real src/lib/search.ts exposes separate searchAgents(agents, query) and filterAgents(agents, filters) and realUseCases are objects, so the skeleton needs rewriting."
    - "Tends toward length over triage: the strong run has roughly 75 cases across 8 tables plus oracle, unit-test, risk, recommendation and next-action sections for a request framed as a QA handoff, with the P0 smoke subset described but not actually listed."
    - Occasionally states unsupported estimates as facts, e.g. 'M 항목(약 60%)' and 'regression run 2~3시간 예상' without any basis in the input.
    - Adds scope the user did not ask for (accessibility/VoiceOver, performance on low-end devices, generic coupon validation group D) which dilutes the priority signal.
  evaluationCriteria:
    - Covers happy path, empty states, combinations, persistence, and regression risk
    - Produces test case matrix in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Korean test matrix for the real /agents search and filter panel
      input: |-
        /agents 페이지의 검색·필터 기능을 이번에 한국어화(PR #19)하면서 회귀 테스트 케이스를 다시 정리하려고 합니다. QA 1명이 수동으로 돌리고, 일부는 node:test 단위 테스트로 옮길 예정이에요.

        프로젝트: Agent Archive (Next.js 16 정적 export, GitHub Pages). /en/agents, /ko/agents 두 경로. 에이전트 100개, 그중 installTargets가 있는(설치 가능) 에이전트 20개.

        현재 동작(코드 기준):
        - 검색어: name, summary, description, tags, categories, roles, tools, realUseCases(한국어 사용 사례 텍스트 포함)를 공백으로 이어 붙여 소문자화한 문자열에 `includes`로 부분 일치. 앞뒤 공백은 trim. 빈 문자열이면 전체.
        - 필터 7종(모두 단일 선택, AND 조합): 역할(role), 카테고리(category), 난이도(beginner/intermediate/advanced), 자동화 수준(1~5), 도구(tool, 에이전트 데이터에서 중복 제거해 정렬), 검증 상태(unverified/community/tested/expert), "설치 가능만 보기" 체크박스.
        - 같은 필터 칩을 다시 누르면 해당 필터가 해제됨(토글). 다른 값을 누르면 교체.
        - "모두 지우기"(Clear all): 검색어와 필터 모두 초기화. "필터만 지우기"(Clear filters only): 필터만 초기화, 검색어 유지.
        - 결과 카운트: "100개 중 N개 표시"(ko) / "Showing N of 100 agents"(en). 활성 필터는 칩으로 표시(예: "난이도: 중급").
        - URL: `?query=`만 읽음(상단 검색창에서 넘어올 때). 다른 필터는 URL에 저장 안 됨 → 새로고침하면 초기화. 상단 검색으로 query가 바뀌면 다른 필터는 유지.
        - 결과 0개면 EmptyState 컴포넌트 표시.
        - 정적 페이지이므로 JS 로드 전에는 필터 없는 전체 목록이 렌더됨.

        테스트 대상 사용자: 한국어/영어 UI 사용자, 모바일(375px)과 데스크톱.
        제약: 테스트 서버 없음(로컬 `npm run dev` 또는 배포된 GitHub Pages). 자동화는 node:test + tsx로 src/lib/search.ts 함수 단위만 가능, E2E 도구는 아직 없음.

        원하는 결과: ID/분류/전제조건/절차/기대결과/우선순위 컬럼이 있는 테스트 케이스 매트릭스(정상 흐름, 빈 결과, 필터 조합, 새로고침/URL 유지, 한국어 문자열, 회귀 위험), 단위 테스트로 옮길 후보 표시, 가정과 리스크.
      expectedOutputSummary: "A Korean test case matrix with ID/category/precondition/steps/expected/priority columns covering normal search, empty results, filter combinations and toggling, Clear all vs Clear filters only, ?query= URL and refresh behavior, Korean strings and count copy, and PR #19 regression risks, marking which rows can move to node:test on src/lib/search.ts, plus assumptions and risks."
      sampleOutput: |-
        # /agents 검색·필터 회귀 테스트 매트릭스 (PR #19 한국어화 기준)

        말씀해 주신 동작 명세만으로 매트릭스를 만들 수 있어서 바로 작성했습니다. 명세에서 비어 있는 부분은 아래 "가정"에 적었습니다. 판단이 필요한 항목은 "기대결과"에 **[결정 필요]**로 표시했습니다. 맨 끝의 확인 질문 4개에 답해 주시면 해당 행을 확정하겠습니다.

        ---

        ## 1. 범위와 표기

        - **대상 경로**: `/en/agents`, `/ko/agents` (로컬 `npm run dev`와 GitHub Pages 배포본)
        - **뷰포트**: 모바일 375px, 데스크톱 1440px
        - **우선순위**
          - P0: 릴리스를 막는 항목. 매 회귀 때 실행합니다.
          - P1: 주요 흐름. 매 회귀 때 실행합니다.
          - P2: 엣지 케이스와 사양 확인. 분기 1회 또는 관련 코드가 바뀔 때 실행합니다.
        - **자동화 후보 열**
          - **U**: `src/lib/search.ts` 함수 단위로 node:test에 옮길 수 있습니다.
          - **M**: 수동으로만 확인할 수 있습니다(UI, URL, 렌더링).
          - **U+M**: 로직은 단위 테스트로, 표시는 수동으로 확인합니다.
        - **공통 전제조건 약칭**
          - `P-KO` / `P-EN`: 해당 경로를 로드해 JS 하이드레이션이 끝난 상태입니다. 검색어와 필터가 비어 있고 "100개 중 100개 표시"가 보입니다.
          - `ORC`: 기대 건수를 적은 오라클 시트입니다(3장 참고).

        ---

        ## 2. 가정

        1. 검색은 로케일과 무관합니다. `/en`과 `/ko`에서 같은 haystack(에이전트 원본 필드)을 씁니다. 따라서 **ko UI에 보이는 번역 라벨**(예: 카테고리 한국어명)은 haystack에 들어 있지 않습니다. 한국어로 매칭되는 것은 realUseCases의 한국어 텍스트뿐입니다.
        2. 필터 비교는 원시 값(`intermediate`, `tested`, 슬러그 등)으로 합니다. 번역은 칩 라벨에만 적용됩니다.
        3. 역할·카테고리·도구처럼 배열인 필드는 "선택한 값이 배열에 포함되면 일치"로 처리합니다.
        4. "설치 가능"은 `installTargets`가 1개 이상인 경우입니다. `installTargets: []`는 설치 불가로 봅니다.
        5. 페이지 안 검색창에 입력한 값은 URL에 쓰지 않습니다. 따라서 새로고침하면 URL의 `?query=` 값으로 돌아갑니다.
        6. 검색은 입력할 때마다 반영됩니다(Enter가 필요 없음). 디바운스가 있는지는 모릅니다.
        7. 총 개수 "100"은 하드코딩이 아니라 전체 에이전트 수에서 계산됩니다.

        ---

        ## 3. 테스트 데이터 준비 (오라클 시트)

        기대 건수 N을 화면이 아닌 **원본 데이터에서 따로 집계해 둬야** 회귀를 잡을 수 있습니다. 한 번 만들어 두고 에이전트 데이터가 바뀔 때만 갱신합니다.

        | 오라클 키 | 내용 |
        |---|---|
        | ORC-A | 기준 에이전트 A: 이름으로 검색했을 때 **정확히 1건**만 나오는 에이전트 |
        | ORC-F | tags, categories, roles, tools, summary, description, realUseCases(ko) 각각에**만** 들어 있는 단어 1개씩과 해당 에이전트 |
        | ORC-D | 난이도 3값별 건수(합계 100) |
        | ORC-L | 자동화 수준 1~5별 건수(합계 100) |
        | ORC-V | 검증 상태 4값별 건수(합계 100) |
        | ORC-I | 설치 가능 20건 목록 |
        | ORC-C | 2~3개 교집합 조합 5개의 기대 건수. 결과가 0건인 조합 1개를 반드시 포함합니다 |

        ---

        ## 4. 테스트 케이스 매트릭스

        ### 4.1 검색: 정상 흐름

        | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
        |---|---|---|---|---|---|---|
        | SR-01 | 정상 | P-KO | 검색창을 비워 둔 채 목록을 확인합니다 | 100건 전부 표시, "100개 중 100개 표시" | P0 | U |
        | SR-02 | 정상 | P-KO, ORC-A | A 이름의 중간 부분 3~4글자를 입력합니다 | A가 결과에 포함되고 건수가 오라클과 같음 | P0 | U |
        | SR-03 | 정상 | P-EN, ORC-A | SR-02의 검색어를 전부 대문자로 입력합니다 | SR-02와 결과가 같음(대소문자 무시) | P0 | U |
        | SR-04 | 정상 | P-KO | 앞뒤에 공백을 붙여 `"  review  "`를 입력합니다 | `"review"`와 결과가 같음 | P1 | U |
        | SR-05 | 정상 | P-KO | 공백만 입력합니다(`"   "`) | 100건 전부 표시, EmptyState 없음 | P1 | U |
        | SR-06 | 필드별 | ORC-F | 7개 필드의 전용 단어로 각각 검색합니다 | 각 단어마다 해당 에이전트가 포함됨 | P0 | U (테이블 기반) |
        | SR-07 | 필드 경계 | ORC-A | "A 이름의 마지막 단어 + 공백 + summary 첫 단어"로 검색합니다 | 공백 결합이라 **현재는 매칭됨**. 의도한 동작인지 **[결정 필요]**. 현재 동작을 테스트로 고정합니다 | P2 | U |
        | SR-08 | 공백 | P-EN | `"code  review"`처럼 중간에 공백 2칸을 넣어 검색합니다 | 현재는 0건일 수 있음. 내부 공백을 정규화할지 **[결정 필요]** | P2 | U |
        | SR-09 | 특수문자 | P-EN | `c++`, `.*`, `(`, `\`, `%`로 각각 검색합니다 | 오류 없이 리터럴 부분 일치(`includes` 방식이라 정규식으로 해석되지 않음) | P1 | U |
        | SR-10 | 입력 | P-KO | 빠르게 입력한 뒤 전부 지웁니다 | 최종 입력값 기준으로 결과가 보이고 이전 결과가 남지 않음. 마지막에 100건 복원 | P1 | M |
        | SR-11 | 경계 | P-KO | 500자 문자열을 붙여 넣습니다 | 멈춤 없이 0건과 EmptyState 표시 | P2 | U+M |

        ### 4.2 한국어 문자열

        | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
        |---|---|---|---|---|---|---|
        | KO-01 | IME | P-KO, 데스크톱과 모바일 각각 | "코드"를 한 글자씩 입력하며 조합 중간 상태(`콛` 등)를 관찰합니다 | 조합 중에 EmptyState가 깜빡일 수 있는지 기록합니다. 조합이 끝나면 정상 결과. 글자 중복·누락 없음 | P0 | M |
        | KO-02 | 부분 일치 | ORC-F(realUseCases) | 한국어 사용 사례 속 단어의 일부 음절("리뷰")로 검색합니다 | 해당 에이전트 포함 | P0 | U |
        | KO-03 | 로케일 독립 | ORC-F | KO-02와 같은 검색어를 `/en/agents`에서 입력합니다 | `/ko`와 결과 건수가 같음 | P1 | U |
        | KO-04 | 번역 라벨 | P-KO | ko 필터 칩에 보이는 **한국어 카테고리/역할 라벨**로 검색합니다 | 가정 1이 맞다면 **0건이 나올 수 있음**. 사용자는 매칭을 기대합니다. **[결정 필요]** 번역 라벨을 haystack에 넣을지 정해야 합니다 | P0 | U |
        | KO-05 | 자모 | P-KO | `ㅋ`, `ㄹㅂ`처럼 자모만 입력합니다 | 0건(초성 검색 미지원). 의도한 동작인지 확인 | P2 | U |
        | KO-06 | 정규화 | P-KO | NFD로 분해된 "리뷰"를 붙여 넣습니다(macOS 파일명에서 복사하는 등) | `includes`만 쓰면 매칭되지 않을 수 있음. `normalize('NFC')`를 적용할지 **[결정 필요]** | P2 | U |
