prompt: You are Test Case Generator. Convert the user's context into a practical test case matrix. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: |-
  /agents 페이지의 검색·필터 기능을 이번에 한국어화(PR #19)하면서 회귀 테스트 케이스를 다시 정리하려고 합니다. QA 1명이 수동으로 돌리고, 일부는 node:test 단위 테스트로 옮길 예정이에요.

  프로젝트: Agent Archive (Next.js 16 정적 export, GitHub Pages). /en/agents, /ko/agents 두 경로. 에이전트 100개, 그중 installTargets가 있는(설치 가능) 에이전트 20개.

  현재 동작(코드 기준):
  - 검색어: name, summary, description, tags, categories, roles, tools, realUseCases(한국어 사용 사례 텍스트 포함)를 공백으로 이어 붙여 소문자화한 문자열에 `includes`로 부분 일치. 앞뒤 공백은 trim. 빈 문자열이면 전체.
  - 필터 7종(모두 단일 선택, AND 조합): 역할(role), 카테고리(category), 난이도(beginner/intermediate/advanced), 자동화 수준(1~5), 도구(tool, 에이전트 데이터에서 중복 제거해 정렬), 검증 상태(unverified/community/tested/expert), "설치 가능만 보기" 체크박스.
  - 같은 필터 칩을 다시 누르면 해당 필터가 해제됨(토글). 다른 값을 누르면 교체.
  - "모두 지우기"(Clear all): 검색어와 필터 모두 초기화. "필터만 지우기"(Clear filters only): 필터만 초기화, 검색어 유지.
  - 결과 카운트: "100개 중 N개 표시"(ko) / "Showing N of 100 agents"(en). 활성 필터는 칩으로 표시(예: "난이도: 중급").
  - URL: `?query=`만 읽음(상단 검색창에서 넘어올 때). 다른 필터는 URL에 저장 안 됨 → 새로고침하면 초기화. 상단 검색으로 query가 바뀌면 다른 필터는 유지.
  - 결과 0개면 EmptyState 컴포넌트 표시.
  - 정적 페이지이므로 JS 로드 전에는 필터 없는 전체 목록이 렌더됨.

  테스트 대상 사용자: 한국어/영어 UI 사용자, 모바일(375px)과 데스크톱.
  제약: 테스트 서버 없음(로컬 `npm run dev` 또는 배포된 GitHub Pages). 자동화는 node:test + tsx로 src/lib/search.ts 함수 단위만 가능, E2E 도구는 아직 없음.

  원하는 결과: ID/분류/전제조건/절차/기대결과/우선순위 컬럼이 있는 테스트 케이스 매트릭스(정상 흐름, 빈 결과, 필터 조합, 새로고침/URL 유지, 한국어 문자열, 회귀 위험), 단위 테스트로 옮길 후보 표시, 가정과 리스크.
exampleOutput: |-
  # /agents 검색·필터 회귀 테스트 매트릭스 (PR #19 한국어화 기준)

  말씀해 주신 동작 명세만으로 매트릭스를 만들 수 있어서 바로 작성했습니다. 명세에서 비어 있는 부분은 아래 "가정"에 적었습니다. 판단이 필요한 항목은 "기대결과"에 **[결정 필요]**로 표시했습니다. 맨 끝의 확인 질문 4개에 답해 주시면 해당 행을 확정하겠습니다.

  ---

  ## 1. 범위와 표기

  - **대상 경로**: `/en/agents`, `/ko/agents` (로컬 `npm run dev`와 GitHub Pages 배포본)
  - **뷰포트**: 모바일 375px, 데스크톱 1440px
  - **우선순위**
    - P0: 릴리스를 막는 항목. 매 회귀 때 실행합니다.
    - P1: 주요 흐름. 매 회귀 때 실행합니다.
    - P2: 엣지 케이스와 사양 확인. 분기 1회 또는 관련 코드가 바뀔 때 실행합니다.
  - **자동화 후보 열**
    - **U**: `src/lib/search.ts` 함수 단위로 node:test에 옮길 수 있습니다.
    - **M**: 수동으로만 확인할 수 있습니다(UI, URL, 렌더링).
    - **U+M**: 로직은 단위 테스트로, 표시는 수동으로 확인합니다.
  - **공통 전제조건 약칭**
    - `P-KO` / `P-EN`: 해당 경로를 로드해 JS 하이드레이션이 끝난 상태입니다. 검색어와 필터가 비어 있고 "100개 중 100개 표시"가 보입니다.
    - `ORC`: 기대 건수를 적은 오라클 시트입니다(3장 참고).

  ---

  ## 2. 가정

  1. 검색은 로케일과 무관합니다. `/en`과 `/ko`에서 같은 haystack(에이전트 원본 필드)을 씁니다. 따라서 **ko UI에 보이는 번역 라벨**(예: 카테고리 한국어명)은 haystack에 들어 있지 않습니다. 한국어로 매칭되는 것은 realUseCases의 한국어 텍스트뿐입니다.
  2. 필터 비교는 원시 값(`intermediate`, `tested`, 슬러그 등)으로 합니다. 번역은 칩 라벨에만 적용됩니다.
  3. 역할·카테고리·도구처럼 배열인 필드는 "선택한 값이 배열에 포함되면 일치"로 처리합니다.
  4. "설치 가능"은 `installTargets`가 1개 이상인 경우입니다. `installTargets: []`는 설치 불가로 봅니다.
  5. 페이지 안 검색창에 입력한 값은 URL에 쓰지 않습니다. 따라서 새로고침하면 URL의 `?query=` 값으로 돌아갑니다.
  6. 검색은 입력할 때마다 반영됩니다(Enter가 필요 없음). 디바운스가 있는지는 모릅니다.
  7. 총 개수 "100"은 하드코딩이 아니라 전체 에이전트 수에서 계산됩니다.

  ---

  ## 3. 테스트 데이터 준비 (오라클 시트)

  기대 건수 N을 화면이 아닌 **원본 데이터에서 따로 집계해 둬야** 회귀를 잡을 수 있습니다. 한 번 만들어 두고 에이전트 데이터가 바뀔 때만 갱신합니다.

  | 오라클 키 | 내용 |
  |---|---|
  | ORC-A | 기준 에이전트 A: 이름으로 검색했을 때 **정확히 1건**만 나오는 에이전트 |
  | ORC-F | tags, categories, roles, tools, summary, description, realUseCases(ko) 각각에**만** 들어 있는 단어 1개씩과 해당 에이전트 |
  | ORC-D | 난이도 3값별 건수(합계 100) |
  | ORC-L | 자동화 수준 1~5별 건수(합계 100) |
  | ORC-V | 검증 상태 4값별 건수(합계 100) |
  | ORC-I | 설치 가능 20건 목록 |
  | ORC-C | 2~3개 교집합 조합 5개의 기대 건수. 결과가 0건인 조합 1개를 반드시 포함합니다 |

  ---

  ## 4. 테스트 케이스 매트릭스

  ### 4.1 검색: 정상 흐름

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | SR-01 | 정상 | P-KO | 검색창을 비워 둔 채 목록을 확인합니다 | 100건 전부 표시, "100개 중 100개 표시" | P0 | U |
  | SR-02 | 정상 | P-KO, ORC-A | A 이름의 중간 부분 3~4글자를 입력합니다 | A가 결과에 포함되고 건수가 오라클과 같음 | P0 | U |
  | SR-03 | 정상 | P-EN, ORC-A | SR-02의 검색어를 전부 대문자로 입력합니다 | SR-02와 결과가 같음(대소문자 무시) | P0 | U |
  | SR-04 | 정상 | P-KO | 앞뒤에 공백을 붙여 `"  review  "`를 입력합니다 | `"review"`와 결과가 같음 | P1 | U |
  | SR-05 | 정상 | P-KO | 공백만 입력합니다(`"   "`) | 100건 전부 표시, EmptyState 없음 | P1 | U |
  | SR-06 | 필드별 | ORC-F | 7개 필드의 전용 단어로 각각 검색합니다 | 각 단어마다 해당 에이전트가 포함됨 | P0 | U (테이블 기반) |
  | SR-07 | 필드 경계 | ORC-A | "A 이름의 마지막 단어 + 공백 + summary 첫 단어"로 검색합니다 | 공백 결합이라 **현재는 매칭됨**. 의도한 동작인지 **[결정 필요]**. 현재 동작을 테스트로 고정합니다 | P2 | U |
  | SR-08 | 공백 | P-EN | `"code  review"`처럼 중간에 공백 2칸을 넣어 검색합니다 | 현재는 0건일 수 있음. 내부 공백을 정규화할지 **[결정 필요]** | P2 | U |
  | SR-09 | 특수문자 | P-EN | `c++`, `.*`, `(`, `\`, `%`로 각각 검색합니다 | 오류 없이 리터럴 부분 일치(`includes` 방식이라 정규식으로 해석되지 않음) | P1 | U |
  | SR-10 | 입력 | P-KO | 빠르게 입력한 뒤 전부 지웁니다 | 최종 입력값 기준으로 결과가 보이고 이전 결과가 남지 않음. 마지막에 100건 복원 | P1 | M |
  | SR-11 | 경계 | P-KO | 500자 문자열을 붙여 넣습니다 | 멈춤 없이 0건과 EmptyState 표시 | P2 | U+M |

  ### 4.2 한국어 문자열

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | KO-01 | IME | P-KO, 데스크톱과 모바일 각각 | "코드"를 한 글자씩 입력하며 조합 중간 상태(`콛` 등)를 관찰합니다 | 조합 중에 EmptyState가 깜빡일 수 있는지 기록합니다. 조합이 끝나면 정상 결과. 글자 중복·누락 없음 | P0 | M |
  | KO-02 | 부분 일치 | ORC-F(realUseCases) | 한국어 사용 사례 속 단어의 일부 음절("리뷰")로 검색합니다 | 해당 에이전트 포함 | P0 | U |
  | KO-03 | 로케일 독립 | ORC-F | KO-02와 같은 검색어를 `/en/agents`에서 입력합니다 | `/ko`와 결과 건수가 같음 | P1 | U |
  | KO-04 | 번역 라벨 | P-KO | ko 필터 칩에 보이는 **한국어 카테고리/역할 라벨**로 검색합니다 | 가정 1이 맞다면 **0건이 나올 수 있음**. 사용자는 매칭을 기대합니다. **[결정 필요]** 번역 라벨을 haystack에 넣을지 정해야 합니다 | P0 | U |
  | KO-05 | 자모 | P-KO | `ㅋ`, `ㄹㅂ`처럼 자모만 입력합니다 | 0건(초성 검색 미지원). 의도한 동작인지 확인 | P2 | U |
  | KO-06 | 정규화 | P-KO | NFD로 분해된 "리뷰"를 붙여 넣습니다(macOS 파일명에서 복사하는 등) | `includes`만 쓰면 매칭되지 않을 수 있음. `normalize('NFC')`를 적용할지 **[결정 필요]** | P2 | U |
  | KO-07 | 혼합 | P-KO | `PR 리뷰`처럼 한영을 섞어 검색합니다 | haystack에 연속 문자열로 있을 때만 매칭 | P2 | U |
  | KO-08 | 카운트 문구 | P-KO / P-EN | 결과가 0건, 1건, 100건인 상태를 만듭니다 | ko: "100개 중 N개 표시", en: "Showing N of 100 agents". 숫자가 정확함. en 1건일 때 "agents" 복수형을 허용할지 확인 | P0 | M |
  | KO-09 | 칩 번역 | P-KO | 7개 필터의 **모든 값**을 하나씩 선택해 칩 라벨을 봅니다 | "난이도: 중급"처럼 번역된 라벨만 보임. `intermediate`, `filters.difficulty` 같은 원시 값이나 키가 노출되지 않음 | P0 | M |
  | KO-10 | 칩 번역 | P-EN | KO-09를 영어로 반복합니다 | 한국어 문자열이 섞이지 않음 | P0 | M |
  | KO-11 | EmptyState | P-KO / P-EN | 결과를 0건으로 만듭니다 | EmptyState 제목, 설명, 버튼이 각 로케일로 번역됨 | P1 | M |
  | KO-12 | 정렬 | - | 도구 필터 목록 순서를 ko와 en에서 비교합니다 | 두 로케일에서 순서가 같음. 대소문자가 섞인 도구명의 정렬 규칙이 일관됨 | P2 | U |

  ### 4.3 개별 필터

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | FL-01 | 정상 | P-KO, ORC | 7개 필터마다 대표 값을 1개씩 선택합니다(한 번에 하나) | 건수가 오라클과 같고 칩 1개가 표시됨 | P0 | U+M |
  | FL-02 | 불변식 | ORC-D | 난이도 3값을 차례로 선택합니다 | 각 건수가 오라클과 같고 합계 100 | P1 | U |
  | FL-03 | 불변식 | ORC-L | 자동화 수준 1~5를 차례로 선택합니다 | 각 건수가 오라클과 같고 합계 100 | P1 | U |
  | FL-04 | 불변식 | ORC-V | 검증 상태 4값을 차례로 선택합니다 | 각 건수가 오라클과 같고 합계 100 | P1 | U |
  | FL-05 | 설치 가능 | ORC-I | "설치 가능만 보기"를 체크합니다 | 20건, 오라클 목록과 일치 | P0 | U+M |
  | FL-06 | 설치 가능 | 픽스처 | `installTargets: []`인 에이전트를 넣은 픽스처로 필터를 적용합니다 | 결과에서 제외됨 | P1 | U |
  | FL-07 | 토글 | FL-01 상태 | 선택한 칩을 다시 누릅니다 | 필터가 해제되고 칩이 사라지며 100건 복원 | P0 | M |
  | FL-08 | 교체 | P-KO | 난이도 "초급"을 누른 뒤 "중급"을 누릅니다 | "중급" 필터만 적용됨(OR 아님). 칩은 "난이도: 중급" 1개 | P0 | U+M |
  | FL-09 | 체크박스 | FL-05 상태 | 체크를 해제합니다 | 100건 복원, 칩 제거 | P1 | M |
  | FL-10 | 도구 목록 | - | 도구 필터 옵션을 확인합니다 | 중복 없음, 정렬됨, 빈 문자열 없음, 모든 에이전트의 도구가 들어 있음 | P1 | U |
  | FL-11 | 배열 필드 | 역할이 2개 이상인 에이전트 B | B의 두 번째 역할로 필터링합니다 | B가 포함됨 | P1 | U |
  | FL-12 | 칩 해제 | 활성 칩 1개 이상 | 활성 칩 영역의 개별 해제 버튼을 누릅니다(있는 경우) | 해당 필터만 해제되고 나머지는 유지 | P1 | M |

  ### 4.4 필터 조합

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | CB-01 | AND | ORC-C | 검색어 1개와 필터 1개를 적용합니다 | 두 조건의 교집합, 건수가 오라클과 같음 | P0 | U |
  | CB-02 | AND | ORC-C | 난이도=beginner와 설치 가능을 함께 적용합니다 | 교집합 건수가 오라클과 같음 | P0 | U |
  | CB-03 | 전체 조합 | ORC-C | 7개 필터를 모두 적용하고 검색어도 입력합니다 | 교집합이 정확함(0건이면 EmptyState) | P1 | U |
  | CB-04 | 순서 무관 | ORC-C | 필터를 A→B 순서와 B→A 순서로 각각 적용합니다 | 두 결과가 같음 | P2 | U |
  | CB-05 | Clear all | 검색어와 필터 2개 이상 적용 | "모두 지우기"를 누릅니다 | 검색창이 비고 모든 필터와 칩이 해제되며 100건 표시 | P0 | M |
  | CB-06 | Clear filters only | 검색어와 필터 2개 이상 적용 | "필터만 지우기"를 누릅니다 | 검색어는 유지되고 필터만 해제됨. 결과가 검색어만 적용한 결과와 같음 | P0 | M |
  | CB-07 | Clear filters only | 필터만 적용(검색어 없음) | "필터만 지우기"를 누릅니다 | 100건 | P2 | M |
  | CB-08 | 버튼 상태 | P-KO | 아무것도 적용하지 않은 상태에서 두 지우기 버튼을 봅니다 | 비활성 또는 숨김 등 일관된 상태. 눌러도 오류 없음 | P2 | M |
  | CB-09 | 로케일 일치 | ORC-C | 같은 조합을 ko와 en에 각각 적용합니다 | 두 로케일의 건수가 같음(번역이 필터 로직에 섞이지 않음) | P0 | U+M |

  ### 4.5 빈 결과

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | EM-01 | 검색 0건 | P-KO | `zzqqxx`로 검색합니다 | EmptyState 표시, "100개 중 0개 표시", 카드 없음 | P0 | U+M |
  | EM-02 | 복구 | EM-01 상태 | 검색어를 지웁니다 | 100건 복원, EmptyState 사라짐 | P0 | M |
  | EM-03 | 필터 0건 | ORC-C(0건 조합) | 교집합이 0건인 조합을 적용합니다 | EmptyState 표시. 안에 초기화 액션이 있으면 눌렀을 때 복원됨 | P1 | M |
  | EM-04 | 전환 | - | 0건과 결과 있음 상태를 5번 오갑니다 | 레이아웃이 튀거나 스크롤 위치가 비정상이 되지 않음 | P2 | M |

  ### 4.6 새로고침과 URL 유지

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | URL-01 | 진입 | - | `/ko/agents?query=review`로 바로 들어갑니다 | 검색창에 `review`가 채워지고 결과가 필터링됨 | P0 | M |
  | URL-02 | 인코딩 | - | `?query=%EC%BD%94%EB%93%9C`로 들어갑니다 | 검색창에 "코드"가 보이고 결과가 필터링됨 | P0 | M |
  | URL-03 | 인코딩 | - | `?query=code+review`와 `?query=code%20review`로 각각 들어갑니다 | 둘 다 공백으로 해석되어 결과가 같음 | P1 | M |
  | URL-04 | 빈 값 | - | `?query=`, 파라미터 없음, `?query=%20%20`으로 각각 들어갑니다 | 모두 100건 | P1 | U+M |
  | URL-05 | 새로고침 | URL-01 상태에서 필터 2개 적용 | 새로고침합니다 | 필터는 초기화되고(현재 사양) 검색어는 URL 값으로 복원됨 | P0 | M |
  | URL-06 | 새로고침 | P-KO | 페이지 안 검색창에 입력한 뒤 새로고침합니다 | 가정 5에 따르면 검색어가 사라짐. 사양 확인 | P1 | M |
  | URL-07 | 상단 검색 | 필터 2개 적용 | 상단 검색창으로 새 query를 보냅니다 | 필터는 유지되고 검색어만 바뀜. 결과는 교집합 | P0 | M |
  | URL-08 | Clear all | URL-01 상태 | "모두 지우기"를 누른 뒤 새로고침합니다 | URL의 `?query=`가 남아 있으면 **검색어가 다시 살아남**. **[결정 필요]** Clear all 때 URL도 정리할지 정해야 함 | P1 | M |
  | URL-09 | 히스토리 | - | 상단 검색을 두 번 한 뒤 뒤로 가기, 앞으로 가기를 합니다 | 검색창과 결과가 해당 URL의 query와 맞음 | P1 | M |
  | URL-10 | JS 로드 전 | DevTools에서 JS를 끄거나 Slow 3G 설정 | `/ko/agents?query=review`로 들어갑니다 | JS 로드 전에는 전체 100건이 렌더되고, 하이드레이션 뒤 필터링됨. 콘솔에 하이드레이션 오류 없음 | P1 | M |
  | URL-11 | 배포본 | GitHub Pages | URL-01, URL-02, URL-05를 배포 경로(basePath, 끝 슬래시 `/ko/agents/?query=` 포함)에서 반복합니다 | 로컬과 동작이 같고 404 없음 | P0 | M |
  | URL-12 | 언어 전환 | 검색어와 필터 적용 | 언어 전환으로 `/en` ↔ `/ko`를 오갑니다 | 필터는 초기화됨. query를 유지할지는 사양 확인 | P1 | M |
  | URL-13 | 무관 파라미터 | - | `?difficulty=advanced&foo=1`로 들어갑니다 | 무시되고 100건, 오류 없음 | P2 | M |

  ### 4.7 반응형과 접근성

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | UI-01 | 모바일 | 375px, P-KO | 필터 패널을 열고 닫은 뒤 칩 5개를 적용합니다 | 가로 스크롤 없음. 칩이 줄바꿈되고 긴 한국어 라벨이 잘리지 않음 | P1 | M |
  | UI-02 | 모바일 | 375px | 카운트와 두 지우기 버튼 위치를 확인합니다 | 스크롤 없이 또는 합리적인 위치에서 보이고 터치 영역이 충분함 | P1 | M |
  | UI-03 | 데스크톱 | 1440px, P-EN / P-KO | SR-02, FL-01, CB-05를 스모크로 실행합니다 | 정상 | P1 | M |
  | UI-04 | 키보드 | 데스크톱 | Tab으로 칩에 이동해 Enter/Space로 토글합니다 | 토글이 동작하고 포커스가 보이며 `aria-pressed`가 적절함 | P2 | M |
