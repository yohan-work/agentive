  ### 4.8 회귀 위험 (PR #19 전용)

  | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
  |---|---|---|---|---|---|---|
  | RG-01 | 문자열 누수 | P-EN | 검색·필터 영역의 모든 문자열을 훑어봅니다 | 한국어 문자열이 섞이지 않음 | P0 | M |
  | RG-02 | 키 누락 | - | 사전의 en 키 집합과 ko 키 집합을 비교합니다 | 두 집합이 같음. 키 이름이 화면에 노출되지 않음 | P0 | U (search.ts 밖. 가능하면 추가) |
  | RG-03 | 로직 분리 | ORC | 같은 필터를 ko와 en에서 선택합니다(CB-09 확장) | 모든 필터 값에서 두 로케일의 건수가 같음 | P0 | U |
  | RG-04 | 카드 배지 | P-KO | 결과 카드의 배지(난이도, 검증 상태 등)를 확인합니다 | 번역된 라벨이 필터 칩 라벨과 같은 용어를 씀 | P1 | M |
  | RG-05 | 카운트 | - | 에이전트를 1개 추가한 픽스처나 빌드에서 확인합니다 | 총 개수가 101로 바뀜(하드코딩이 아님) | P2 | U |
  | RG-06 | 성능 | 저사양 모바일 | 빠르게 입력합니다 | 체감 지연 없음(100건 기준) | P2 | M |

  ---

  ## 5. 단위 테스트로 옮길 후보

  자동화 열이 **U**인 행 가운데 먼저 옮길 것을 추리면 다음과 같습니다.

  | 묶음 | 대상 ID | 비고 |
  |---|---|---|
  | 검색 정규화 | SR-01~09, SR-11, KO-02~07 | 작은 픽스처(5~8건)로 테이블 기반 테스트 |
  | 필터 조건 | FL-01~06, FL-08, FL-10~11 | 필터별 조건을 개별로 검증 |
  | 조합 | CB-01~04, CB-09, RG-03 | 교집합과 순서 무관성 |
  | 실데이터 불변식 | FL-02~05, RG-05 | 실제 100건 데이터로 "합계=100", "설치 가능=20" 확인. 데이터가 바뀌면 깨지므로 숫자 대신 `agents.length`나 오라클 파일을 기준으로 삼는 것을 권장 |
  | (search.ts 밖) | RG-02 | 사전 키 동일성. 같은 node:test 러너로 import할 수 있다면 비용 대비 효과가 가장 큼 |

  예시 골격입니다. 함수 이름과 시그니처는 실제 `search.ts`에 맞게 바꿔 주세요.

  ```ts
  // search.test.ts (node --import tsx --test)
  import { test } from "node:test";
  import assert from "node:assert/strict";
  import { filterAgents } from "../src/lib/search"; // 가정한 이름

  const fx = [
    { slug: "a", name: "Code Reviewer", summary: "PR review", installTargets: ["claude"], difficulty: "beginner", /* ... */ realUseCases: ["코드 리뷰 자동화"] },
    { slug: "b", name: "Doc Writer", summary: "docs", installTargets: [], difficulty: "advanced", /* ... */ realUseCases: [] },
  ];

  const cases: [string, string, string[]][] = [
    ["빈 검색은 전체", "", ["a", "b"]],
    ["공백만은 전체", "   ", ["a", "b"]],
    ["대소문자 무시", "CODE", ["a"]],
    ["trim", "  review  ", ["a"]],
    ["한국어 realUseCases", "리뷰", ["a"]],
    ["특수문자 리터럴", ".*", []],
  ];

  for (const [name, query, expected] of cases) {
    test(name, () => {
      const got = filterAgents(fx, { query, filters: {} }).map((a) => a.slug);
      assert.deepEqual(got, expected);
    });
  }

  test("installTargets: [] 는 설치 가능에서 제외", () => {
    const got = filterAgents(fx, { query: "", filters: { installable: true } }).map((a) => a.slug);
    assert.deepEqual(got, ["a"]);
  });
  ```

  ---

  ## 6. 리스크

  | # | 리스크 | 영향 | 관련 ID |
  |---|---|---|---|
  | R1 | ko 사용자가 화면에 보이는 한국어 카테고리/역할 라벨로 검색하면 0건이 나올 수 있음 | 높음. 한국어화의 체감 품질이 떨어짐 | KO-04 |
  | R2 | IME 조합 중 결과가 0건으로 바뀌며 EmptyState가 깜빡임 | 중간. 모바일에서 특히 눈에 띔 | KO-01 |
  | R3 | Clear all 뒤에도 URL `?query=`가 남아 새로고침하면 검색어가 되살아남 | 중간. 사용자가 혼란스러워함 | URL-08 |
  | R4 | 필터가 URL에 저장되지 않아 공유나 새로고침 때 사라짐 | 중간. 현재 사양이지만 사용자 기대와 어긋남 | URL-05 |
  | R5 | 필드를 공백으로 이어 붙여 경계를 넘는 오탐이 생기고, 내부 공백·NFD는 정규화하지 않음 | 낮음 | SR-07, SR-08, KO-06 |
  | R6 | 사전 키 누락이나 원시 값 노출이 수동 QA에서 빠지기 쉬움 | 중간 | KO-09, RG-02 |
  | R7 | GitHub Pages의 basePath나 끝 슬래시 때문에 로컬에서는 통과하고 배포본에서만 실패 | 높음 | URL-11 |
  | R8 | 실데이터 불변식 테스트가 콘텐츠 추가 때마다 깨짐 | 낮음. 유지보수 비용 | FL-02~05 |
  | R9 | E2E 도구가 없어 M 항목(약 60%)이 전부 사람에게 의존함 | 중간. 회귀 1회에 2~3시간 예상 | 전체 |

  ---

  ## 7. 권장사항

  1. **P0만 추린 스모크 세트**(약 25건)를 PR마다, 전체 세트는 릴리스 전에 실행하세요.
  2. **[결정 필요]** 항목 5개(SR-07, SR-08, KO-04, KO-06, URL-08)는 먼저 사양으로 확정하세요. 그다음 현재 동작을 단위 테스트로 고정해야 의도치 않은 변경을 잡을 수 있습니다.
  3. KO-04는 ko에서 번역된 taxonomy 라벨을 haystack에 추가하는 것을 권장합니다. 이렇게 바꾸면 KO-03(로케일 독립) 기대값도 함께 바뀝니다.
  4. 검색 전에 `query.normalize("NFC").replace(/\s+/g, " ")`를 적용하면 SR-08과 KO-06을 한 번에 해결할 수 있습니다.
  5. E2E 도구를 도입한다면 URL-01, URL-05, URL-07, CB-05, CB-06부터 옮기는 것이 가장 효과가 큽니다.

  ---

  ## 8. 다음 액션

  | 순서 | 할 일 | 담당(제안) |
  |---|---|---|
  | 1 | 오라클 시트(ORC-*)를 작성합니다 | QA |
  | 2 | [결정 필요] 5건의 사양을 확정합니다 | PM/개발 |
  | 3 | 5장의 U 후보를 node:test로 옮깁니다(검색 정규화 → 필터 → 조합 순) | 개발 |
  | 4 | RG-02 사전 키 동일성 테스트를 추가합니다 | 개발 |
  | 5 | M 항목 체크리스트로 로컬과 배포본에서 1회씩 실행하고 결과를 기록합니다 | QA |
  | 6 | 결과를 바탕으로 P2 항목을 유지할지, 우선순위를 조정할지 검토합니다 | QA/개발 |

  ---

  ## 확인이 필요한 질문

  1. ko 화면에서 검색할 때 **번역된 카테고리/역할/난이도 라벨**도 매칭되어야 하나요? (KO-04, KO-03의 기대결과가 달라집니다)
  2. 페이지 안 검색창에 입력한 값이 URL `?query=`에 반영되나요, 읽기만 하나요? (URL-06, URL-08)
  3. 활성 필터 칩에 개별 해제(X) 기능이 있나요? (FL-12)
  4. `search.ts`에서 내보내는 함수 이름과 시그니처를 알려 주시면 5장의 골격을 실제 코드에 맞춰 드리겠습니다.
