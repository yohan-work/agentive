        | KO-09 | 칩 번역 | P-KO | 7개 필터의 **모든 값**을 하나씩 선택해 칩 라벨을 봅니다 | "난이도: 중급"처럼 번역된 라벨만 보임. `intermediate`, `filters.difficulty` 같은 원시 값이나 키가 노출되지 않음 | P0 | M |
        | KO-10 | 칩 번역 | P-EN | KO-09를 영어로 반복합니다 | 한국어 문자열이 섞이지 않음 | P0 | M |
        | KO-11 | EmptyState | P-KO / P-EN | 결과를 0건으로 만듭니다 | EmptyState 제목, 설명, 버튼이 각 로케일로 번역됨 | P1 | M |
        | KO-12 | 정렬 | - | 도구 필터 목록 순서를 ko와 en에서 비교합니다 | 두 로케일에서 순서가 같음. 대소문자가 섞인 도구명의 정렬 규칙이 일관됨 | P2 | U |

        ### 4.3 개별 필터

        | ID | 분류 | 전제조건 | 절차 | 기대결과 | 우선순위 | 자동화 |
        |---|---|---|---|---|---|---|
        | FL-01 | 정상 | P-KO, ORC | 7개 필터마다 대표 값을 1개씩 선택합니다(한 번에 하나) | 건수가 오라클과 같고 칩 1개가 표시됨 | P0 | U+M |
