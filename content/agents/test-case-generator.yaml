        ## 7. 권장사항

        1. **P0만 추린 스모크 세트**(약 25건)를 PR마다, 전체 세트는 릴리스 전에 실행하세요.
        2. **[결정 필요]** 항목 5개(SR-07, SR-08, KO-04, KO-06, URL-08)는 먼저 사양으로 확정하세요. 그다음 현재 동작을 단위 테스트로 고정해야 의도치 않은 변경을 잡을 수 있습니다.
        3. KO-04는 ko에서 번역된 taxonomy 라벨을 haystack에 추가하는 것을 권장합니다. 이렇게 바꾸면 KO-03(로케일 독립) 기대값도 함께 바뀝니다.
        4. 검색 전에 `query.normalize("NFC").replace(/\s+/g, " ")`를 적용하면 SR-08과 KO-06을 한 번에 해결할 수 있습니다.
        5. E2E 도구를 도입한다면 URL-01, URL-05, URL-07, CB-05, CB-06부터 옮기는 것이 가장 효과가 큽니다.

