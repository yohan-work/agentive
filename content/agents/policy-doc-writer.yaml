# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-005
slug: policy-doc-writer
name: Policy Doc Writer
summary: Drafts clear internal or product policy documents.
description: Use this agent to turn policy decisions into readable guidance for teams or customers.
roles:
  - pm
  - founder
  - cs
categories:
  - documentation
  - operations
tags:
  - policy
  - governance
  - docs
difficulty: intermediate
automationLevel: 3
tools:
  - ChatGPT
  - Google Docs
  - Notion
useCases:
  - Refund policy
  - Internal AI usage policy
  - Support escalation rules
inputs:
  - Policy topic
  - Audience
  - Rules
  - Exceptions
outputs:
  - Policy draft
  - Definitions
  - Examples
  - Review checklist
prompt: You are a policy documentation specialist. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical clear policy document with clear sections, assumptions, risks, and next actions.
exampleInput: An internal rule for using AI tools with customer data.
exampleOutput: Purpose, allowed use, prohibited use, examples, and escalation path.
limitations:
  - Not legal advice.
bestPractices:
  - Have legal or compliance review high-risk policies.
realUseCases:
  - title: Policy Doc Writer 실무 활용
    context: Refund policy
    problem: Drafts clear internal or product policy documents. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 Policy Doc Writer에게 Policy draft 형태로 정리해 달라고 요청합니다.
    exampleInput: An internal rule for using AI tools with customer data. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Purpose, allowed use, prohibited use, examples, and escalation path.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Policy topic
    - Audience
    - Rules
    - Exceptions
  setupContextNotes:
    - Prepare approved rules, audience, definitions, exceptions, escalation path, and required reviewers.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Policy draft
    - Definitions
    - Examples
    - Review checklist
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Draft an internal AI tool usage policy from team-approved rules.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Policy draft for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Create legally binding customer terms without counsel review.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    An internal rule for using AI tools with customer data.

    Goal: produce Policy draft for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Policy Doc Writer.
  weakInputFixes:
    - weakInput: Help me with Policy Doc Writer.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Draft an internal AI tool usage policy from team-approved rules. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Refund policy. Optimize for Policy draft, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Policy draft
    - A clearly labeled Policy draft section
    - A clearly labeled Definitions section
    - A clearly labeled Examples section
    - A clearly labeled Review checklist section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Policy draft
    - Includes Definitions
    - Includes Examples
    - Includes Review checklist
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 3
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Drafting internal policy language from approved rules and examples
    - "Teams with the required inputs ready: Policy topic, Audience, Rules"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The policy needs legal, HR, finance, privacy, or compliance approval
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Can make policy wording sound final when decisions are still provisional
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Labels scope, definitions, allowed use, prohibited use, exceptions, and escalation path
    - Produces Policy draft in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Policy Doc Writer strong-context run
      input: Draft an internal AI tool usage policy from team-approved rules.
      expectedOutputSummary: A usable Policy draft with project-specific assumptions, risks, and next steps.
      sampleOutput: "Policy draft: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Policy Doc Writer boundary run
      input: Create legally binding customer terms without counsel review.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Drafting internal policy language from approved rules and examples
  - question: When should I choose something else?
    guidance: The policy needs legal, HR, finance, privacy, or compliance approval
    alternativeAgentSlug: internal-ai-policy-agent
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
    alternativeAgentSlug: operations-sop-agent
relatedAgents:
  - internal-ai-policy-agent
  - operations-sop-agent
verifiedStatus: tested
updatedAt: 2026-07-01
