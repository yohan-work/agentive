        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Directly challenges the impossible scope: it says that including every exception is not possible and substitutes a 'D. 목록에 없는 상황 규칙' stop-and-escalate rule, which is the right structural answer."
        - "Asks 7 focused questions, each with a reason, and prioritizes #3, #5, and #6 under Next actions. That is useful, but it is at the high end for 'ask only what is required'."
        - Moves the work forward with a v0.1 skeleton covering the trigger check, a 6-step table with a completion check per step, and an exception table E1-E7. It includes an explicit warning (이 상태로 신입에게 전달하지 마세요) and a separate Assumptions section saying the exceptions are generic and not company-specific.
        - Some specifics are not marked as placeholders, such as the '48시간 무응답 시 1회 리마인드' rule and steps like data migration. These could be taken as real policy.
        - The recommendation to have the new hire work solo from tomorrow but with review on the first 3-5 cases is a concrete, sensible alternative to the unrealistic request. Risks and Next actions are specific and properly separated.
