        - 최신 이용약관의 환불 조항 원문 [TBD: 약관 링크 위치]
        - 확정된 고객 안내 문구 (아래 5단계, 법무 검토 전까지는 이 SOP의 임시 문구 사용)
        - [ASSUMPTION] 문의 한 건당 고객 식별 정보(가입 이메일 또는 회원 ID)를 받을 수 있음

        ## 3. 처리 단계

        **1단계. 고객 식별 정보를 확보한다.**
        [TBD: CS 도구]의 문의 건에서 가입 이메일 또는 회원 ID를 확인합니다. 없으면 고객에게 요청합니다.
        - 흔한 실수: 문의에 적힌 이메일이 가입 이메일과 달라 다른 계정을 조회함 → 엉뚱한 결제 내역으로 "14일 지남"을 안내하게 됨.
        - **Check:** 결제 내역 화면에서 조회한 계정의 이름/이메일이 문의자와 일치한다.

        **2단계. 환불 대상 결제를 특정하고 결제일을 기록한다.**
        [TBD: 결제 내역 화면]에서 고객이 환불을 원하는 결제 건을 찾고, 결제일·금액·요금제(월 29,000원 / 연 290,000원)를 문의 건 메모에 적습니다.
        - 흔한 실수: 자동 갱신 고객의 경우 **최초 가입일**을 기준으로 계산해 "14일 지남"으로 판단함. 고객은 **최근 갱신 결제**의 환불을 원하는 경우가 많습니다.
        - [TBD: 자동 갱신 결제도 갱신 결제일 기준으로 14일을 새로 계산하는지 확인 필요]
        - **Check:** 메모에 "결제일 YYYY-MM-DD / 금액 / 월·연 / 최초결제·갱신결제" 네 가지가 적혀 있다.

        **3단계. 경과 일수를 계산한다.**
        오늘 날짜와 2단계의 결제일로 경과 일수를 계산합니다.
        - [TBD: 결제 당일을 1일째로 세는지 0일째로 세는지, 기준 시각(결제 시각 vs 자정)]. 이 기준이 정해지지 않으면 14~15일째 경계 건에서 상담원마다 판단이 갈립니다.
        - 14일 이내로 나오면 이 SOP를 중단하고 [TBD: 14일 이내 환불 절차]로 넘어갑니다.
        - **Check:** 메모에 "경과 N일(기준: ___)"이 적혀 있고, N이 14를 초과한다.

        **4단계. 수강 진도를 확인해 기록한다.**
        [TBD: 수강 진도 화면]에서 진도(%)를 확인해 메모에 적습니다. 14일이 지났으면 진도와 관계없이 약관상 원칙은 환불 불가지만, 예외 검토(6단계) 때 승인자가 판단 자료로 씁니다.
        - **Check:** 메모에 "진도 N%"가 적혀 있다.

        **5단계. 예외 사유가 있는지 먼저 확인한다.**
        고객 문의 내용과 계정 기록을 보고 아래 "4. 예외" 표의 상황에 해당하는지 확인합니다.
        - 해당하면 → 표에 적힌 대로 처리하고, 이 단계 이후의 "원칙 안내"는 보내지 않습니다.
        - 해당하지 않으면 → 6단계로.
        - 흔한 실수: 예외 사유(이중 결제, 서비스 장애 등)를 확인하지 않고 바로 "환불 불가"를 안내함 → 나중에 뒤집히면 고객 불만이 커짐.
        - **Check:** 메모에 "예외 해당: 없음" 또는 "예외 해당: E번호"가 적혀 있다.

        **6단계. 원칙(환불 불가)을 표준 문구로 안내한다.**
        상담원 개인 판단으로 환불을 약속하거나 거절 사유를 새로 만들지 않고, 아래 표준 문구를 사용합니다.

        > 안녕하세요, [서비스명]입니다. 문의하신 결제(YYYY-MM-DD, 금액)는 결제일로부터 14일이 지나, 이용약관의 환불 기준(결제 후 14일 이내 및 수강 진도 10% 미만)에 해당하지 않아 환불이 어렵습니다. 약관 원문은 [TBD: 약관 링크]에서 확인하실 수 있습니다. 다음 결제부터 요금이 청구되지 않도록 구독 해지를 원하시면 [TBD: 해지 방법]으로 도와드리겠습니다.

        - 법률 조항 번호, 법 이름, "법적으로 환불 의무가 없다" 같은 표현은 쓰지 않습니다.
        - 연간 구독 고객이면 질문 3의 답이 확정될 때까지 이 문구를 보내지 말고 승인자에게 먼저 넘깁니다. [ASSUMPTION: 연간 구독의 잔여 기간 처리 방침은 미확정]
        - 흔한 실수: 상담원이 "이번만 해드릴게요"라고 먼저 말함 → 승인 없는 환불 약속이 선례가 되어 대응이 계속 달라짐.
        - **Check:** 발송된 답변이 표준 문구와 일치하고(날짜·금액만 변경), 문의 건 상태가 [TBD: 상태값, 예: "안내 완료"]로 바뀌어 있다.

        **7단계. 고객이 재요청하거나 이의를 제기하면 에스컬레이션한다.**
        고객이 (a) 재차 환불을 요구하거나, (b) 법 조항·소비자원·카드사 이의제기를 언급하면 상담원은 추가 판단 없이 아래처럼 넘깁니다.
        - (a) → 예외 환불 승인자 [TBD]에게 메모(결제일, 경과일, 진도, 고객 주장 요약)와 함께 전달
        - (b) → 법률·정책 판단 담당 [TBD]에게 전달
        - 고객에게는 이렇게만 안내합니다: "말씀하신 내용은 담당 부서에서 검토한 뒤 [TBD: 회신 기한] 안에 다시 안내드리겠습니다."
        - **Check:** 문의 건에 담당자가 지정되어 있고, 고객에게 회신 기한이 포함된 답변이 발송되어 있다.

        **8단계. 승인 결과를 실행하고 기록한다.**
        승인자가 환불(전액/부분)을 승인하면 [TBD: 환불 실행 위치]에서 환불을 처리하고, 거절이면 승인자가 확인한 문구로 안내합니다.
        - **Check:** 환불 승인 건은 결제 내역 화면에서 해당 결제 상태가 [TBD: 환불 완료 상태값]으로 보인다. 모든 건은 문의 메모에 "결과 / 승인자 / 처리일"이 적혀 있다.

        ## 4. 예외

        | 번호 | 상황 | 할 일 | 결정권자 |
        |---|---|---|---|
        | E1 | 이중 결제, 해지 후 결제 등 결제 오류로 보이는 경우 | 결제 내역 캡처를 메모에 첨부하고 원칙 안내 없이 넘김 | [TBD] |
        | E2 | 고객이 서비스 장애·강의 미제공 등 회사 측 문제를 사유로 드는 경우 | 장애 기록 여부를 [TBD: 확인 위치]에서 확인 후 넘김 | [TBD] |
        | E3 | 고객이 법 조항, 소비자원, 분쟁조정, 카드사 이의제기를 언급 | 상담원은 법적 판단을 말하지 않고 7단계 (b)로 넘김 | [TBD: 법무 담당] |
        | E4 | 본인이 결제하지 않았다고 주장(명의 도용, 가족 결제 등) | 계정 조치 여부를 포함해 넘김 | [TBD] |
        | E5 | 연간 구독 고객의 14일 이후 해지·환불 요청 | 방침 확정 전까지 모두 승인자에게 넘김 | [TBD] |
        | E6 | 고객이 장기 질병·사망 등 특수 사정을 제시 | 증빙 요청 여부를 포함해 넘김 | [TBD] |

        위 목록은 알려진 경우만 담았습니다. 여기 없는 상황은 상담원이 판단하지 말고 [TBD: CS팀장 등 기본 에스컬레이션 담당]에게 넘깁니다.

        ## 5. 완료 조건

        - 고객에게 표준 문구 또는 승인자가 확인한 문구로 최종 답변이 발송되었다.
        - 문의 메모에 결제일, 경과 일수(기준 포함), 진도, 예외 여부, 결과, 승인자가 모두 적혀 있다.
        - 환불이 승인된 경우 결제 내역에 환불 완료 상태가 보인다.
        - **되돌리기:** 환불을 잘못 실행한 경우 [TBD: PG사 환불 취소 가능 여부와 담당]. 환불 불가 안내를 잘못 보낸 경우(예: 실제로는 14일 이내였음) 즉시 정정 답변을 보내고 [TBD: 14일 이내 환불 절차]로 처리합니다.

        ---

        ### 선택적 개선

        - 월 40건의 결과(승인/거절/사유)를 표로 모아 분기마다 승인자가 기준을 다듬도록 한다.
        - 결제일·경과일을 CS 도구에서 자동 표시하도록 연동을 검토한다.
        - 구독 해지 방법을 결제 완료 안내에 함께 넣어 14일 이후 문의 자체를 줄인다.
        - 법무 검토를 거친 고객 안내 문구가 나오면 6단계와 7단계 문구를 교체한다.
      reviewNotes:
        - "Real run on 2026-09-30: claude-opus-5-5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate model reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Blind pairwise comparison against the previous prompt (agent-4863c983) (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 4 of 6 case runs (3 cases × 2 samples), lost 2, 0 tied, 0 order-inconsistent."
        - "Blind pairwise comparison against the same model with no system prompt (judged in both orders by claude-sonnet-5-5; a case run counts only when both orders agree): won 3 of 6 case runs (3 cases × 2 samples), lost 1, 0 tied, 2 order-inconsistent."
        - "It declines the legal-clause part clearly and explains why in terms of the task: whether the rule applies and is valid is a legal judgment, and clause numbers would have agents present unverified law as fact. It still moves the work forward with an escalation path (Step 7b, E3) and a [TBD: 법무 검토 문구] slot for approved wording."
        - "Its three questions target the real source of inconsistent agent handling: who can approve exception refunds and up to what amount, which tools agents use, and how annual plans are handled after 14 days. It then treats annual plans as an exception to escalate until that policy is set."
        - "Its steps are grounded and checkable: identify the account, record payment date, amount, and plan, count elapsed days with the day-count rule marked TBD, record progress %, check the exceptions table before sending the standard reply, and escalate repeat requests or legal mentions. Each step has a Check line tied to a note in the case record."
        - The standard reply cites only the company's own terms, with no law names or clause numbers, and it bans phrases like '법적으로 환불 의무가 없다'. But it tells customers a refund is '어렵습니다' before any legal review of whether the 14-day rule is valid, a risk the agent raised itself.
        - Several 'common mistakes' (looking up the wrong account, using the first sign-up date instead of the latest renewal, promising a one-time refund) and exceptions such as serious illness or death are the agent's own additions presented as known issues. They are plausible, but the user did not supply them.
