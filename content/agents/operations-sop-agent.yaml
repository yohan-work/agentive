# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-086
slug: operations-sop-agent
name: Operations SOP Agent
summary: Writes standard operating procedures for recurring work.
description: Use this agent when you need writes standard operating procedures for recurring work.
roles:
  - founder
  - cs
categories:
  - operations
  - documentation
tags:
  - sop
  - operations
  - process
difficulty: beginner
automationLevel: 4
tools:
  - ChatGPT
  - Notion
useCases:
  - 반복되는 고객 온보딩 작업을 팀원이 대신할 수 있게 정리하는 상황
  - Prepare a SOP document before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - SOP document
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are Operations SOP Agent. Convert the user's context into a practical SOP document. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 반복되는 고객 온보딩 작업을 팀원이 대신할 수 있게 정리하는 상황
exampleOutput: A structured SOP document with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Operations SOP Agent 실무 활용
    context: 반복되는 고객 온보딩 작업을 팀원이 대신할 수 있게 정리하는 상황
    problem: 대표 머릿속에만 절차가 있어 위임이 어렵고 품질이 흔들림
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Operations SOP Agent에게 SOP document 형태로 정리해 달라고 요청합니다.
    exampleInput: 반복되는 고객 온보딩 작업을 팀원이 대신할 수 있게 정리하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 SOP document을 만들어줘.
    expectedResult: SOP document 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Bring the trigger, owner, repeated steps, handoff points, exceptions, and quality checks.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - SOP document
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Write an SOP for installing and validating project agent kits.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce SOP document for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Standardize a new process nobody has performed yet.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Process: adding a new project-ready agent.
    Owner: content maintainer.
    Inputs: approved slug, agent metadata, runbook, evaluation, sample runs.
    Quality bar: check:data, lint, build pass before handoff.
    Output: step-by-step SOP with review checkpoints and rollback notes.
  badInputExample: Write an SOP for agent stuff.
  weakInputFixes:
    - weakInput: Help me with Operations SOP Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Write an SOP for installing and validating project agent kits. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 반복되는 고객 온보딩 작업을 팀원이 대신할 수 있게 정리하는 상황. Optimize for SOP document, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended SOP document
    - A clearly labeled SOP document section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes SOP document
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The SOP omits the trigger and owner
    - Review checkpoints are not tied to commands or visible page checks
    - Exceptions for rejected or incomplete agents are missing
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Documenting repeatable workflows so another teammate can execute them consistently
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The process is experimental and changes every time it is performed
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Needs real exceptions and handoff points to avoid overly linear procedures
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Defines trigger, owner, steps, inputs, outputs, exceptions, and quality checks
    - Produces SOP document in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Operations SOP Agent strong-context run
      input: Write an SOP for installing and validating project agent kits.
      expectedOutputSummary: A usable SOP document with project-specific assumptions, risks, and next steps.
      sampleOutput: "SOP document: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Operations SOP Agent boundary run
      input: Standardize a new process nobody has performed yet.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Documenting repeatable workflows so another teammate can execute them consistently
  - question: When should I choose something else?
    guidance: The process is experimental and changes every time it is performed
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
verifiedStatus: tested
createdBy: Agent Archive
updatedAt: 2026-07-01
