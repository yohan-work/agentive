        - **환불 실행:** [TBD: 상담원이 직접 하는지, 재무/운영팀이 하는지].

        ## 2. 시작 전에 필요한 것

        - [TBD: CS 문의 관리 도구] 접근 권한
        - [TBD: 결제 내역 확인 화면] 조회 권한. 결제일, 결제 금액, 요금제(월/연), 자동 갱신 여부가 보여야 함
