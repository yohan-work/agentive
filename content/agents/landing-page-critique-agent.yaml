id: agent-053
slug: landing-page-critique-agent
name: Landing Page Critique Agent
summary: Reviews landing pages for message clarity and conversion flow.
description: Use this agent when you need reviews landing pages for message clarity and conversion flow.
roles:
  - designer
  - marketer
  - founder
categories:
  - design
  - marketing
  - web
tags:
  - landing page
  - conversion
  - critique
difficulty: intermediate
automationLevel: 3
tools:
  - ChatGPT
  - Figma
useCases:
  - 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황
  - Prepare a landing critique before team handoff
  - Clarify assumptions, inputs, outputs, and next actions
inputs:
  - Current context
  - Goal
  - Audience or stakeholder
  - Constraints
  - Available notes or data
outputs:
  - landing critique
  - Assumptions
  - Risks
  - Recommended next actions
prompt: You are Landing Page Critique Agent. Convert the user's context into a practical landing critique. Ask only for missing information that is required. Return clear sections, assumptions, recommendations, risks, and next actions.
exampleInput: 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황
exampleOutput: A structured landing critique with practical recommendations, tradeoffs, and next steps.
limitations:
  - Quality depends on the specificity and accuracy of the provided context.
bestPractices:
  - Provide real constraints, examples, and target audience details.
  - Review the output before sharing it with customers or stakeholders.
realUseCases:
  - title: Landing Page Critique Agent 실무 활용
    context: 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황
    problem: 디자인 취향이 아니라 전환 관점의 개선 근거가 필요함
    howToUse: 현재 상황, 목표, 제약 조건, 참고 자료를 입력한 뒤 Landing Page Critique Agent에게 landing critique 형태로 정리해 달라고 요청합니다.
    exampleInput: 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황. 목표, 제약 조건, 현재 자료를 기준으로 바로 실행 가능한 landing critique을 만들어줘.
    expectedResult: landing critique 초안과 함께 가정, 리스크, 다음 액션이 정리됩니다.
    recommendedWorkflow: Content Production Flow
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Bring the page URL or copy, audience, offer, traffic source, conversion goal, and known constraints.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - landing critique
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Critique a SaaS landing page before writing a rebuild proposal.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce landing critique for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Predict conversion lift without analytics or experiment data.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황

    Goal: produce landing critique for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Landing Page Critique Agent.
  weakInputFixes:
    - weakInput: Help me with Landing Page Critique Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Critique a SaaS landing page before writing a rebuild proposal. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황. Optimize for landing critique, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended landing critique
    - A clearly labeled landing critique section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes landing critique
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Reviewing landing pages for message clarity, section order, and conversion friction
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The team needs original market research or live analytics attribution
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Recommendations can be subjective without audience, offer, and traffic source context
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Ties critique to audience intent, offer clarity, proof, CTA, and section hierarchy
    - Produces landing critique in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Landing Page Critique Agent strong-context run
      input: Critique a SaaS landing page before writing a rebuild proposal.
      expectedOutputSummary: A usable landing critique with project-specific assumptions, risks, and next steps.
      sampleOutput: "landing critique: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Landing Page Critique Agent boundary run
      input: Predict conversion lift without analytics or experiment data.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Reviewing landing pages for message clarity, section order, and conversion friction
  - question: When should I choose something else?
    guidance: The team needs original market research or live analytics attribution
  - question: What should I run next?
    guidance: After this agent produces a draft, use a planning, documentation, or QA agent to turn it into a team-ready handoff.
