runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Current context
    - Goal
    - Audience or stakeholder
    - Constraints
    - Available notes or data
  setupContextNotes:
    - Bring the page URL or copy, audience, offer, traffic source, conversion goal, and known constraints.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - landing critique
    - Assumptions
    - Risks
    - Recommended next actions
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Critique a SaaS landing page before writing a rebuild proposal.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce landing critique for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Predict conversion lift without analytics or experiment data.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황

    Goal: produce landing critique for a real project.
    Constraints: keep the result specific, structured, and ready for handoff.
  badInputExample: Help me with Landing Page Critique Agent.
  weakInputFixes:
    - weakInput: Help me with Landing Page Critique Agent.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Critique a SaaS landing page before writing a rebuild proposal. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for 외주 제안 전 고객의 기존 홈페이지 문제를 정리하는 상황. Optimize for landing critique, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended landing critique
    - A clearly labeled landing critique section
    - A clearly labeled Assumptions section
    - A clearly labeled Risks section
    - A clearly labeled Recommended next actions section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes landing critique
    - Includes Assumptions
    - Includes Risks
    - Includes Recommended next actions
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The input is too broad or lacks project context
    - The output is generic and does not mention concrete constraints
    - The result skips assumptions, risks, or next actions
    - The agent invents project facts that were not provided
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 4
  testedWith:
    - claude
  recommendedFor:
    - Reviewing landing pages for message clarity, section order, and conversion friction
    - "Teams with the required inputs ready: Current context, Goal, Audience or stakeholder"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The team needs original market research or live analytics attribution
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Some statements go beyond the input and are presented as fact, e.g. 'there is no tap-to-call button on mobile' and 'solo business owners mostly research taxes in the evening or on weekends', although the input says neither.
    - "Small counting mistakes against the pasted page: it says the top nav has 8 exits, but the input lists 7 links besides the logo."
    - "Output is long for a proposal's 'current problems' section: 7 problems plus a priority table, recommended page order, 4-week plan, assumptions, risks and next actions. The reader has to trim it."
    - Sample copy includes made-up placeholder specifics (e.g. '2019~2026년 계약 기준', '응답 ○○명', '이○○님' testimonial). They are labeled as examples, but a careless user could paste them as if real.
    - When no page content is given, the fallback is a generic SaaS checklist that can't point to anything specific until the user sends screenshots or text.
  evaluationCriteria:
    - Ties critique to audience intent, offer clarity, proof, CTA, and section hierarchy
    - Produces landing critique in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Korean critique of a pasted SaaS landing page before a pitch
      input: |-
        다음 주 외주 제안 미팅 전에 고객사 랜딩 페이지 문제를 정리하려고 합니다. 제안서에 "현재 문제" 섹션으로 들어갈 거예요.

        고객사: "스마트세무" — 1인 사업자·프리랜서 대상 세무 기장 대행 서비스(월 구독, 세무사 매칭). 목표는 무료 상담 신청 수 증가. 현재 월 방문 약 1.8만, 상담 신청 전환율 0.7%(고객사 GA 기준, 업계 평균은 2~3%라고 들음). 트래픽 60%는 모바일, 유입의 45%가 네이버 검색광고("프리랜서 종합소득세", "개인사업자 기장료").

        현재 랜딩 페이지 텍스트(위에서 아래 순서, 그대로 옮김):

        [상단 내비] 로고 | 회사소개 | 서비스 | 요금안내 | 세무칼럼 | 채용 | 로그인 | 회원가입

        [히어로]
        배경: 사무실에서 웃고 있는 정장 차림 남녀 4명 스톡 사진
        헤드라인: "세무의 새로운 기준, 스마트세무"
        서브: "혁신적인 기술과 전문성으로 고객의 성공을 함께합니다"
        버튼: [자세히 보기] (클릭 시 회사소개 페이지로 이동)

        [섹션 2 — 우리의 가치]
        아이콘 3개: "신뢰" / "전문성" / "혁신"
        각 설명: "고객과의 신뢰를 최우선으로 생각합니다" 등 한 줄씩

        [섹션 3 — 서비스]
        카드 6개: 기장대행, 종합소득세 신고, 부가세 신고, 법인 설립, 가업승계 컨설팅, 세무조사 대응
        각 카드: 제목 + 한 줄 설명 + [더보기]

        [섹션 4 — 숫자로 보는 스마트세무]
        "누적 고객 10,000+" "만족도 98%" "세무사 30명+" (출처/기준 없음)

        [섹션 5 — 요금]
        "합리적인 요금" 문구와 [요금 문의하기] 버튼만 있음. 실제 가격 없음.

        [섹션 6 — 고객 후기]
        후기 3개, 이름은 "김OO 대표님", 사진 없음, 업종 없음. 예: "정말 만족합니다. 추천해요!"

        [섹션 7 — 세무 칼럼]
        최신 글 3개: "2024년 세법 개정 총정리" 등(2년 전 글)

        [섹션 8 — 무료 상담 신청 폼]
        필드 9개: 이름, 연락처, 이메일, 사업자 유형(드롭다운 7개), 업종, 연 매출 구간, 현재 기장 여부, 문의 내용(필수, 최소 50자), 개인정보 동의(전문 스크롤 박스). 버튼 [신청하기]
        모바일에서 이 폼은 페이지 맨 아래, 스크롤 약 9화면 아래.

        [푸터] 사업자 정보, 대표 전화 1588-XXXX(평일 10~17시)

        제약: 제안서 분량상 핵심 문제 5~8개, 각 문제에 근거와 개선 방향(예시 카피 포함 가능). 디자인 리뉴얼 전체가 아니라 1차로 4주 안에 할 수 있는 개선 우선. 고객사 대표가 읽으니 기술 용어 최소화.

        원하는 결과: 청중 의도·오퍼 명확성·신뢰 근거·CTA·섹션 구조 관점의 비평, 우선순위, 가정, 리스크, 다음 액션.
      expectedOutputSummary: A Korean, low-jargon 'current problems' section of 5-8 issues about the 스마트세무 page, each with evidence from the pasted text (vague hero, CTA going to the company page, 9-field form nine screens down, hidden pricing vs the '기장료' keyword, unsourced stats, generic reviews, stale column) and fixes doable in 4 weeks. It should add a priority order, and keep assumptions, risks and next actions in separate sections.
