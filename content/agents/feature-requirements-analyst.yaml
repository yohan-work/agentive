# yaml-language-server: $schema=../../schema/agent.schema.json
id: agent-003
slug: feature-requirements-analyst
name: Feature Requirements Analyst
summary: Transforms feature ideas into implementation-ready requirements.
description: Use this agent to define behavior, acceptance criteria, edge cases, and dependencies for a feature.
roles:
  - pm
  - developer
  - planner
categories:
  - planning
  - development
tags:
  - requirements
  - acceptance criteria
  - spec
difficulty: intermediate
automationLevel: 4
tools:
  - ChatGPT
  - Linear
  - Jira
useCases:
  - Ticket writing
  - Feature scoping
  - Handoff to engineering
inputs:
  - Feature goal
  - User story
  - Constraints
  - Existing behavior
outputs:
  - Requirements
  - Acceptance criteria
  - Edge cases
  - Out of scope
prompt: You are a product requirements analyst. Ask concise clarifying questions only when required. Use the user's context, constraints, audience, and success criteria. Return a practical implementation-ready feature spec with clear sections, assumptions, risks, and next actions.
exampleInput: Add bookmark support to an agent archive without login.
exampleOutput: Requirements for localStorage bookmarks, page states, acceptance tests, and limitations.
limitations:
  - Requires current product behavior for accurate edge cases.
bestPractices:
  - State what should not change.
realUseCases:
  - title: Feature Requirements Analyst 실무 활용
    context: Ticket writing
    problem: Transforms feature ideas into implementation-ready requirements. 업무를 매번 처음부터 정리하느라 시간이 오래 걸리고 결과물 품질이 흔들립니다.
    howToUse: 현재 상황, 목표, 대상, 제약 조건을 입력한 뒤 Feature Requirements Analyst에게 Requirements 형태로 정리해 달라고 요청합니다.
    exampleInput: Add bookmark support to an agent archive without login. 목표와 제약 조건을 기준으로 바로 사용할 수 있는 결과물을 만들어줘.
    expectedResult: Requirements for localStorage bookmarks, page states, acceptance tests, and limitations.
installTargets:
  - codex
  - claude
  - cursor
runbook:
  projectContext:
    - Project goal
    - Current repository or workflow context
    - Feature goal
    - User story
    - Constraints
    - Existing behavior
  setupContextNotes:
    - Bring the feature goal, users, current behavior, constraints, and release boundary.
    - Include the target audience, output destination, and any examples of acceptable or unacceptable work.
    - Name what should remain out of scope so the agent does not broaden the task.
  inputTemplate: |-
    Project:

    Goal:

    Current context:

    Constraints:

    Available files, notes, or data:

    Expected output:
    - Requirements
    - Acceptance criteria
    - Edge cases
    - Out of scope
  starterInputs:
    - label: First useful run
      description: Use this when you know the goal but still need a structured first draft.
      value: |-
        Define requirements for installable-only filtering and quality score badges.

        Context:
        - Current state:
        - Constraints:
        - Audience:
        - Success criteria:
    - label: Project handoff run
      description: Use this when the output will be pasted into a ticket, PR, document, or project brief.
      value: |-
        Goal: produce Requirements for a real project.
        Source material:
        - 
        Constraints:
        - 
        Review needs:
        - Call out assumptions.
        - Flag missing context.
        - End with concrete next actions.
    - label: Boundary check
      description: Use this when the request may be under-specified and you want the agent to narrow it safely.
      value: |-
        Write requirements for an undefined AI platform pivot.

        Before producing the final answer, identify missing required context and propose a stronger prompt if needed.
  goodInputExample: |-
    Feature goal: add role-specific starter packs to /install.
    Users: developers, PMs, designers, operations owners.
    Constraints: static data only, use existing agents and card components.
    Expected output: requirements, acceptance criteria, edge cases, and out-of-scope notes.
  badInputExample: Add some recommendations to the install page.
  weakInputFixes:
    - weakInput: Help me with Feature Requirements Analyst.
      whyItFails: It does not name the project, source material, constraints, audience, or success criteria.
      strongerInput: Define requirements for installable-only filtering and quality score badges. Include current context, constraints, expected output, and review criteria.
    - weakInput: Make this better.
      whyItFails: The agent cannot tell whether better means clearer, safer, faster, more complete, or easier to hand off.
      strongerInput: Improve the output for Ticket writing. Optimize for Requirements, keep assumptions explicit, and list the changes made.
  expectedOutputShape:
    - A short summary of the recommended Requirements
    - A clearly labeled Requirements section
    - A clearly labeled Acceptance criteria section
    - A clearly labeled Edge cases section
    - A clearly labeled Out of scope section
    - Assumptions and missing context separated from confirmed facts
    - Risks, review checkpoints, and concrete next actions
  outputChecklist:
    - Includes Requirements
    - Includes Acceptance criteria
    - Includes Edge cases
    - Includes Out of scope
    - States assumptions separately from confirmed facts
    - Lists concrete next actions
    - Calls out risks or missing context
  failureModes:
    - The output does not define which user problem the feature solves
    - Acceptance criteria do not mention empty or missing-agent states
    - Scope creep introduces personalization or accounts
  handoffTips:
    - Paste relevant project files, notes, or constraints before asking for the final output.
    - Ask for a first draft, then request a stricter revision using the checklist.
    - Keep the generated output with the project ticket, PR, proposal, or team document.
evaluation:
  qualityScore: 5
  testedWith:
    - codex
    - claude
    - cursor
  recommendedFor:
    - Converting a known feature goal into acceptance criteria and implementation boundaries
    - "Teams with the required inputs ready: Feature goal, User story, Constraints"
    - Project work where a human owner will review assumptions, risks, and final output
  notRecommendedFor:
    - The team still needs discovery research before choosing the feature
    - Fully autonomous production changes without human review
    - Work requiring legal, financial, medical, compliance, or security certification
  knownWeaknesses:
    - Can create excessive edge cases if release size and target platform are omitted
    - Output quality drops when constraints, source material, or target audience are omitted
    - Final decisions still need review by the project owner
  evaluationCriteria:
    - Produces testable acceptance criteria, edge cases, dependencies, and out-of-scope notes
    - Produces Requirements in a format that can be pasted into a ticket, PR, document, or handoff
    - States assumptions, missing context, risks, and concrete next actions separately
  sampleRuns:
    - title: Feature Requirements Analyst strong-context run
      input: Define requirements for installable-only filtering and quality score badges.
      expectedOutputSummary: A usable Requirements with project-specific assumptions, risks, and next steps.
      sampleOutput: "Requirements: a structured response grounded in the supplied scenario, with explicit constraints, review checkpoints, and owner-ready next actions."
      reviewNotes:
        - Confirm the output references the supplied scenario instead of generic advice.
        - Check that assumptions and missing context are separated from confirmed facts.
        - Verify the result can be reused in the project artifact named by the request.
    - title: Feature Requirements Analyst boundary run
      input: Write requirements for an undefined AI platform pivot.
      expectedOutputSummary: A cautious response that narrows scope, asks for missing required context, and avoids pretending the task is fully specified.
      sampleOutput: The agent should identify missing inputs, explain why the request is under-specified, propose a tighter next prompt, and avoid final claims that require unavailable evidence.
      reviewNotes:
        - The agent should not invent project facts to fill missing context.
        - The response should make the next user action clear.
        - A strong output refuses false certainty while still moving the work forward.
decisionGuide:
  - question: Is this the right agent for my task?
    guidance: Converting a known feature goal into acceptance criteria and implementation boundaries
  - question: When should I choose something else?
    guidance: The team still needs discovery research before choosing the feature
    alternativeAgentSlug: codex-task-brief
  - question: What should I run next?
    guidance: After this agent produces a draft, use a review or QA agent to check regressions, assumptions, and missing tests.
    alternativeAgentSlug: qa-checklist-agent
relatedAgents:
  - codex-task-brief
  - qa-checklist-agent
verifiedStatus: expert
updatedAt: 2026-07-01
