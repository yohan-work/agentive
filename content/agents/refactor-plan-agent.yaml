        - "Real run on 2026-09-29: Claude Opus 5.5 with the agent prompt as instructions and this input, single turn, no tools. Graded by a separate Claude reviewer against the evaluation criteria; not yet reviewed by a human maintainer."
        - "Strength: the opening paragraph clearly refuses the big-bang premise and explains why ('there's no way to verify whether existing behavior broke'). It proposes 'protect this deploy, then refactor in stages after it' instead of silently complying."
        - "Strength: it asks exactly four focused questions and ranks 'what goes into next week's deploy' as the most important. It lists assumptions separately and labels the plan as a general draft to be made specific once the answers arrive."
        - "Strength: it still moves the work forward with a concrete stage 0 for this week: a freeze on the deploy branch, 3-5 smoke tests on critical flows, formatter changes in separate commits, a backlog scored by change frequency x bug frequency, and a rehearsed rollback."
        - "Weakness: most of stages 2-3 is generic refactoring advice (boy-scout rule, Strangler Fig, ordered techniques, a 20% cap) that would fit any codebase. Nothing here is a verification command, though that follows unavoidably from the missing stack."
        - "Minor: the closing offer of a 'scoped-down plan if a structural change must go in this week' is only offered, not sketched. A one-line version of it would have served a user who really is bound by the deadline."
